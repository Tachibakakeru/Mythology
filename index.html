});
function botY(n){ return n.py + n.h; }
function midY(n){ return n.py + n.h/2; }

// 分類框（量到真實節點高度後才畫，並保留標籤自己的空間）
const placedLabels = []; // 已放置的標籤 bbox，用來避免標籤互相重疊
GROUPS.forEach(([label, ids, color, drawBox=true], gi)=>{
  const members = ids.map(id=>nodes[id]).filter(Boolean);
  if(!members.length) return;
  if(!drawBox) return;
  let x0 = Math.min(...members.map(n=>n.px))-16;
  let y0 = Math.min(...members.map(n=>n.py))-34;
  const x1 = Math.max(...members.map(n=>n.px+NODE_W))+16;
  const y1 = Math.max(...members.map(n=>botY(n)))+12;
  // 成員散布各處時，外接矩形圈進來的外人比成員還多，畫出來只會誤導
  // → 改成只放一個可點擊的標記，群組本身仍可搜尋、點選、高亮
  const memberSet = new Set(ids);
  const intruders = Object.values(nodes).filter(n=>!memberSet.has(n.id) &&
    n.px+NODE_W>x0 && n.px<x1 && n.py+(n.h||NODE_H)>y0 && n.py<y1);
  const markerOnly = intruders.length > members.length;
  const box = document.createElement('div');
  box.className='groupbox';
  box.dataset.gi = gi;
  if(markerOnly){
    const anchorN = members.reduce((a,b)=> (b.py<a.py || (b.py===a.py && b.px<a.px)) ? b : a);
    box.classList.add('marker-only');
    x0 = anchorN.px; y0 = anchorN.py-30;
    box.style.left=x0+'px'; box.style.top=y0+'px';
    box.style.width='0px'; box.style.height='0px';
  } else {
    box.style.left=x0+'px'; box.style.top=y0+'px';
    box.style.width=(x1-x0)+'px'; box.style.height=(y1-y0)+'px';
    box.style.border = `1.5px dashed ${hexToRgba(color,.55)}`;
    box.style.background = hexToRgba(color,.07);
  }
  const lab = document.createElement('div');
  lab.className='glabel';
  lab.style.background = color;
  lab.style.color = '#1a1a1a';
  lab.textContent = label;
  lab.title = '點擊只顯示此群組';
  lab.addEventListener('click', ev=>{
    ev.stopPropagation();
    if(selectedGroupIdx===gi) clearHighlight(); else highlightGroup(gi);
  });
  box.appendChild(lab);
  stage.appendChild(box);
  // 標籤擺在不會壓到任何神明方塊或其他群組標籤的位置
  const bw = x1-x0, bh = y1-y0, lw = lab.offsetWidth, lh = lab.offsetHeight;
  const hit = (lx,ly)=>{
    const ax=x0+lx, ay=y0+ly, ax2=ax+lw, ay2=ay+lh;
    if(Object.values(nodes).some(n=>ax<n.px+NODE_W-2&&ax2>n.px+2&&ay<n.py+n.h-2&&ay2>n.py+2)) return true;
    if(placedLabels.some(r=>ax<r.x2-2&&ax2>r.x1+2&&ay<r.y2-2&&ay2>r.y1+2)) return true;
    return false;
  };
  const cands = [[10,-13],[bw-lw-10,-13],[(bw-lw)/2,-13],
                 [bw+8,-13],[-lw-8,-13],            // 貼在框外的左右側
                 [bw+8,6],[-lw-8,6],
                 [bw+8,bh-lh-6],[-lw-8,bh-lh-6]];
  for(let k=1;k<=14;k++) cands.push([10,-13-k*(lh+5)], [bw-lw-10,-13-k*(lh+5)]);  // 逐階往上找空位
  const ok = cands.find(([lx,ly])=>!hit(lx,ly)) || cands[0];
  lab.style.left = ok[0]+'px';
  lab.style.top  = ok[1]+'px';
  placedLabels.push({x1:x0+ok[0], y1:y0+ok[1], x2:x0+ok[0]+lw, y2:y0+ok[1]+lh});
});

/* ---- 連線佈線：先避開節點方塊，再於交叉處「跳線」 ---- */
const boxes = Object.values(nodes).map(n=>({id:n.id, x1:n.px, y1:n.py, x2:n.px+NODE_W, y2:n.py+n.h}));
const PAD_H = 6;   // 線與方塊的最小淨距

function hBlocked(y, xa, xb, skip){
  const lo=Math.min(xa,xb), hi=Math.max(xa,xb);
  return boxes.some(b=> !skip.includes(b.id) &&
    b.x1 < hi-1 && b.x2 > lo+1 && y > b.y1-PAD_H && y < b.y2+PAD_H);
}
function vBlocked(x, ya, yb, skip){
  const lo=Math.min(ya,yb), hi=Math.max(ya,yb);
  return boxes.some(b=> !skip.includes(b.id) &&
    b.y1 < hi-1 && b.y2 > lo+1 && x > b.x1-PAD_H && x < b.x2+PAD_H);
}
function clearY(y0, xa, xb, skip){
  for(let i=0;i<40;i++){ const y=y0+i*8; if(!hBlocked(y,xa,xb,skip)) return y; }
  return y0;
}
// 往指定方向找一條淨空的水平帶，找不到回傳 null
function clearBand(y0, xa, xb, skip, dir){
  for(let i=0;i<70;i++){ const y=y0+dir*i*8; if(!hBlocked(y,xa,xb,skip)) return y; }
  return null;
}
function clearX(x0, ya, yb, skip, dir){
  for(let i=0;i<40;i++){ const x=x0+dir*i*7; if(!vBlocked(x,ya,yb,skip)) return x; }
  return x0;
}
// 由 x0 向兩側交錯搜尋一條完全淨空的垂直走廊，找不到回傳 null
function findChannel(x0, ya, yb, skip){
  if(!vBlocked(x0, ya, yb, skip)) return x0;
  for(let i=1;i<=130;i++){
    for(const dir of [-1,1]){
      const x = x0 + dir*i*6;
      if(!vBlocked(x, ya, yb, skip)) return x;
    }
  }
  return null;
}

// 把折線轉成平行位移的折線（用於雙線婚姻）
function offsetPoly(pts, d){
  return pts.map((p,i)=>{
    const prev=pts[i-1], next=pts[i+1];
    let dx=0, dy=0;
    const mark=(a,b)=>{ if(!a||!b) return; if(Math.abs(a[1]-b[1])<0.5) dy=d; else dx=d; };
    mark(prev,p); mark(p,next);
    return [p[0]+dx, p[1]+dy];
  });
}

const vSegs=[], hSegs=[];            // 供跳線計算
const spouseDraws=[], childDraws=[], labelDraws=[];

function registerPoly(pts, uid){
  for(let i=0;i+1<pts.length;i++){
    const [x1,y1]=pts[i], [x2,y2]=pts[i+1];
    if(Math.abs(y1-y2)<0.5) hSegs.push({y:y1, x1:Math.min(x1,x2), x2:Math.max(x1,x2), uid});
    else vSegs.push({x:x1, y1:Math.min(y1,y2), y2:Math.max(y1,y2), uid});
  }
}

UNIONS.forEach((u,uid)=>{
  let anchor;
  if(u.spouses){
    const a = nodes[u.spouses[0]], b = nodes[u.spouses[1]];
    if(!a||!b) return;
    const skip=[a.id,b.id];
    const sameRow = Math.abs(midY(a)-midY(b)) < 24;
    let pts;
    if(sameRow){
      const L = a.px<b.px?a:b, R = a.px<b.px?b:a;
      const y = (midY(a)+midY(b))/2;
      const x1 = L.px+NODE_W, x2 = R.px;
      if(!hBlocked(y, x1, x2, skip)){
        pts = [[x1,y],[x2,y]];                       // 直線
        anchor = {x:(x1+x2)/2, y};
      } else {                                        // 有神明擋路 → 從下方繞道
        const s1 = x1+14, s2 = x2-14;
        const dy = clearY(Math.max(botY(L), botY(R))+22, s1, s2, skip);
        pts = [[x1,y],[s1,y],[s1,dy],[s2,dy],[s2,y],[x2,y]];
        anchor = {x:(s1+s2)/2, y:dy};                 // 子嗣從繞道段往下拉，才不會穿過中間的神明
      }
    } else {                                          // 不同列 → 走欄／列之間的空隙
      const hi = a.py<b.py?a:b, lo = a.py<b.py?b:a;
      const exitX = clearX(centerX(hi)+22, botY(hi), botY(hi)+30, skip, 1);
      const gy = clearY(botY(hi)+20, exitX, centerX(lo), skip);
      const fromLeft = centerX(hi) < centerX(lo);
      const chX = clearX(fromLeft ? lo.px-18 : lo.px+NODE_W+18, gy, midY(lo), skip, fromLeft?-1:1);
      const endX = fromLeft ? lo.px : lo.px+NODE_W;
      pts = [[exitX,botY(hi)],[exitX,gy],[chX,gy],[chX,midY(lo)],[endX,midY(lo)]];
      anchor = {x:chX, y:gy};
    }
    const style = u.marriage==='primary' ? 'primary' : (u.marriage||'secondary');
    const polys = style==='primary' ? [offsetPoly(pts,-3), offsetPoly(pts,3)] : [pts];
    polys.forEach(p=>{ registerPoly(p, uid); spouseDraws.push({uid, pts:p, style}); });
    if(u.label) labelDraws.push({x:anchor.x-30, y:anchor.y-9, text:u.label, cls:u.labelClass, uid});
  } else if(u.parent){
    const p = nodes[u.parent];
    if(!p) return;
    anchor = {x:centerX(p), y:botY(p)};
    if(u.label) labelDraws.push({x:anchor.x-30, y:anchor.y+6, text:u.label, cls:u.labelClass, uid});
  }
  if(!anchor || !u.children) return;

  const kids = u.children.map(id=>nodes[id]).filter(Boolean);
  // 讓開的位置必須先低於父母那一列，否則橫向讓開時會切過父母的方塊
  const parents = (u.spouses||[u.parent]).map(id=>nodes[id]).filter(Boolean);
  const parentFloor = Math.max(...parents.map(botY)) + 12;
  // 主幹若會穿過別的神明方塊，先橫向讓開再沿淨空走廊往下
  function trunkTo(busY, skip){
    if(!vBlocked(anchor.x, anchor.y, busY, skip)) return [[anchor.x,anchor.y],[anchor.x,busY]];
    const stubY = clearBand(Math.max(anchor.y+14, parentFloor), anchor.x-280, anchor.x+280, skip, 1);
    if(stubY===null || stubY>=busY || vBlocked(anchor.x, anchor.y, stubY, skip))
      return [[anchor.x,anchor.y],[anchor.x,busY]];
    const x = findChannel(anchor.x, stubY, busY, skip);
    if(x===null || hBlocked(stubY, anchor.x, x, skip)) return [[anchor.x,anchor.y],[anchor.x,busY]];
    return [[anchor.x,anchor.y],[anchor.x,stubY],[x,stubY],[x,busY]];
  }
  // 橫幹盡量貼近孩子，長距離垂直才不會穿過中間的神明
  function routeTo(tx, ty, skip, c){
    if(Math.abs(anchor.x-tx) < 2 && anchor.y < ty-2 && !vBlocked(tx, anchor.y, ty, skip))
      return [[tx,anchor.y],[tx,ty]];
    for(let i=0;i<20;i++){
      const busY = Math.max(anchor.y+10, ty-18-i*9);
      const trunk = trunkTo(busY, skip);
      const lastX = trunk[trunk.length-1][0];
      if(!hBlocked(busY,lastX,tx,skip) && !vBlocked(tx,busY,ty,skip) && !vBlocked(lastX,anchor.y,busY,skip))
        return [...trunk, [tx,busY], [tx,ty]];
      if(busY <= anchor.y+10) break;
    }
    // 從上方進不來 → 改走走廊、從孩子的側邊接入
    if(c){
      const my = midY(c);
      for(const side of [-1,1]){
        const ex = side<0 ? c.px : c.px+NODE_W;
        const chX = findChannel(ex+side*20, Math.min(anchor.y,my), Math.max(anchor.y,my), skip);
        if(chX===null) continue;
        const stubY = clearBand(Math.max(anchor.y+14, parentFloor), Math.min(anchor.x,chX)-10, Math.max(anchor.x,chX)+10, skip, 1);
        if(stubY===null || stubY>=my) continue;
        if(vBlocked(anchor.x,anchor.y,stubY,skip) || hBlocked(stubY,anchor.x,chX,skip)) continue;
        if(vBlocked(chX,stubY,my,skip) || hBlocked(my,chX,ex,skip)) continue;
        return [[anchor.x,anchor.y],[anchor.x,stubY],[chX,stubY],[chX,my],[ex,my]];
      }
    }
    const busY = Math.max(anchor.y+10, ty-18);
    return [...trunkTo(busY, skip), [tx,busY], [tx,ty]];
  }
  // 同一欄堆疊的兄弟姊妹 → 用「梳狀」主幹＋側邊短枝，避免橫線切過兄姊的方塊
  const byCol = new Map();
  kids.forEach(c=>{ const k=Math.round(c.px); if(!byCol.has(k)) byCol.set(k,[]); byCol.get(k).push(c); });
  byCol.forEach((list, colPx)=>{
    const ids = list.map(c=>c.id);
    const skip = ids;   // 只讓線穿過「自己要連到的孩子」，父母與旁人一律避開
    if(list.length===1){
      const c = list[0];
      const pts = routeTo(centerX(c), c.py, skip, c);
      registerPoly(pts, uid); childDraws.push({uid, pts});
      return;
    }
    // 同一欄堆疊的兄弟姊妹 → 左側主幹＋側邊短枝
    list.sort((p,q)=>p.py-q.py);
    const first = list[0], last = list[list.length-1];
    // 主幹要「繞著」兄弟姊妹走，所以這裡不能略過他們的方塊
    const spineX = findChannel(colPx-20, Math.min(anchor.y, midY(first)), midY(last), [])
                ?? clearX(colPx-20, anchor.y, midY(last), [], -1);
    const trunk = routeTo(spineX, midY(first), []).slice(0,-1).concat([[spineX,midY(last)]]);
    registerPoly(trunk, uid); childDraws.push({uid, pts:trunk});
    list.forEach(c=>{
      const ex = spineX < c.px ? c.px : c.px+NODE_W;   // 接到靠近主幹的那一邊，才不會橫穿孩子自己
      const stub = [[spineX,midY(c)],[ex,midY(c)]];
      registerPoly(stub, uid); childDraws.push({uid, pts:stub});
    });
  });
});

/* 跳線：水平線遇到別人的垂直線時，畫半圓弧跨過 */
const EPS=2, R=7, MIN_RUN=34, EDGE_GAP=15;
function bumpsFor(y, xa, xb, uid){
  const lo=Math.min(xa,xb), hi=Math.max(xa,xb);
  if(hi-lo < MIN_RUN) return [];
  const xs=[];
  vSegs.forEach(v=>{
    if(v.uid===uid) return;
    if(v.x > lo+EDGE_GAP && v.x < hi-EDGE_GAP && y > v.y1+EPS && y < v.y2-EPS) xs.push(v.x);
  });
  xs.sort((p,q)=>p-q);
  const merged=[];
  xs.forEach(x=>{ if(!merged.length || x-merged[merged.length-1] > 2*R+4) merged.push(x); });
  return merged;
}
function polyPath(pts, uid){
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i+1<pts.length;i++){
    const [x1,y1]=pts[i], [x2,y2]=pts[i+1];
    if(Math.abs(y1-y2)>=0.5){ d += ` L${x2},${y2}`; continue; }
    const dir = x2>=x1 ? 1 : -1;
    bumpsFor(y1,x1,x2,uid).sort((p,q)=> dir>0?p-q:q-p).forEach(bx=>{
      d += ` L${bx-dir*R},${y1} A${R},${R} 0 0 1 ${bx+dir*R},${y1}`;
    });
    d += ` L${x2},${y2}`;
  }
  return d;
}
function drawPoly(pts, uid, cls, dash){
  const d = polyPath(pts, uid);
  // visible path
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d', d);
  path.setAttribute('class', cls);
  path.dataset.uid = uid;
  if(dash) path.setAttribute('stroke-dasharray', dash);
  svg.appendChild(path);
  // invisible wide hit-area path for easier clicking
  const hit = document.createElementNS('http://www.w3.org/2000/svg','path');
  hit.setAttribute('d', d);
  hit.setAttribute('stroke', 'transparent');
  hit.setAttribute('stroke-width', '14');
  hit.setAttribute('fill', 'none');
  hit.style.cursor = 'pointer';
  hit.dataset.uid = uid;
  svg.appendChild(hit);
}
childDraws.forEach(cd=> drawPoly(cd.pts, cd.uid, 'edge'));
spouseDraws.forEach(s=> drawPoly(s.pts, s.uid,
  'edge '+(s.style==='partner'?'partner-line':'marriage'),
  s.style==='partner' ? '5 4' : null));

const placedEdgeLabels = [];
labelDraws.forEach(l=>{
  const lab = document.createElement('div');
  lab.className='edge-label '+(l.cls||'');
  lab.dataset.uid = l.uid;
  lab.textContent = l.text;
  lab.style.left=l.x+'px'; lab.style.top=l.y+'px';
  stage.appendChild(lab);
  // 說明會疊到別的說明、也會被神明方塊蓋住 → 兩者都要避開
  const w = lab.offsetWidth, h = lab.offsetHeight;
  const nodeList = Object.values(nodes);
  const hits = (px,py)=>
    placedEdgeLabels.some(r=>px<r.x2-1 && px+w>r.x1+1 && py<r.y2-1 && py+h>r.y1+1) ||
    nodeList.some(n=>px<n.px+NODE_W-2 && px+w>n.px+2 && py<n.py+(n.h||NODE_H)-2 && py+h>n.py+2);
  let x = l.x, y = l.y, placed = !hits(x,y);
  // 先原地上下找，再左右挪開
  for(let k=0; !placed && k<20; k++){
    y = l.y + (k%2 ? 1 : -1) * Math.ceil((k+1)/2)*(h+4);
    placed = !hits(x,y);
  }
  for(let k=0; !placed && k<14; k++){
    x = l.x + (k%2 ? 1 : -1) * Math.ceil((k+1)/2)*(w*0.6+10);
    for(let j=0; j<8 && !placed; j++){
      y = l.y + (j%2 ? 1 : -1) * Math.ceil((j+1)/2)*(h+4);
      placed = !hits(x,y);
    }
  }
  if(!placed){ x = l.x; y = l.y; }
  lab.style.left = x+'px';
  lab.style.top  = y+'px';
  placedEdgeLabels.push({x1:x, y1:y, x2:x+w, y2:y+h});
});
if(!wasOpen) japanEl.style.display = 'none';   // 量測完畢，回到原本的顯示狀態
}

/* ============ 平移縮放（拖曳/滾輪為即時，按鈕/搜尋為平滑過渡） ============ */
const wrap = document.getElementById('canvasWrap');
let scale=1, tx=40, ty=40;
let dragging=false, lastX, lastY, moved=false;

function setSmooth(on){ stage.classList.toggle('smooth', on); }
function applyTransform(){ stage.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }

function fitInitial(smooth){
  const r = wrap.getBoundingClientRect();
  scale = Math.min(1, (r.width-80)/totalW, (r.height-80)/totalH);
  scale = Math.max(scale, 0.14);
  const scaledW = totalW*scale, scaledH = totalH*scale;
  tx = scaledW < r.width  ? (r.width  - scaledW) / 2 : 40;
  ty = scaledH < r.height ? (r.height - scaledH) / 2 : 40;
  setSmooth(!!smooth);
  applyTransform();
}

wrap.addEventListener('mousedown', e=>{
  dragging=true; moved=false; lastX=e.clientX; lastY=e.clientY; wrap.classList.add('grabbing');
  setSmooth(false);
});
window.addEventListener('mouseup', ()=>{ dragging=false; wrap.classList.remove('grabbing'); });
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  moved=true;
  tx += (e.clientX-lastX); ty += (e.clientY-lastY);
  lastX=e.clientX; lastY=e.clientY;
  applyTransform();
});
wrap.addEventListener('wheel', e=>{
  e.preventDefault();
  setSmooth(false);
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  const factor = e.deltaY<0 ? 1.1 : 0.9;
  zoomAt(mx,my,factor);
}, {passive:false});

function zoomAt(mx,my,factor){
  const newScale = Math.min(3, Math.max(0.1, scale*factor));
  const ratio = newScale/scale;
  tx = mx - (mx-tx)*ratio;
  ty = my - (my-ty)*ratio;
  scale = newScale;
  applyTransform();
}

/* ---- 觸控（手機／平板）：單指拖曳平移、雙指縮放 ---- */
let touchMode = null; // 'pan' | 'pinch'
let pinchStartDist = 0, pinchStartScale = 1, pinchCx = 0, pinchCy = 0;
function touchDist(a,b){ return Math.hypot(b.clientX-a.clientX, b.clientY-a.clientY); }
wrap.addEventListener('touchstart', e=>{
  setSmooth(false);
  if(e.touches.length===1){
    touchMode='pan'; dragging=true; moved=false;
    lastX=e.touches[0].clientX; lastY=e.touches[0].clientY;
  } else if(e.touches.length===2){
    touchMode='pinch'; dragging=false;
    const rect = wrap.getBoundingClientRect();
    pinchStartDist = touchDist(e.touches[0], e.touches[1]);
    pinchStartScale = scale;
    pinchCx = (e.touches[0].clientX+e.touches[1].clientX)/2 - rect.left;
    pinchCy = (e.touches[0].clientY+e.touches[1].clientY)/2 - rect.top;
  }
}, {passive:true});
wrap.addEventListener('touchmove', e=>{
  if(touchMode==='pan' && e.touches.length===1){
    e.preventDefault();
    moved=true;
    const t=e.touches[0];
    tx += (t.clientX-lastX); ty += (t.clientY-lastY);
    lastX=t.clientX; lastY=t.clientY;
    applyTransform();
  } else if(touchMode==='pinch' && e.touches.length===2){
    e.preventDefault();
    const dist = touchDist(e.touches[0], e.touches[1]);
    const newScale = Math.min(3, Math.max(0.1, pinchStartScale*(dist/pinchStartDist)));
    const ratio = newScale/scale;
    tx = pinchCx - (pinchCx-tx)*ratio;
    ty = pinchCy - (pinchCy-ty)*ratio;
    scale = newScale;
    applyTransform();
  }
}, {passive:false});
wrap.addEventListener('touchend', e=>{
  if(e.touches.length===0){ touchMode=null; dragging=false; }
  else if(e.touches.length===1){ touchMode='pan'; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; }
});
function zoomBy(factor){
  setSmooth(true);
  const rect = wrap.getBoundingClientRect();
  zoomAt(rect.width/2, rect.height/2, factor);
}

/* ============ 共用：附圖 + 自訂欄位（神明／妖怪兩邊共用） ============ */
const EDIT_SCRATCH = {};   // 編輯中的暫存陣列，key 為容器 id
function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// localStorage 只有數 MB，原圖直接存會超出配額導致所有編輯一起遺失，故先縮圖
const MAX_IMG_W = 1000;
function readImageScaled(file){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const sc = Math.min(1, MAX_IMG_W/img.width);
        const c = document.createElement('canvas');
        c.width  = Math.max(1, Math.round(img.width *sc));
        c.height = Math.max(1, Math.round(img.height*sc));
        const ctx = c.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); // ponytail: 轉 JPEG 前補白底，否則透明 PNG 會變黑
        ctx.drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',0.82));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function saveNodeEdit(){
  if(!editingNodeId) return;
  const id = editingNodeId;
  const aliasRaw = document.getElementById('pe-aliases').value;
  const ov = {
    name:         document.getElementById('pe-name').value.trim()||undefined,
    kana:         document.getElementById('pe-kana').value.trim()||undefined,
    role:         document.getElementById('pe-role').value.trim()||undefined,
    kojiki:       document.getElementById('pe-kojiki').value.trim()||undefined,
    nihonshoki:   document.getElementById('pe-nihonshoki').value.trim()||undefined,
    reading:      document.getElementById('pe-reading').value.trim()||undefined,
    aliases:      aliasRaw.trim() ? aliasRaw.split(/[，,、]+/).map(s=>s.trim()).filter(Boolean) : undefined,
    desc:         document.getElementById('pe-desc').value.trim()||undefined,
  };
  Object.keys(ov).forEach(k=>{ if(ov[k]===undefined) delete ov[k]; });
  const rec = USER_EDITS_LIVE[id] = Object.assign(USER_EDITS_LIVE[id]||{}, ov);
  // 自訂欄位／附圖：全部刪光時要真的清掉，故明確指派
  const custom = cleanRows('pe-fields'), images = cleanRows('pe-imgs');
  if(custom.length) rec.custom = custom; else delete rec.custom;
  if(images.length) rec.images = images; else delete rec.images;
  if(!saveLS(EDITS_KEY, USER_EDITS_LIVE)) return;
  // Patch in-memory node
  const n = nodes[id];
  if(ov.name) n.name=ov.name;
  if(ov.kana) n.kana=ov.kana;
  if(ov.role) n.role=ov.role;
  if(ov.desc) n.desc=ov.desc;
  // Patch live NODE_NAMES
  if(!NODE_NAMES[id]) NODE_NAMES[id]={};
  ['kojiki','nihonshoki','reading','aliases'].forEach(k=>{ if(ov[k]!==undefined) NODE_NAMES[id][k]=ov[k]; });
  // Patch visible node card
  const div = document.querySelector(`.node[data-id="${id}"]`);
  if(div){
    const ne = div.querySelector('.name'); if(ne) ne.textContent = n.name;
    const ke = div.querySelector('.kana'); if(ke) ke.textContent = n.kana||'';
    const re = div.querySelector('.role'); if(re) re.textContent = n.role||'';
  }
  cancelNodeEdit();
  openPanel(n);
}
function resetNodeEdit(){
  if(!editingNodeId) return;
  const id = editingNodeId;
  delete USER_EDITS_LIVE[id];
  saveLS(EDITS_KEY, USER_EDITS_LIVE);
  const orig = NODE_DEFS.find(d=>d[0]===id);
  if(orig){
    const n = nodes[id];
    n.name=orig[1]; n.kana=orig[2]; n.role=orig[3]; n.desc=orig[6];

  openPanel(nodes[id]);
}

/* ============ 搜尋 + 定位縮放（平滑過渡＋高亮） ============ */
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

let selectedUnionId = null;
let selectedGroupIdx = null;
function clearHighlight(){
  document.querySelectorAll('.node').forEach(d=>d.classList.remove('highlight','dim'));
  document.querySelectorAll('.edge').forEach(p=>p.classList.remove('hl','dim-edge'));
  document.querySelectorAll('.groupbox').forEach(b=>b.classList.remove('hl','dim-box'));
  document.querySelectorAll('.edge-label').forEach(l=>l.classList.remove('dim-label'));
  selectedUnionId = null;
  selectedGroupIdx = null;
}
// 血緣線與說明文字只留下與選取對象有關的那些，其餘淡化
function dimLinesExcept(isRelated){
  document.querySelectorAll('.edge-label').forEach(l=>{
    l.classList.toggle('dim-label', !isRelated(UNIONS[+l.dataset.uid], +l.dataset.uid));
  });
  document.querySelectorAll('.edge').forEach(e=>{
    e.classList.toggle('dim-edge', !isRelated(UNIONS[+e.dataset.uid], +e.dataset.uid));
  });
}
// 一段關係只要有任一端落在選取範圍內就算相關
function unionTouches(u, ids){
  return !!u && [...(u.spouses||[]), u.parent, ...(u.children||[])].some(id=>ids.has(id));
}
function highlightUnion(uid){
  selectedUnionId = uid;
  document.querySelectorAll('.edge-label').forEach(l=>l.classList.toggle('dim-label', +l.dataset.uid !== uid));
  const u = UNIONS[uid];
  if(!u) return;
  const relIds = new Set([...(u.spouses||[]), u.parent, ...(u.children||[])].filter(Boolean));
  document.querySelectorAll('.node').forEach(d=>{
    d.classList.toggle('dim', !relIds.has(d.dataset.id));
    d.classList.toggle('highlight', relIds.has(d.dataset.id));
  });
  document.querySelectorAll('.edge').forEach(p=>{
    const puid = parseInt(p.dataset.uid);
    p.classList.toggle('hl', puid===uid);
    p.classList.toggle('dim-edge', puid!==uid);
  });
}
function fitGroup(memberNodes){
  if(!memberNodes.length) return;
  const rect = wrap.getBoundingClientRect();
  const pad = 80;
  const x0 = Math.min(...memberNodes.map(n=>n.px));
  const y0 = Math.min(...memberNodes.map(n=>n.py));
  const x1 = Math.max(...memberNodes.map(n=>n.px+NODE_W));
  const y1 = Math.max(...memberNodes.map(n=>n.py+(n.h||NODE_H)));
  const cw = x1-x0, ch = y1-y0;
  scale = Math.min(1.5, (rect.width-pad*2)/cw, (rect.height-pad*2)/ch);
  scale = Math.max(scale, 0.14);
  tx = rect.width/2  - (x0+cw/2)*scale;
  ty = rect.height/2 - (y0+ch/2)*scale;
  setSmooth(true);
  applyTransform();
}
function highlightGroup(idx){
  clearHighlight();
  const g = GROUPS[idx];
  if(!g) return;
  selectedGroupIdx = idx;
  const gIds = new Set(g[1]);
  dimLinesExcept(u=> unionTouches(u, gIds));
  document.querySelectorAll('.groupbox').forEach(b=>b.classList.toggle('dim-box', +b.dataset.gi !== idx));
  document.querySelectorAll('.node').forEach(d=>d.classList.toggle('dim',!gIds.has(d.dataset.id)));
  document.querySelectorAll(`.groupbox[data-gi="${idx}"]`).forEach(b=>b.classList.add('hl'));
  fitGroup(g[1].map(id=>nodes[id]).filter(Boolean));
}
svg.addEventListener('click', e=>{
  e.stopPropagation();
  if(moved) return; // pan gesture — don't clear selection
  const path = e.target.closest('path[data-uid]');
  if(!path){ clearHighlight(); return; }
  const uid = parseInt(path.dataset.uid);
  if(selectedUnionId===uid){ clearHighlight(); return; }
  highlightUnion(uid);
});

function focusNode(id){
  const n = nodes[id];
  if(!n) return;
  clearHighlight();
  dimLinesExcept(u=> unionTouches(u, new Set([id])));
  const div = document.querySelector(`.node[data-id="${id}"]`);
  if(div) div.classList.add('highlight');
  const rect = wrap.getBoundingClientRect();
  setSmooth(true);
  scale = Math.min(1.6, Math.max(scale, 1.3));
  tx = rect.width/2 - centerX(n)*scale;
  ty = rect.height/2 - centerY(n)*scale;
  applyTransform();
  openPanel(n);
}

function matchGroups(q){
  return GROUPS.map((g,i)=>({idx:i,label:g[0]})).filter(g=>g.label.includes(q));
}
// 日文舊字體／繁體中文常見異體字，搜尋時視為相同（例：彦／彥）
const KANJI_VARIANTS = {'彦':'彥','応':'應','顕':'顯','継':'繼'};
function normKanji(s){
  return s.replace(/[彦応顕継]/g, ch => KANJI_VARIANTS[ch] || ch);
}
function matchNodes(q){
  q = normKanji(q.toLowerCase().replace(/ /g,''));
  return Object.values(nodes).filter(n =>{
    const nn = NODE_NAMES[n.id]||{};
    const reading = normKanji((nn.reading||'').replace(/ の /g,'の').replace(/ /g,''));
    return normKanji(n.name.toLowerCase()).includes(q) ||
      (n.kana||'').toLowerCase().replace(/ /g,'').includes(q) ||
      normKanji((n.role||'').toLowerCase()).includes(q) ||
      normKanji((nn.nihonshoki||'').toLowerCase()).includes(q) ||
      normKanji((nn.kojiki||'').toLowerCase()).includes(q) ||
      reading.includes(q) ||
      (nn.aliases||[]).some(a=>normKanji(a.toLowerCase().replace(/ /g,'')).includes(q));
  });
}
const searchClear = document.getElementById('searchClear');
let searchFocusIdx = -1;

function showSearchResults(){
  const q = searchInput.value.trim();
  searchClear.style.display = searchInput.value ? 'block' : 'none';
  searchFocusIdx = -1;
  if(!q){ searchResults.style.display='none'; clearHighlight(); return; }
  const gm = matchGroups(q);
  const nm = matchNodes(q);
  let html = gm.map(g=>`<div data-gi="${g.idx}" class="r-group">▸ ${g.label}</div>`).join('');
  html += nm.map(n=>`<div data-id="${n.id}">${n.name}<span class="r-kana">${n.kana||''}</span></div>`).join('');
  searchResults.innerHTML = html || `<div style="color:var(--dim);cursor:default;">找不到符合的神明或群組</div>`;
  searchResults.style.display='block';
}
searchInput.addEventListener('input', showSearchResults);
searchInput.addEventListener('focus', ()=>{ if(searchInput.value.trim()) showSearchResults(); });

searchResults.addEventListener('click', e=>{
  const row = e.target.closest('div[data-id],div[data-gi]');
  if(!row) return;
  if(row.dataset.gi !== undefined) highlightGroup(parseInt(row.dataset.gi));
  else focusNode(row.dataset.id);
  searchResults.style.display='none';
  searchFocusIdx = -1;
  // text stays in input intentionally
});

searchInput.addEventListener('keydown', e=>{
  const rows = [...searchResults.querySelectorAll('div[data-id],div[data-gi]')];
  if(e.key==='ArrowDown'){
    e.preventDefault();
    searchFocusIdx = Math.min(searchFocusIdx+1, rows.length-1);
    rows.forEach((r,i)=>r.classList.toggle('focused', i===searchFocusIdx));
    rows[searchFocusIdx]?.scrollIntoView({block:'nearest'});
    return;
  }
  if(e.key==='ArrowUp'){
    e.preventDefault();
    searchFocusIdx = Math.max(searchFocusIdx-1, 0);
    rows.forEach((r,i)=>r.classList.toggle('focused', i===searchFocusIdx));
    rows[searchFocusIdx]?.scrollIntoView({block:'nearest'});
    return;
  }
  if(e.key==='Escape'){ searchResults.style.display='none'; searchFocusIdx=-1; return; }
  if(e.key==='Enter'){
    if(searchFocusIdx>=0 && rows[searchFocusIdx]){ rows[searchFocusIdx].click(); return; }
    const q = searchInput.value.trim();
    const gm = matchGroups(q)[0];
    if(gm){ highlightGroup(gm.idx); searchResults.style.display='none'; return; }
    const m = matchNodes(q)[0];
    if(m){ focusNode(m.id); searchResults.style.display='none'; }
  }
});

searchClear.addEventListener('click', ()=>{
  searchInput.value='';
  searchClear.style.display='none';
  searchResults.style.display='none';
  searchFocusIdx=-1;
  clearHighlight();
  searchInput.focus();
});

  if(!e.target.closest('#searchBox')) searchResults.style.display='none';
  if(!e.target.closest('.node') && !e.target.closest('#panel') && !e.target.closest('#imgLightbox')) closePanel();
});

/* ============ 妖怪頁：平移縮放（滾輪／單指拖曳＝上下捲動，按鈕/點選/雙指＝縮放） ============ */
const ycanvasWrap = document.getElementById('ycanvasWrap');
const ystage = document.getElementById('ystage');
let yscale=1, ytx=0, yty=0;
let ydragging=false, ylastX, ylastY;

function ySetSmooth(on){ ystage.classList.toggle('smooth', on); }
// 邊界限制：內容永遠至少填滿可視範圍的一邊，避免拖曳/滾動出現無邊際的空白區域
function yClamp(){
  const rect = ycanvasWrap.getBoundingClientRect();
  const scaledW = ystage.offsetWidth * yscale, scaledH = ystage.offsetHeight * yscale;
  const minTx = Math.min(0, rect.width - scaledW), maxTx = Math.max(0, rect.width - scaledW);
  const minTy = Math.min(0, rect.height - scaledH), maxTy = Math.max(0, rect.height - scaledH);
  ytx = Math.min(maxTx, Math.max(minTx, ytx));
  yty = Math.min(maxTy, Math.max(minTy, yty));
}
function yApplyTransform(){ yClamp(); ystage.style.transform = `translate(${ytx}px,${yty}px) scale(${yscale})`; }

ycanvasWrap.addEventListener('mousedown', e=>{
  ydragging=true; ylastX=e.clientX; ylastY=e.clientY;
  ySetSmooth(false);
});
window.addEventListener('mouseup', ()=>{ ydragging=false; });
window.addEventListener('mousemove', e=>{
  if(!ydragging) return;
  ytx += (e.clientX-ylastX); yty += (e.clientY-ylastY);
  ylastX=e.clientX; ylastY=e.clientY;
  yApplyTransform();
});
// 滾輪＝上下（含左右）平移，如同一般網頁捲動，而非縮放
ycanvasWrap.addEventListener('wheel', e=>{
  e.preventDefault();
  ySetSmooth(false);
  yty -= e.deltaY;
  ytx -= e.deltaX;
  yApplyTransform();
}, {passive:false});

function yZoomAt(mx,my,factor){
  const newScale = Math.min(2.2, Math.max(0.5, yscale*factor));
  const ratio = newScale/yscale;
  ytx = mx - (mx-ytx)*ratio;
  yty = my - (my-yty)*ratio;
  yscale = newScale;
  yApplyTransform();
}
function yZoomBy(factor){
  ySetSmooth(true);
  const rect = ycanvasWrap.getBoundingClientRect();
  yZoomAt(rect.width/2, rect.height/2, factor);
}
// 行動裝置改用原生上下捲動＋各分類橫向滑動，不套用桌機的平移縮放畫布
function yIsMobile(){ return window.matchMedia('(max-width:700px)').matches; }
function yResetView(){
  if(yIsMobile()){
    ycanvasWrap.scrollTo({top:0, behavior:'smooth'});
    closeYPanel();
    yClearSearch();
    return;
  }
  ySetSmooth(true);
  yscale=1; ytx=0; yty=0;
  yApplyTransform();
  closeYPanel();
  yClearSearch();
}
// 返回頂端＝同時重置縮放與位置（等同「重置檢視」，另外提供圖示按鈕方便隨手點擊）
function yScrollTop(){ yResetView(); }
function yFocusEl(el){
  if(!el) return;
  if(yIsMobile()){ el.scrollIntoView({behavior:'smooth', block:'center', inline:'center'}); return; }
  const rect = ycanvasWrap.getBoundingClientRect();
  ySetSmooth(true);
  yscale = Math.min(1.7, Math.max(yscale, 1.4));
  ytx = rect.width/2 - (el.offsetLeft+el.offsetWidth/2)*yscale;
  yty = rect.height/2 - (el.offsetTop+el.offsetHeight/2)*yscale;
  yApplyTransform();
}

/* ---- 觸控（手機／平板）：單指拖曳平移、雙指縮放（僅桌機寬度以外的觸控裝置停用，改走原生捲動） ---- */
let yTouchMode = null;
let yPinchStartDist = 0, yPinchStartScale = 1, yPinchCx = 0, yPinchCy = 0;
function yTouchDist(a,b){ return Math.hypot(b.clientX-a.clientX, b.clientY-a.clientY); }
ycanvasWrap.addEventListener('touchstart', e=>{
  if(yIsMobile()) return; // 讓瀏覽器原生上下捲動接手，不攔截手勢
  ySetSmooth(false);
  if(e.touches.length===1){
    yTouchMode='pan'; ylastX=e.touches[0].clientX; ylastY=e.touches[0].clientY;
  } else if(e.touches.length===2){
    yTouchMode='pinch';
    const rect = ycanvasWrap.getBoundingClientRect();
    yPinchStartDist = yTouchDist(e.touches[0], e.touches[1]);
    yPinchStartScale = yscale;
    yPinchCx = (e.touches[0].clientX+e.touches[1].clientX)/2 - rect.left;
    yPinchCy = (e.touches[0].clientY+e.touches[1].clientY)/2 - rect.top;
  }
}, {passive:true});
ycanvasWrap.addEventListener('touchmove', e=>{
  if(yTouchMode==='pan' && e.touches.length===1){
    e.preventDefault();
    const t=e.touches[0];
    ytx += (t.clientX-ylastX); yty += (t.clientY-ylastY);
    ylastX=t.clientX; ylastY=t.clientY;
    yApplyTransform();
  } else if(yTouchMode==='pinch' && e.touches.length===2){
    e.preventDefault();
    const dist = yTouchDist(e.touches[0], e.touches[1]);
    const newScale = Math.min(2.2, Math.max(0.5, yPinchStartScale*(dist/yPinchStartDist)));
    const ratio = newScale/yscale;
    ytx = yPinchCx - (yPinchCx-ytx)*ratio;
    yty = yPinchCy - (yPinchCy-yty)*ratio;
    yscale = newScale;
    yApplyTransform();
  }
}, {passive:false});
ycanvasWrap.addEventListener('touchend', e=>{
  if(yIsMobile()) return;
  if(e.touches.length===0){ yTouchMode=null; }
  else if(e.touches.length===1){ yTouchMode='pan'; ylastX=e.touches[0].clientX; ylastY=e.touches[0].clientY; }
});

const ycontent = document.getElementById('ycontent');
function renderYokai(){
  let html = '';
  YOKAI_GROUPS.forEach(([label, ids, color, special])=>{
    let members = ids.map(id=>yokais[id]).filter(Boolean);
    if(SHOW_FAV_ONLY) members = members.filter(y=>YOKAI_FAVORITES[y.id]);
    if(!members.length) return;
    html += `<div class="ygroup${special?' special':''}"><h3 style="color:${special?color:''}">${special?'🌟 ':''}${label}</h3><div class="ygrid">`;
    members.forEach(y=>{
      const fav = !!YOKAI_FAVORITES[y.id];
      html += `<div class="ycard${y.notable?' notable':''}${y.isNote?' note':''}${fav?' favorited':''}" data-id="${y.id}">
        <span class="yfav${fav?' active':''}" data-id="${y.id}">${fav?'★':'☆'}</span>
        <div class="yname">${y.name}</div>
        ${y.kana?`<div class="ykana">${y.kana}</div>`:''}
        <div class="ycat">${y.category}</div>
      </div>`;
    });
    html += `</div></div>`;
  });
  if(!html) html = `<div id="yfav-empty">尚未收藏任何妖怪，點擊卡片右上角的☆即可加入收藏。</div>`;
  ycontent.innerHTML = html;
  ycontent.querySelectorAll('.yfav').forEach(el=>{
    el.addEventListener('click', ev=>{ ev.stopPropagation(); toggleFavorite(el.dataset.id); });
  });
  ycontent.querySelectorAll('.ycard').forEach(el=>{
    el.addEventListener('click', ()=>{ openYPanel(el.dataset.id); yFocusEl(el); });
  });
}
renderYokai();

  if(yn.original && yn.original!==y.name) nhtml += row('日文原名',yn.original);
  if(yn.aliases && yn.aliases.length) nhtml += row('別稱',yn.aliases.join('　'));
  const rec = YOKAI_EDITS_LIVE[id];
  nhtml += customRowsHTML(rec);

  const roleEl = document.getElementById('yp-role');

  document.getElementById('yp-desc').textContent = y.desc||'（尚無詳細記載）';

function saveYokaiEdit(){
  if(!currentYokaiId) return;
  const id = currentYokaiId;
  const aliasRaw = document.getElementById('ye-aliases').value;
  const ov = {
    name:     document.getElementById('ye-name').value.trim()||undefined,
    kana:     document.getElementById('ye-kana').value.trim()||undefined,
    category: document.getElementById('ye-category').value.trim()||undefined,
    original: document.getElementById('ye-original').value.trim()||undefined,
    aliases:  aliasRaw.trim() ? aliasRaw.split(/[，,、]+/).map(s=>s.trim()).filter(Boolean) : undefined,
    desc:     document.getElementById('ye-desc').value.trim()||undefined,
  };
  Object.keys(ov).forEach(k=>{ if(ov[k]===undefined) delete ov[k]; });
  const rec = YOKAI_EDITS_LIVE[id] = Object.assign(YOKAI_EDITS_LIVE[id]||{}, ov);
  const custom = cleanRows('ye-fields'), images = cleanRows('ye-imgs');
  if(custom.length) rec.custom = custom; else delete rec.custom;
  if(images.length) rec.images = images; else delete rec.images;
  if(!saveLS('yokai_edits', YOKAI_EDITS_LIVE)) return;
  const y = yokais[id];
  if(ov.name) y.name=ov.name;
  if(ov.kana) y.kana=ov.kana;
  if(ov.category) y.category=ov.category;
  if(ov.desc) y.desc=ov.desc;
  if(!YOKAI_NAMES[id]) YOKAI_NAMES[id]={};
  ['original','aliases'].forEach(k=>{ if(ov[k]!==undefined) YOKAI_NAMES[id][k]=ov[k]; });
  patchYokaiCard(id);
  cancelYokaiEdit();
  openYPanel(id);
}
function resetYokaiEdit(){
  if(!currentYokaiId) return;
  const id = currentYokaiId;
  delete YOKAI_EDITS_LIVE[id];
  saveLS('yokai_edits', YOKAI_EDITS_LIVE);
  const orig = YOKAI_DEFS.find(d=>d[0]===id);
  if(orig){
    const y = yokais[id];
    y.name=orig[1]; y.kana=orig[2]; y.category=orig[4]; y.desc=orig[5];
    YOKAI_NAMES[id] = JSON.parse(JSON.stringify(YOKAI_NAMES_ORIG[id]||{}));
    patchYokaiCard(id);
  }
  cancelYokaiEdit();
  openYPanel(id);
}

function matchYokai(q){
  q = normKanji(q.toLowerCase().replace(/ /g,''));
  return Object.values(yokais).filter(y=>{
    const yn = YOKAI_NAMES[y.id]||{};
    return normKanji(y.name.toLowerCase()).includes(q) ||
      (y.kana||'').toLowerCase().replace(/ /g,'').includes(q) ||
      normKanji((y.category||'').toLowerCase()).includes(q) ||
      normKanji((yn.original||'').toLowerCase()).includes(q) ||
      (yn.aliases||[]).some(a=>normKanji(a.toLowerCase().replace(/ /g,'')).includes(q));
  });
}
const ysearchInput = document.getElementById('ysearchInput');
const yresults = document.getElementById('yresults');
const ysearchClear = document.getElementById('ysearchClear');
let ysearchFocusIdx = -1;
function showYResults(){
  const q = ysearchInput.value.trim();
  ysearchClear.style.display = ysearchInput.value ? 'block' : 'none';
  ysearchFocusIdx = -1;
  if(!q){ yresults.style.display='none'; document.querySelectorAll('.ycard').forEach(c=>c.classList.remove('dim')); return; }
  const nm = matchYokai(q);
  const matchIds = new Set(nm.map(y=>y.id));
  document.querySelectorAll('.ycard').forEach(c=>c.classList.toggle('dim', !matchIds.has(c.dataset.id)));
  yresults.innerHTML = nm.length ? nm.map(y=>`<div data-id="${y.id}">${y.name}<span class="r-kana">${y.kana||''}</span></div>`).join('')
    : `<div style="color:var(--dim);cursor:default;">找不到符合的妖怪</div>`;
  yresults.style.display='block';
}
function ySelectResultRow(row){
  const el = document.querySelector(`.ycard[data-id="${row.dataset.id}"]`);
  openYPanel(row.dataset.id);
  yFocusEl(el);
  yresults.style.display='none';
  ysearchFocusIdx = -1;
}
ysearchInput.addEventListener('input', showYResults);
ysearchInput.addEventListener('focus', ()=>{ if(ysearchInput.value.trim()) showYResults(); });
yresults.addEventListener('click', e=>{
  const row = e.target.closest('div[data-id]');
  if(!row) return;
  ySelectResultRow(row);
});
ysearchInput.addEventListener('keydown', e=>{
  const rows = [...yresults.querySelectorAll('div[data-id]')];
  if(e.key==='ArrowDown'){
    e.preventDefault();
    ysearchFocusIdx = Math.min(ysearchFocusIdx+1, rows.length-1);
    rows.forEach((r,i)=>r.classList.toggle('focused', i===ysearchFocusIdx));
    rows[ysearchFocusIdx]?.scrollIntoView({block:'nearest'});
    return;
  }
  if(e.key==='ArrowUp'){
    e.preventDefault();
    ysearchFocusIdx = Math.max(ysearchFocusIdx-1, 0);
    rows.forEach((r,i)=>r.classList.toggle('focused', i===ysearchFocusIdx));
    rows[ysearchFocusIdx]?.scrollIntoView({block:'nearest'});
    return;
  }
  if(e.key==='Escape'){ yresults.style.display='none'; ysearchFocusIdx=-1; return; }
  if(e.key==='Enter'){
    if(ysearchFocusIdx>=0 && rows[ysearchFocusIdx]){ ySelectResultRow(rows[ysearchFocusIdx]); return; }
    if(rows[0]) ySelectResultRow(rows[0]);
  }
});
ysearchClear.addEventListener('click', ()=>{
  ysearchInput.value='';
  ysearchClear.style.display='none';
  yresults.style.display='none';
  ysearchFocusIdx=-1;
  document.querySelectorAll('.ycard').forEach(c=>c.classList.remove('dim'));
  ysearchInput.focus();
});
function yClearSearch(){
  ysearchInput.value='';
  ysearchClear.style.display='none';
  yresults.style.display='none';
  ysearchFocusIdx=-1;
  document.querySelectorAll('.ycard').forEach(c=>c.classList.remove('dim'));
}

/* ============ 妖怪頁：頁面切換 ============ */
function openYokai(){
  document.getElementById('japan').style.display='none';
  document.getElementById('home').style.display='none';
  document.getElementById('yokai').style.display='block';
  ySetSmooth(false);
  yscale=1; ytx=0; yty=0;
  yApplyTransform();
  localStorage.setItem('mythCurrentPage','yokai');
}
function closeYokai(){
  document.getElementById('yokai').style.display='none';
  document.getElementById('home').style.display='flex';
  localStorage.setItem('mythCurrentPage','home');
}
function backToMyth(){
  document.getElementById('yokai').style.display='none';
  openJapan();
}
function toGreek(){ openGreek(); }

/* ============ 明暗模式 ============ */
function toggleTheme(){
  const cur = document.documentElement.dataset.theme==='light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = cur;
  localStorage.setItem('mythTheme', cur);
}
(function initTheme(){
  const saved = localStorage.getItem('mythTheme');
  if(saved) document.documentElement.dataset.theme = saved;
})();

/* ============ 重整頁面後停留在原本的頁面 ============ */
loadPantheon('japan');
// 網頁字型載入後方塊高度會改變，重畫一次讓連線與標籤依最終尺寸重新計算
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>renderGraph());

(function restorePage(){
  const page = localStorage.getItem('mythCurrentPage');
  if(page==='japan' || page==='greek') openPantheon(page);
  else if(page==='yokai') openYokai();
})();
