const GR_NODE_DEFS = [
/* ---- 俄耳甫斯教的原初神（時間先於一切） ---- */
["chronos","柯羅諾斯（時間）","Χρόνος（Chronos）","時間之神",9.0,-1.4,"俄耳甫斯教傳承中先於萬物的「不老時間」，以蛇形環繞初生的宇宙。他與必然女神阿南刻纏繞絞碎了原初的混沌，擠出一枚銀色宇宙卵，法涅斯自卵中誕生。請特別注意：他與泰坦之王克洛諾斯（Κρόνος）是不同的神，僅因名字相近而在後世被混為一談，農神薩圖爾努斯手持鐮刀與沙漏的「時間老人」形象，正是這場混淆的產物。",false,"key"],
["ananke","阿南刻","Ἀνάγκη（Ananke）","必然與宿命女神",10.4,-1.4,"不可違逆的「必然」之化身，與時間之神柯羅諾斯同時出現，兩者以蛇身相纏環繞整個宇宙。她手持紡錘，連宙斯也無法動搖她所定的界限；命運三女神摩伊賴被視為她的女兒。"],
["phanes","法涅斯","Φάνης（Phanes）","自宇宙卵誕生的原初創生神",12.5,0,"俄耳甫斯教的第一位神王，其名意為「顯現者」。自銀色宇宙卵中破殼而出，金翼、雙性、四目，一身光輝照亮了尚無形體的黑暗。他獨自生下夜之女神倪克斯，並將王權依序傳予烏拉諾斯、克洛諾斯，最終歸於宙斯。"],

/* ---- 原初諸神（Protogenoi） ---- */
["chaos","卡俄斯","Χάος（Chaos）","原初的虛空",10.4,0,"一切的開端。赫西俄德《神譜》開篇即言「最先生成的是卡俄斯」——它並非「混亂」，而是張口的巨大空隙、上下未分的虛空。諸神與世界皆由此裂口向外展開。在俄耳甫斯教的另一系傳承中，卡俄斯則是時間之神柯羅諾斯與阿南刻絞碎原初物質後所留下的空隙。",false,"key"],
["gaia","蓋亞","Γαῖα（Gaia）","大地女神",7.0,1.2,"廣胸的大地女神，眾神永遠安穩的居所。她獨自生下烏拉諾斯（天）、蓬托斯（海）與群山，再與自己所生的天空結合誕下泰坦一族。她兩度主導政權更迭：先授鐮刀給克洛諾斯推翻烏拉諾斯，後又助宙斯推翻克洛諾斯；當宙斯將她的巨人子女打入深淵，她憤而與塔爾塔羅斯生下堤豐，發動了神界最後一場大戰。",false,"key"],
["tartaros","塔爾塔羅斯","Τάρταρος（Tartaros）","大地深處的冥淵",9.0,1.2,"位於大地最深處的幽暗淵藪。赫西俄德說，一塊青銅砧自天空墜落需九日九夜方達大地，再九日九夜方落入塔爾塔羅斯。既是地點也是神格，泰坦諸神戰敗後被囚於此，由百臂巨人看守。他與蓋亞結合，生下最強大的怪物堤豐。"],
["eros_p","厄洛斯（原初）","Ἔρως（Eros）","原初的愛欲",11.0,1.2,"最初生成的原初神之一，是使萬物相互吸引、結合、繁衍的宇宙性衝動。若無他，連諸神也無從誕生。他與後世阿佛洛狄忒之子、手持金箭的小愛神厄洛斯是不同層次的神格。"],
["erebos","厄瑞玻斯","Ἔρεβος（Erebos）","幽冥的黑暗",43.0,1.2,"自卡俄斯生出的幽冥黑暗之神，指冥界入口與地下那片深沉不透光的暗。與夜之女神倪克斯結合，生下清氣與白晝——黑暗與夜反而生出了光明，是希臘宇宙觀中極具張力的一筆。"],
["nyx","倪克斯","Νύξ（Nyx）","黑夜女神",45.0,1.2,"自卡俄斯生出的夜之女神，居於塔爾塔羅斯附近的宮殿。《伊利亞特》中記載，宙斯曾因懼怕觸怒倪克斯而放棄懲罰睡神休普諾斯——她是連眾神之王也敬畏的存在。她獨自誕下死亡、睡眠、命運、報應、紛爭等一系列陰暗而根本的力量。",false,"key"],
["aither","埃忒耳","Αἰθήρ（Aither）","上層的清明之氣",43.0,2.4,"厄瑞玻斯與倪克斯之子，指高天之上澄澈明亮的元氣，是諸神所呼吸的空氣，與凡人呼吸的下層濁氣（Aer）截然不同。"],
["hemera","赫墨拉","Ἡμέρα（Hemera）","白晝女神",44.4,2.4,"厄瑞玻斯與倪克斯之女，白晝的化身。她與母親倪克斯在青銅門檻上交會，一者歸家、一者外出，從不同時停留在屋內——晝夜因此永恆輪替。"],
["ouranos","烏拉諾斯","Οὐρανός（Ouranos）","天空之神・第一代神王",5.0,2.4,"蓋亞獨自所生的星空之神，並與母親結合成為第一代神王。他憎惡自己的子女，一出生便將他們塞回蓋亞體內。蓋亞痛苦難忍，鑄造燧石鐮刀求子女相助，唯有么子克洛諾斯應允。當烏拉諾斯攜夜色降臨大地時，克洛諾斯自埋伏處揮鐮將父親閹去；濺落大地的血生出復仇女神與巨人族，落海的殘體則湧起白沫，阿佛洛狄忒自其中誕生。",false,"key"],
["pontos","蓬托斯","Πόντος（Pontos）","原初的海洋",32.0,2.4,"蓋亞獨自所生的海洋之神，代表尚未被任何神權統治的原始海水。與蓋亞結合生下涅柔斯、陶瑪斯、福耳庫斯、刻托與歐律比亞，是一切海神與海怪的源頭。",false,"key"],
["ourea_note","烏瑞亞（群山諸神）","Οὔρεα（Ourea）","蓋亞獨自誕下的群山",3.2,2.4,"蓋亞獨自生下的群山之神，是希臘各地山岳的神格化——奧林帕斯、赫利孔、庫泰戎、涅墨亞等山各有其神，也是山中寧芙的居所。",true],
["erinyes_note","厄里倪厄斯（復仇三女神）","阿勒克托・提西福涅・墨蓋拉","由天空神之血誕生",-2.9,3.6,"烏拉諾斯被斬落時，滴在大地上的血所生出的復仇女神：阿勒克托（不止息者）、提西福涅（復仇殺戮者）、墨蓋拉（嫉妒者）。她們蛇髮持鞭，無情追捕弒親者與違誓者直至其發狂。俄瑞斯忒斯弒母後即遭她們追殺，最終由雅典娜設立戰神山法庭審判、將她們轉化為賜福的「歐墨尼得斯（善意女神）」，是希臘從血親復仇走向城邦司法的象徵。",true],
["gigantes_note","癸干忒斯與墨利埃","巨人族・梣樹寧芙","由天空神之血誕生",-1.5,3.6,"同樣自烏拉諾斯之血生出的巨人族與手持梣木長矛的樹之寧芙。巨人族日後受蓋亞煽動，以巨石與燃燒的橡樹攻打奧林帕斯，史稱「巨人之戰」。神諭稱唯有一名凡人相助方能取勝，宙斯遂召來赫拉克勒斯，以毒箭終結了阿爾庫俄紐斯與波耳費里翁等巨人。",true],

/* ---- 倪克斯的子女（夜之神族） ---- */
["thanatos","塔納托斯","Θάνατος（Thanatos）","死亡之神",42.0,3.6,"倪克斯獨自所生的死亡之神，鐵石心腸，凡他所執之人便無可挽回，連諸神也不愛他。西緒福斯曾以詭計將他鎖住，使世間一時無人能死；赫拉克勒斯則曾在阿爾刻提斯的墓前與他角力，奪回了已逝的王后。"],
["hypnos","休普諾斯","Ὕπνος（Hypnos）","睡眠之神",43.4,3.6,"死神的孿生兄弟，溫和而遍行大地與海洋的睡眠之神，觸之即眠。赫拉曾以美惠女神帕西忒亞為聘，請他使宙斯在伊達山上沉睡，好讓希臘軍在特洛伊城下取得優勢——事後宙斯震怒，全靠倪克斯庇護他才免於一死。"],
["moirai_note","摩伊賴（命運三女神）","克洛托・拉刻西斯・阿特羅波斯","紡織、丈量、剪斷命運之線",44.8,3.6,"命運三女神：克洛托紡出生命之線，拉刻西斯量定其長短，阿特羅波斯以不可挽回的剪刀斷之。連宙斯亦難違其裁決。她們曾判定墨勒阿革洛斯的性命繫於爐中一根柴薪，也曾被阿波羅灌醉以延長阿德墨托斯的壽命。另有一說她們是宙斯與忒彌斯之女。",true],
["nemesis","涅墨西斯","Νέμεσις（Nemesis）","義憤與報應女神",46.2,3.6,"衡量分際的女神，其名意為「應得的分配」。對僭越本分、驕矜自滿、享有過多好運卻不知節制者降下報應。納西瑟斯因輕蔑他人的愛慕而被她引至泉邊，愛上自己的倒影而枯萎；一說她為躲避宙斯化為天鵝，所產之卵由勒達撫養，孵出了海倫。"],
["eris","厄里斯","Ἔρις（Eris）","紛爭女神",47.6,3.6,"紛爭的化身，戰神阿瑞斯的伴侶。因未受邀於珀琉斯與忒提斯的婚宴，她投下一顆刻著「獻給最美者」的金蘋果，赫拉、雅典娜與阿佛洛狄忒為此爭執不下，宙斯命特洛伊王子帕里斯裁決；帕里斯選了許諾他世上最美女子的阿佛洛狄忒，於是海倫被帶往特洛伊——十年戰爭由這一顆蘋果而起。"],
["nyx_others_note","摩羅斯・克蕾絲・俄涅伊洛伊等","厄運・死亡精靈・夢神・譏諷・衰老","倪克斯獨自誕下的其餘子女",49.0,3.6,"尚有摩羅斯（不可避免的厄運）、克蕾絲（在戰場上啜血的暴死精靈）、俄涅伊洛伊（夢的群體，含造夢者摩耳甫斯）、摩摩斯（譏諷，因挑剔諸神而被逐出奧林帕斯）、俄裔緒斯（苦痛）、革拉斯（衰老）、阿帕忒（欺瞞）、菲羅忒斯（情愛）、赫斯佩里得斯（西方樂園的金蘋果姊妹）與許普諾斯之子等。",true],

/* ---- 烏拉諾斯與蓋亞之子：十二泰坦與獨眼、百臂巨人 ---- */
["okeanos","俄刻阿諾斯","Ὠκεανός（Okeanos）","環繞世界的大洋之河",0.5,3.6,"十二泰坦之長，是環繞整片大地流動、首尾相銜的大洋之河。他未參與對父親烏拉諾斯的反叛，泰坦之戰中也保持中立，因而在宙斯統治下仍保有自己的領域。荷馬甚至稱他為「諸神的起源」。"],
["tethys","忒堤斯","Τηθύς（Tethys）","眾水之母",1.9,3.6,"俄刻阿諾斯之妻，與其生下三千條河流與三千位大洋仙女。泰坦之戰期間曾受赫拉之託撫養她。應赫拉之請，她使大熊座（卡利斯托）永不沉入海面洗浴，這正是北斗七星終年不落的由來。"],
["hyperion","許珀里翁","Ὑπερίων（Hyperion）","高行於天者・光之泰坦",3.3,3.6,"光之泰坦，其名意為「行於高處者」。與姊妹忒伊亞結合，生下太陽、月亮與曙光三神，是天體運行的源頭。"],
["theia","忒伊亞","Θεία（Theia）","光輝與視覺女神",4.7,3.6,"賦予黃金、白銀與寶石光澤的女神，亦司掌眼睛所發出的視線之光——古希臘人相信視覺是眼中射出的光。別名歐律法厄薩（廣耀者）。"],
["koios","科俄斯","Κοῖος（Koios）","天球之軸・詰問",6.1,3.6,"北方之柱的泰坦，象徵天球運轉所繞的軸心；其名亦與「詰問、探究」相通，被視為理智追問的神格。"],
["phoibe","福柏","Φοίβη（Phoibe）","光明與神諭",7.5,3.6,"其名意為「明亮者」。她是德爾斐神諭所的第三任主人，後將之作為誕生賀禮贈與外孫阿波羅——阿波羅的別名「福玻斯（Phoibos）」即源於她。"],
["kronos","克洛諾斯","Κρόνος（Kronos）","泰坦之王・農耕之神",8.9,3.6,"泰坦中最年幼也最狡黠者。他以蓋亞所鑄的燧石鐮刀閹去父親烏拉諾斯而登上王位，卻因父母的預言——你也將被自己的孩子推翻——而將出生的子女逐一吞下。妻子瑞亞在生下宙斯後以襁褓包石讓他吞食，宙斯長成後迫使他吐出所有兄姊，遂有十年泰坦之戰。羅馬人將他等同於農神薩圖爾努斯，其統治被追憶為無憂無慮的「黃金時代」。",false,"key"],
["rhea","瑞亞","Ῥέα（Rhea）","諸神之母",10.3,3.6,"克洛諾斯之妻與姊妹。眼見子女一一被丈夫吞下，她在生下宙斯時逃往克里特島，將嬰兒藏於伊達山的洞穴，交由山羊阿瑪爾忒亞哺乳、庫瑞忒斯武士以擊盾聲掩蓋哭聲，再以襁褓包石騙過丈夫。她是希臘版的大母神，後與小亞細亞的庫柏勒信仰合流。",false,"key"],
["krios","克利俄斯","Κρῖος（Krios）","南方之柱・星辰",11.7,3.6,"支撐天空南柱的泰坦，其名意為「公羊」，與牡羊座及星辰的運行相關聯。與海之女神歐律比亞結合，生下星空、戰陣與毀滅三神。"],
["iapetos","伊阿佩托斯","Ἰαπετός（Iapetos）","西方之柱・人類之祖",13.1,3.6,"支撐天空西柱的泰坦。他的四個兒子分別代表人類的四種特質：先見（普羅米修斯）、後知（厄庇墨透斯）、忍耐（阿特拉斯）與狂暴（墨諾伊提俄斯）。因普羅米修斯造人，他被視為人類的祖源。"],
["themis","忒彌斯","Θέμις（Themis）","法律與神聖秩序",14.5,3.6,"司掌神法、習俗與正當秩序的女神，德爾斐神諭所的第二任主人。她是宙斯的第二位妻子，也是他最信任的顧問——正是她預言了「忒提斯之子將勝過其父」，使宙斯與波塞冬放棄追求忒提斯。手持天秤與劍、蒙眼的正義女神形象即源自她。"],
["mnemosyne","謨涅摩敘涅","Μνημοσύνη（Mnemosyne）","記憶女神",15.9,3.6,"記憶的女神。宙斯化為牧人與她連續共寢九夜，生下九位繆斯——在沒有文字的時代，一切詩歌、史詩與學藝皆倚賴記憶傳承，故詩人開篇必先呼求繆斯。冥界另有一條記憶之泉謨涅摩敘涅，與遺忘之河勒忒相對。"],
["kyklopes_note","庫克洛普斯三兄弟","布戎忒斯・斯忒羅佩斯・阿爾革斯","額生單眼的巨匠",17.3,3.6,"雷、電、光三位額生單眼的巨匠。被父親烏拉諾斯與兄長克洛諾斯先後囚禁，宙斯將他們自塔爾塔羅斯解放後，他們為宙斯鍛造雷霆、為波塞冬造三叉戟、為哈得斯造隱形盔——泰坦之戰的勝負由此底定。後因阿波羅遷怒（宙斯以他們所鑄的雷霆擊殺了醫神阿斯克勒庇俄斯）而被射殺。荷馬筆下吃人的獨眼巨人波呂斐摩斯屬於另一支牧羊的庫克洛普斯。",true],
["hekatoncheires_note","赫卡同克瑞斯三兄弟","科托斯・布里阿瑞俄斯・古革斯","百臂五十頭的巨神",18.7,3.6,"各有一百隻手臂與五十顆頭的巨神。宙斯以神饌餵養並解放了他們，他們在泰坦之戰的最後以三百隻手同時投擲巨石，泰坦被石雨埋沒而敗北。此後他們永久看守塔爾塔羅斯的青銅門。布里阿瑞俄斯還曾在赫拉、波塞冬、雅典娜密謀綁縛宙斯時挺身護駕。",true],

/* ---- 泰坦的子女（第三代） ---- */
["potamoi_note","波塔摩伊（三千河神）","Ποταμοί（Potamoi）","俄刻阿諾斯與忒堤斯之子",-2.0,4.8,"尼羅河、伊那科斯、阿刻羅俄斯、斯卡曼德羅斯、阿爾斐俄斯等三千條河川的神格。其中阿刻羅俄斯為最長者，曾與赫拉克勒斯爭奪得伊阿妮拉，敗戰時被折斷一角，該角成為盛滿果實的「豐饒之角」；斯卡曼德羅斯則在特洛伊城下暴漲怒濤，險些淹沒阿基里斯。",true],
["okeanides_note","俄刻阿尼得斯（三千大洋仙女）","Ὠκεανίδες（Okeanides）","俄刻阿諾斯與忒堤斯之女",-0.6,4.8,"三千位大洋仙女，掌管泉水、雲霧、湖沼與草地。她們多有嫁與泰坦或神祇而成為後世諸神之母者，也曾成群前來探望被縛於高加索山的普羅米修斯，構成埃斯庫羅斯悲劇的歌隊。",true],
["styx","斯提克斯","Στύξ（Styx）","冥河女神・誓約的見證",0.8,4.8,"環繞冥界的憎恨之河。泰坦之戰爆發時她率四名子女最先投向宙斯，宙斯遂立她的水為諸神最重的誓約——違誓者將昏睡一年、再被逐出神界九年。太陽神赫利俄斯因誤以此誓應允兒子法厄同駕馭日車，鑄成無可挽回的悲劇。一說忒提斯即持阿基里斯的足踝浸入此河。"],
["metis","墨提斯","Μῆτις（Metis）","深謀與智慧",2.2,4.8,"宙斯的第一位妻子，其名意為「機敏的謀略」。她調製催吐藥使克洛諾斯吐出被吞的兄姊，是宙斯奪權的關鍵。然而蓋亞與烏拉諾斯預言她所生之子將推翻父親，宙斯遂哄她變成小蟲而吞入腹中——智慧從此永存於宙斯體內，雅典娜則自宙斯頭中破顱而出。"],
["eurynome","歐律諾墨","Εὐρυνόμη（Eurynome）","大洋仙女",3.6,4.8,"宙斯的第三位妻子，生下美惠三女神。赫淮斯托斯被自天上拋下墜入大海時，她與忒提斯將他藏在環洋的洞穴中撫養九年，那裡也是他最初的工坊。"],
["doris","多里斯","Δωρίς（Doris）","大洋仙女・海之豐饒",5.0,4.8,"大洋仙女之一，涅柔斯之妻，五十位涅瑞伊得斯（海中仙女）之母。其名與「贈與」相關，象徵海洋的慷慨。"],
["klymene","克呂墨涅","Κλυμένη（Klymene）","大洋仙女",6.4,4.8,"大洋仙女之一，伊阿佩托斯之妻，普羅米修斯四兄弟之母。另有一說她是赫利俄斯的伴侶、法厄同之母。"],
["philyra","菲呂拉","Φιλύρα（Philyra）","大洋仙女・造紙與療癒",7.8,4.8,"大洋仙女之一。克洛諾斯為躲避妻子瑞亞的目光，化為駿馬與她結合，所生之子因此半人半馬——那便是賢者喀戎。菲呂拉見到嬰孩的模樣驚駭不已，祈求變形，遂化為椴樹。"],
["helios","赫利俄斯","Ἥλιος（Helios）","太陽神",9.2,4.8,"每日駕四匹噴火駿馬的黃金戰車自東橫越天穹的太陽神，夜晚乘金杯沿大洋河漂回東方。他目睹世間一切：珀耳塞福涅被劫、阿佛洛狄忒與阿瑞斯的私情，皆由他揭發。他的聖牛群被奧德修斯的水手宰食，全船因此覆滅。",false,"key"],
["selene","塞勒涅","Σελήνη（Selene）","月亮女神",10.6,4.8,"駕銀車巡行夜空的月之女神，額間有新月。她愛上卡里亞的牧羊少年恩底彌翁，求宙斯賜其永眠不老，遂每夜降臨拉特摩斯山的洞穴與他相會，並為他生下五十個女兒。"],
["eos","厄俄斯","Ἠώς（Eos）","曙光女神",12.0,4.8,"荷馬筆下「玫瑰指尖」的黎明女神，每晨先於兄長赫利俄斯自大洋升起，為白晝開門。因與阿瑞斯私通觸怒阿佛洛狄忒，被詛咒永遠陷入戀愛。她曾為凡人愛人提托諾斯求得永生卻忘了求青春，提托諾斯逐漸乾癟萎縮，終化為蟬。"],
["leto","勒托","Λητώ（Leto）","暗夜與母性",13.4,4.8,"科俄斯與福柏之女，宙斯的第六位妻子。懷孕後遭赫拉逼迫，赫拉禁止一切固著的陸地收容她；她流離無所，終於在漂浮的提洛島產下阿波羅與阿耳忒彌斯，島嶼自此定住。凡人尼俄柏因誇耀自己有十四個孩子而輕蔑她，她的一雙兒女便將尼俄柏的子女全數射殺。"],
["asteria","阿斯忒里亞","Ἀστερία（Asteria）","星辰與夜間神諭",14.8,4.8,"勒托的姊妹，司掌夜間的星占與夢兆。為躲避宙斯的追求，她化為鵪鶉投入海中，變成漂浮的提洛島——後來正是這座島收容了走投無路的姊妹，讓阿波羅與阿耳忒彌斯得以誕生。"],
["astraios","阿斯特賴俄斯","Ἀστραῖος（Astraios）","星空與黃昏之神",16.2,4.8,"克利俄斯之子，星空與黃昏之風的神格。與曙光女神厄俄斯結合，生下四方之風、晨星與滿天星辰。"],
["pallas_t","帕拉斯（泰坦）","Πάλλας（Pallas）","戰陣與武技之神",17.6,4.8,"克利俄斯之子，第二代泰坦，司掌戰陣的技藝。與冥河女神斯提克斯結合，生下勝利、強力、暴力與競勝四神。一說巨人之戰中被雅典娜所殺並剝皮為盾，雅典娜的別名「帕拉斯」即源於此。"],
["perses","珀耳塞斯","Πέρσης（Perses）","毀滅之神",19.0,4.8,"克利俄斯之子，其名意為「破壞者」。與阿斯忒里亞結合，生下在天、地、海三界皆保有權柄的女神赫卡忒。"],
["atlas","阿特拉斯","Ἄτλας（Atlas）","擎天者",20.4,4.8,"因率領泰坦與宙斯為敵而受罰，被判於大地最西端永久以雙肩頂住蒼天。赫拉克勒斯為取金蘋果曾接手扛天，讓他去摘；他嘗到自由的滋味不願再扛，赫拉克勒斯遂佯稱要墊個軟墊，趁他重新接手時逃走。珀耳修斯則以美杜莎的首級將他化為北非的阿特拉斯山。",false,"key"],
["prometheus","普羅米修斯","Προμηθεύς（Prometheus）","先知者・人類的恩主",21.8,4.8,"其名意為「先見之明者」。他以泥土摻水造人，在墨科涅的獻祭上以肥美的骨包脂肪誘宙斯選走，替人類留下真正的肉；宙斯震怒收回火種，他便以茴香桿盜取天火贈與人類。宙斯將他縛於高加索山，每日遣鷲鷹啄食其肝，夜間肝臟復生，如此三萬年，直至赫拉克勒斯射殺鷲鷹將他解放。他知曉一個宙斯亟欲得知的祕密——忒提斯之子將勝過其父。",false,"key"],
["epimetheus","厄庇墨透斯","Ἐπιμηθεύς（Epimetheus）","後知者",23.2,4.8,"其名意為「事後才明白者」。分配才能給眾生物時，他把爪牙、皮毛、飛翔全給了走獸，輪到人類已無所剩，兄長才不得不盜火相補。他又不顧兄長「絕不可收下宙斯禮物」的警告而娶了潘朵拉，她揭開甕蓋，疾病、勞苦與衰老自此散入人間，只有「希望」留在甕底。"],
["menoitios","墨諾伊提俄斯","Μενοίτιος（Menoitios）","狂暴與傲慢",24.6,4.8,"伊阿佩托斯之子，代表人類的暴戾與有勇無謀。因狂妄傲慢在泰坦之戰中被宙斯以雷霆直接擊入塔爾塔羅斯。"],

/* ---- 克洛諾斯與瑞亞之子：奧林帕斯第一代 ---- */
["hestia","赫斯提亞","Ἑστία（Hestia）","爐灶與家宅女神",5.0,6.0,"克洛諾斯與瑞亞的長女，也是最後被父親吐出的孩子，故兼有「最年長也最年幼」之稱。阿波羅與波塞冬同時求婚，她卻按著宙斯的額頭立誓永守貞潔，宙斯遂賜她家家戶戶爐灶中央的位置與每次獻祭的第一份。她從不參與諸神的爭鬥，後將奧林帕斯的席位讓與狄俄倪索斯。羅馬名維斯塔，其聖火由貞女祭司終年守護。",false,"key"],
["demeter","得墨忒耳","Δημήτηρ（Demeter）","穀物與豐收女神",6.4,6.0,"司掌穀物與農耕的大地女神。女兒珀耳塞福涅被哈得斯劫入冥界時，她持火把尋遍天下九日不飲不食，最終令大地寸草不生，人類瀕臨滅絕。宙斯被迫調停，但女兒已誤食四顆石榴籽，只得每年返回冥府數月——她離開人間的日子便是冬天。她在厄琉息斯受凡人款待，遂傳下希臘世界最神聖的厄琉息斯祕儀。羅馬名刻瑞斯。",false,"key"],
["hades","哈得斯","Ἅιδης（Hades）","冥界之王",7.8,6.0,"宙斯與波塞冬之兄，三兄弟抽籤分治世界時得了冥界。其名意為「不可見者」，希臘人畏其名而多稱他「普魯托（財富之主）」——地下既埋死者，也藏礦藏與種子。他極少離開自己的國度，唯一一次是駕黑馬破地而出，劫走了珀耳塞福涅。他擁有庫克洛普斯所鑄的隱形盔，冥府由三頭犬刻耳柏洛斯看守。羅馬名普魯托。",false,"key"],
["poseidon","波塞冬","Ποσειδῶν（Poseidon）","海洋・地震・馬之神",9.2,6.0,"手持三叉戟的海洋之王，也司掌地震（「撼地者」）與馬。他與雅典娜爭奪雅典守護權，以三叉戟擊石湧出鹹泉，敗給了獻上橄欖樹的雅典娜。因奧德修斯刺瞎其子波呂斐摩斯，他讓對方在海上漂泊十年。他曾在雅典娜神廟中侵犯美杜莎，也曾送出克里特公牛，間接造就了彌諾陶洛斯。羅馬名涅普頓。",false,"key"],
["amphitrite","安菲特里忒","Ἀμφιτρίτη（Amphitrite）","海之王后",14.4,6.0,"涅柔斯與多里斯之女，涅瑞伊得斯之一。她起初拒絕波塞冬的求愛，逃往世界盡頭的阿特拉斯處；波塞冬派海豚德爾菲努斯前往勸說，她終於允婚，波塞冬遂將那隻海豚升上天空成為海豚座。她曾出於妒意，將情敵斯庫拉變成六頭怪物。"],
["zeus","宙斯","Ζεύς（Zeus）","眾神與人類之父・雷霆之主",10.6,6.0,"克洛諾斯與瑞亞的么子。由母親藏於克里特島的洞穴而免於被吞，長成後以催吐藥迫父親吐出兄姊，解放庫克洛普斯與百臂巨人，歷經十年泰坦之戰登上神界至尊之位。他手持雷霆、以鷹為使，維護誓約、賓客之禮與王權；同時也是希臘神話中子嗣最多的神，其風流韻事幾乎串起整部英雄譜系。羅馬名尤庇特。",false,"key"],
["hera","赫拉","Ἥρα（Hera）","婚姻與天后",12.0,6.0,"宙斯的正妻與姊姊，司掌婚姻、家庭與生育，也是薩摩斯與阿爾戈斯的至高女神。宙斯化為淋雨的杜鵑鳥使她生憐而擁入懷中，藉此娶得她。她對丈夫的不忠極為嚴厲，卻幾乎從不責難宙斯本人，而是窮追猛打其情人與私生子：使伊俄化牛受牛虻驅逐、令勒托無處生產、遣雙蛇襲擊襁褓中的赫拉克勒斯，並終生阻撓他。羅馬名尤諾。",false,"key"],
["hekate","赫卡忒","Ἑκάτη（Hekate）","魔法・十字路口・冥途",1.6,6.0,"珀耳塞斯與阿斯忒里亞之女。赫西俄德特別禮讚她：宙斯獨獨保留了她在天、地、海三界的權柄。她三面三身，手持雙火炬立於三岔路口，司掌魔法、亡魂、門檻與夜行的犬群。珀耳塞福涅被劫時只有她與赫利俄斯聽見呼救，此後她成為冥界王后的隨侍。美狄亞與喀耳刻的巫術皆奉她為主。"],
["nikegroup_note","尼刻・克拉托斯・比亞・仄羅斯","勝利・強權・暴力・競勝","帕拉斯與斯提克斯之子女",0.2,6.0,"勝利女神尼刻與強權、暴力、競勝三兄弟。因母親斯提克斯最早率他們投向宙斯，他們自此永侍於宙斯座前，寸步不離。埃斯庫羅斯的《被縛的普羅米修斯》開場，正是克拉托斯與比亞押著普羅米修斯前往高加索。尼刻的羅馬名維多利亞。",true],
["anemoi_note","阿涅摩伊（四方風神）與眾星","玻瑞阿斯・諾托斯・仄費洛斯・歐洛斯","阿斯特賴俄斯與厄俄斯之子",-1.2,6.0,"北風玻瑞阿斯（曾擄走雅典王女俄瑞緹伊亞，其子助阿爾戈船驅走鷹身女妖）、南風諾托斯（帶來夏末暴雨）、西風仄費洛斯（春之柔風，曾因妒意使鐵餅偏轉害死許阿鏗托斯）、東風歐洛斯，以及晨星厄俄斯福洛斯與滿天星辰，皆為星空之神與曙光女神所生。",true],
["cheiron","喀戎","Χείρων（Cheiron）","賢者半人馬",3.0,6.0,"克洛諾斯化為駿馬與菲呂拉所生，因此半人半馬，卻與粗野的半人馬族截然不同：他通曉醫術、音樂、占星與武藝，是阿基里斯、伊阿宋、阿斯克勒庇俄斯、忒修斯等眾多英雄的老師。赫拉克勒斯誤以九頭蛇毒箭傷了他，他身為不死之身卻須永受劇痛，最終自願將不死交予普羅米修斯而求得一死，宙斯遂將他升為人馬座。",false,"key"],
["aietes","埃厄忒斯","Αἰήτης（Aietes）","科爾喀斯之王",15.8,6.0,"赫利俄斯之子，喀耳刻與帕西法厄的兄弟，科爾喀斯的國王。他將金羊毛釘在聖林的橡樹上，由不眠之龍看守。伊阿宋前來索取時，他開出「以噴火銅蹄牛犁地、播下龍牙、擊敗長出的武士」的難題，卻沒料到自己的女兒美狄亞會愛上這名異邦人並助他成功。"],
["kirke","喀耳刻","Κίρκη（Kirke）","埃埃亞島的女巫",22.6,12.0,"赫利俄斯之女，居於埃埃亞島的女巫，精通藥草與變形術。奧德修斯的部下誤入其宮殿，飲下摻藥的乳酪酒而被變成豬；奧德修斯得赫耳墨斯所贈的莫呂草護身，逼她解咒，並與她同住一年。臨別時她指點他前往冥界求問先知忒瑞西阿斯，並預告了塞壬、斯庫拉與卡律布狄斯的險關。"],
["kalypso","卡呂普索","Καλυψώ（Kalypso）","奧古癸亞島的寧芙",24.0,12.0,"阿特拉斯之女，其名意為「隱藏者」。奧德修斯船毀後漂至她的島上，被她留居七年，日日在岸邊望海垂淚。她許諾賜他永生不老，他仍執意要回伊薩卡見妻子；最終宙斯遣赫耳墨斯下令，她才含淚助他造筏放行。"],
["deukalion","丟卡利翁","Δευκαλίων（Deukalion）","大洪水的倖存者",20.0,6.0,"普羅米修斯之子。宙斯因青銅種族的暴虐而降下九日九夜的大洪水，他依父親的預先指示造方舟，與妻子皮拉漂流至帕耳那索斯山得存。洪水退後兩人求問神諭，得到「拋擲你們偉大母親的骨頭」之語——他們領悟「母親」即大地、「骨頭」即石頭，遂邊走邊向身後拋石，人類就此再生。其子赫楞是希臘人（Hellenes）的始祖。"],
["pyrrha","皮拉","Πύρρα（Pyrrha）","大洪水的倖存者",21.4,6.0,"厄庇墨透斯與潘朵拉之女，丟卡利翁之妻。她所拋出的石頭化為女人，丈夫所拋者化為男人。"],
["maia","邁亞","Μαῖα（Maia）","普勒阿得斯之長",22.8,6.0,"阿特拉斯的長女，性情羞怯，獨居於庫勒涅山的幽深洞穴。宙斯趁赫拉入睡時前來，與她生下赫耳墨斯。她也曾撫養宙斯與卡利斯托之子阿耳卡斯。羅馬人以其名命名五月（May）。"],
["pleiades_note","普勒阿得斯與許阿得斯","七姊妹星團・畢宿星團","阿特拉斯之女",24.2,6.0,"阿特拉斯的女兒們。普勒阿得斯七姊妹（邁亞、厄勒克特拉、泰格忒、阿爾庫俄涅、刻萊諾、斯忒羅佩、墨洛佩）遭獵人俄里翁追逐七年，宙斯憐之，先化為鴿再升上天際成為昴宿星團；許阿得斯則因痛哭兄弟許阿斯之死而化為帶來春雨的畢宿星群。",true],
["phaethon","法厄同","Φαέθων（Phaethon）","駕馭日車的少年",25.6,6.0,"赫利俄斯之子。同伴嘲笑他並非太陽神之子，他遂前往東方宮殿求證，父親一時心軟並指冥河立誓應允他任何請求——他要的正是駕馭日車一日。稚嫩的手無法駕馭噴火神馬，車駕忽高忽低，燒焦了非洲成為沙漠、燙黑了衣索比亞人的皮膚。為免大地全毀，宙斯以雷霆將他擊落厄里達諾斯河；他的姊妹們在河畔慟哭化為白楊，眼淚凝為琥珀。"],
["ixion","伊克西翁","Ἰξίων（Ixion）","被縛於火輪的罪人",28.8,6.0,"拉庇泰人之王，希臘神話中第一個殺害血親的人（謀殺岳父）。眾神皆不願淨化他，唯宙斯憐憫並邀他上奧林帕斯，他卻圖謀赫拉。宙斯以雲造出赫拉的幻影涅斐勒試他，他果然中計，遂被縛於一只永遠燃燒旋轉的輪子，在塔爾塔羅斯中滾動不止。"],
["nephele","涅斐勒","Νεφέλη（Nephele）","雲之幻影",30.2,6.0,"宙斯以雲塑成的赫拉幻影，用以試探伊克西翁。她因此生下半人馬族的始祖。另一則傳承中，她是玻俄提亞王阿塔瑪斯之妻、佛里克索斯與赫勒之母，為救子女免於後母伊諾的毒手而遣來金毛公羊——那正是日後阿爾戈船遠征所求的金羊毛。"],

/* ---- 奧林帕斯第二代 ---- */
["eileithyia","厄勒梯亞","Εἰλείθυια（Eileithyia）","分娩女神",-1.2,7.2,"宙斯與赫拉之女，助產與分娩的女神，其到來與否決定產婦的生死。赫拉曾扣住她不許她前往，使勒托陣痛九日不得生產，也使阿爾克墨涅遲遲無法產下赫拉克勒斯——直到侍女謊稱孩子已出生，她驚起而咒法自解。"],
["hebe","赫柏","Ἥβη（Hebe）","青春女神",0.2,7.2,"宙斯與赫拉之女，在奧林帕斯為諸神斟倒神酒的青春女神（後由伽倪墨得斯接手）。赫拉克勒斯完成十二偉業、火化升入神界後，與她結為夫妻，象徵苦難盡頭的永恆青春。"],
["persephone","珀耳塞福涅","Περσεφόνη（Persephone）","冥界王后・春之女神",1.6,7.2,"宙斯與得墨忒耳之女，未嫁時名為科瑞（少女）。在恩納草原採水仙時大地裂開，哈得斯駕黑馬將她劫入冥界。母親遍尋不獲而令大地荒蕪，宙斯遣赫耳墨斯迎回，但她已在冥府誤食四顆石榴籽，遂須每年返回地下——她升出地面時萬物萌發，她下降時大地枯萎。身為冥后，她也曾裁決阿多尼斯的歸屬，並應俄耳甫斯的琴聲之請放行歐律狄刻。"],
["hephaistos","赫淮斯托斯","Ἥφαιστος（Hephaistos）","鍛冶與工匠之神",5.0,7.2,"赫拉為報復宙斯獨自生出雅典娜而獨力所生（一說為宙斯與赫拉之子）。因天生跛足被母親自奧林帕斯拋下，墜入大海由忒提斯與歐律諾墨撫養九年。他造了一張精巧的黃金寶座送給赫拉，她一坐下便被無形機關鎖住，眾神束手，最後由狄俄倪索斯灌醉他才請回奧林帕斯。他在火山下的工坊造出阿基里斯之盾、潘朵拉、青銅巨人塔羅斯與能自行行走的黃金侍女。妻子阿佛洛狄忒與阿瑞斯私通，他以細如蛛絲卻堅不可斷的金網當場罩住兩人，喚諸神來看。羅馬名伏爾甘。",false,"key"],
["aphrodite","阿佛洛狄忒","Ἀφροδίτη（Aphrodite）","愛與美之女神",6.4,7.2,"烏拉諾斯被斬落的身軀墜入大海，海面湧起白沫，她自泡沫中誕生並乘貝殼登上塞浦路斯——其名即源自「aphros（泡沫）」。荷馬則另稱她為宙斯與狄俄涅之女。她擁有一條使人無法抗拒的腰帶，連赫拉也曾向她借用。帕里斯的裁決中，她以「世上最美的女子」為賄贏得金蘋果，由此引發特洛伊戰爭。羅馬名維納斯。",false,"key"],
["ares","阿瑞斯","Ἄρης（Ares）","戰爭與殺戮之神",7.8,7.2,"宙斯與赫拉之子，司掌戰場上的血腥、狂暴與屠戮，與雅典娜所代表的謀略之戰恰成對比。《伊利亞特》中宙斯直言「在所有奧林帕斯諸神中，我最厭惡你」。他屢戰屢敗：被狄俄墨得斯刺傷、被雅典娜以巨石擊倒、被阿洛伊代兄弟關在青銅甕中十三個月。與阿佛洛狄忒的私情被赫淮斯托斯的金網當眾擒獲。羅馬名瑪爾斯，地位遠比希臘為尊。",false,"key"],
["athena","雅典娜","Ἀθηνᾶ（Athena）","智慧・戰略・工藝女神",9.2,7.2,"宙斯與墨提斯之女。宙斯吞下懷孕的墨提斯後頭痛欲裂，赫淮斯托斯以斧劈開其頭顱，她全副武裝、高聲吶喊著躍出。她司掌有謀略的戰爭、紡織、造船與工藝，以橄欖樹贏得雅典的守護權。她助珀耳修斯斬美杜莎（並將其首級嵌於神盾埃癸斯）、助赫拉克勒斯完成偉業、助奧德修斯返鄉。凡人少女阿剌克涅誇口織技勝過她，被她變為蜘蛛。永守貞潔，羅馬名彌涅耳瓦。",false,"key"],
["apollon","阿波羅","Ἀπόλλων（Apollon）","光明・預言・音樂之神",10.6,7.2,"宙斯與勒托之子，出生僅四日便前往德爾斐射殺盤踞當地的巨蟒皮同，奪得神諭所，並設立皮提亞競技會贖罪。他司掌預言、醫術、瘟疫、音樂與弓術——同一把弓既降瘟疫也止瘟疫。他愛戀達佛涅，她卻化為月桂樹，月桂遂成他的聖物；他賜卡珊德拉預言之能，又因她拒愛而咒她的預言永不被信。因宙斯殺了他的兒子阿斯克勒庇俄斯，他射殺庫克洛普斯洩憤而被罰為凡人牧羊一年。後世與太陽神合一。",false,"key"],
["artemis","阿耳忒彌斯","Ἄρτεμις（Artemis）","狩獵與野性之女神",12.0,7.2,"阿波羅的孿生姊姊，剛出生便助母親接生弟弟，故也受孕婦祈求。她向父親求得永恆的處女之身、一把銀弓與一群山林寧芙隨侍。獵人阿克泰翁窺見她沐浴，被變成牡鹿遭自己的獵犬撕食；同伴卡利斯托失貞後被變為母熊。她因阿伽門農射殺聖鹿而止住風勢，逼他獻祭女兒伊菲革涅亞，卻在最後一刻以鹿相代將少女救走。後世與月亮合一，羅馬名狄安娜。",false,"key"],
["hermes","赫耳墨斯","Ἑρμῆς（Hermes）","神使・旅人與商賈之神",13.4,7.2,"宙斯與邁亞之子。出生當日便爬出襁褓，盜走阿波羅的五十頭聖牛並倒著趕行以亂足跡，又以龜甲與羊腸造出七弦琴；阿波羅尋來對質，聽見琴聲竟甘願以牛群交換。他是諸神的使者，戴翼帽持雙蛇杖，也是唯一能自由往來冥界的引魂者（Psychopompos），司掌道路、商賈、盜賊、辯才與睡眠。他曾殺死百眼巨人阿爾戈斯救出伊俄，也曾贈莫呂草助奧德修斯抵禦喀耳刻。羅馬名墨丘利。",false,"key"],
["triton","特里同","Τρίτων（Triton）","海之傳令",14.8,7.2,"波塞冬與安菲特里忒之子，人身魚尾，手持螺號。吹響海螺可掀起或平息波濤，是父親的傳令官。大洪水後正是他奉命吹號令洪水退去。他也曾在利比亞指引迷航的阿爾戈船返回大海。"],
["mousai_note","繆斯九女神","Μοῦσαι（Mousai）","宙斯與謨涅摩敘涅之女",19.0,7.2,"卡利俄佩（史詩，俄耳甫斯之母）、克利俄（歷史）、歐忒耳佩（抒情詩）、塔利亞（喜劇）、墨爾波墨涅（悲劇）、忒耳普西科瑞（舞蹈）、埃拉托（情詩）、波呂許謨尼亞（頌歌）、烏拉尼亞（天文）。她們居於赫利孔山與帕耳那索斯山，飲皮厄里亞泉水，一切詩人開篇皆先呼求其名。色雷斯歌手塔米里斯誇言歌藝勝過她們，被奪去視力與琴技。",true],
["horai_note","荷賴（時序女神）","歐諾彌亞・狄刻・厄瑞涅","宙斯與忒彌斯之女",20.4,7.2,"良序（歐諾彌亞）、正義（狄刻）與和平（厄瑞涅）三女神，司掌季節推移、農時與人間秩序，並看守奧林帕斯的雲門。狄刻會將人間的不義一一稟報宙斯。另一系傳承中荷賴為春夏秋冬四時。",true],
["charites_note","卡里忒斯（美惠三女神）","阿格萊亞・歐佛洛敘涅・塔利亞","宙斯與歐律諾墨之女",21.8,7.2,"光輝（阿格萊亞）、歡欣（歐佛洛敘涅）與繁盛（塔利亞）三女神，司掌優雅、美、感恩與宴樂，常隨侍於阿佛洛狄忒身側，也為她編織衣裳。阿格萊亞後成為赫淮斯托斯的妻子。羅馬名格拉提亞（Graces）。",true],
["polyphemos","波呂斐摩斯","Πολύφημος（Polyphemos）","食人的獨眼巨人",23.2,7.2,"波塞冬與海仙女托俄薩之子，西西里島的牧羊獨眼巨人。奧德修斯一行誤入其洞穴，他以巨石封門並生食數名船員。奧德修斯自稱名叫「無人（Οὖτις）」，以酒將他灌醉後用燒紅的橄欖木樁刺瞎其獨眼；他呼救時喊「無人害我」，鄰人遂不理會。眾人藏於羊腹下逃出，奧德修斯得意地報上真名，他便向父親波塞冬詛咒——十年漂泊由此而來。他也曾單戀海仙女加拉忒亞，因妒而以巨石砸死其愛人阿喀斯。"],
["charybdis","卡律布狄斯","Χάρυβδις（Charybdis）","吞吐海水的大漩渦",24.6,7.2,"波塞冬與蓋亞之女，因替父親擴張領地、吞食赫拉克勒斯的牛群而被宙斯打入海中。她每日三次吞入海水又噴吐而出，形成足以吞沒整艘船的巨大漩渦，與對岸礁石上的斯庫拉共扼一道窄海峽——「在斯庫拉與卡律布狄斯之間」遂成為兩難處境的成語。奧德修斯選擇貼近斯庫拉犧牲六名船員，仍勝過全船覆沒。"],
["seirenes_note","塞壬（賽蓮）","Σειρῆνες（Seirenes）","以歌聲奪命的鳥身女妖",26.0,7.2,"河神阿刻羅俄斯與一位繆斯所生，人首鳥身，棲於花草間堆滿白骨的島嶼。她們的歌聲許諾「知曉一切」，航行者無不轉舵而觸礁枯死。奧德修斯依喀耳刻之計，以蜂蠟封住船員雙耳、命人將自己牢綁於桅杆，成為唯一聽過塞壬之歌而生還的人；阿爾戈船經過時則由俄耳甫斯彈琴壓過其聲。傳說凡有人成功通過，她們便投海而死。",true],
["lamia","拉彌亞","Λάμια（Lamia）","吞食孩童的女妖",27.4,7.2,"原為利比亞的美麗王后、波塞冬之女，因與宙斯生子而遭赫拉報復——她的孩子全被奪走殺害。悲慟使她面容扭曲成怪物，開始吞食他人的嬰孩；赫拉又剝奪她的睡眠，宙斯憐憫，賜她可取下自己的眼睛稍作歇息。她能化為美女誘惑青年吸其血，是後世希臘民間嚇阻孩童的「拉彌亞」與吸血傳說的源頭，同類尚有恩浦薩與摩耳摩。"],
["python","皮同","Πύθων（Python）","德爾斐的地母巨蟒",28.8,7.2,"蓋亞所生的巨蟒，盤踞帕耳那索斯山麓的德爾斐，守護大地女神的神諭所，並曾奉赫拉之命追殺懷孕的勒托。阿波羅出生四日便前往將牠射殺，奪得神諭所——女祭司此後稱「皮提亞」，四年一度的皮提亞競技會亦為紀念此事。其屍身腐爛（πύθειν）於聖地之下，德爾斐因此得名。"],
["argos_panoptes","阿爾戈斯・帕諾普忒斯","Ἄργος Πανόπτης（Argos）","百眼巨人",30.2,7.2,"渾身長滿一百隻眼睛的大地之子，睡眠時永遠有半數眼睛醒著，故名「全視者」。赫拉命他看守被變成白牛的伊俄。宙斯遣赫耳墨斯前往，赫耳墨斯以牧笛與冗長的故事使他所有的眼睛逐一闔上，再一劍斬下其首。赫拉將他的百眼移到孔雀的尾羽上，那便是孔雀開屏的由來。"],
["kentauroi_note","肯陶洛斯（半人馬族）","Κένταυροι（Kentauroi）","伊克西翁與雲之子孫",31.6,7.2,"伊克西翁與雲之幻影涅斐勒所生的後代，居於忒薩利亞的皮利翁山，性情粗野嗜酒。拉庇泰王庇里托俄斯的婚宴上，他們酒醉欲擄新娘，引發著名的「拉庇泰與半人馬之戰」，帕德嫩神廟的浮雕即刻此役。族中唯有喀戎與福羅斯出身不同、性情溫文。",true],

/* ---- 蓬托斯與蓋亞之後：海之神族 ---- */
["eurybia","歐律比亞","Εὐρυβία（Eurybia）","海之堅毅",29.0,3.6,"蓬托斯與蓋亞之女，赫西俄德說她「心中懷有精鋼」。與泰坦克利俄斯結合，生下星空、戰陣與毀滅三神。"],
["nereus","涅柔斯","Νηρεύς（Nereus）","海中老人",30.4,3.6,"蓬托斯的長子，誠實不欺、從不說謊的「海中老人」，通曉一切預言並能隨意變形。赫拉克勒斯為問出金蘋果園的所在，趁他熟睡時將他牢牢抱住，任他化為火焰、流水、猛獸也不鬆手，終於逼出答案。"],
["thaumas","陶瑪斯","Θαύμας（Thaumas）","海之奇景",31.8,3.6,"蓬托斯之子，其名意為「奇異、驚嘆」，是海上種種瑰麗異象的神格。與大洋仙女厄勒克特拉生下彩虹女神伊里斯與鷹身女妖哈耳庇厄——一者美麗、一者可怖，同為天海之間倏忽而至的現象。"],
["phorkys","福耳庫斯","Φόρκυς（Phorkys）","海之凶險",33.2,3.6,"蓬托斯之子，司掌深海的險惡與泡沫。與姊妹刻托結合，生下希臘神話中最著名的一系怪物。伊薩卡島上有一處以他命名的港灣，正是費埃克斯人放下沉睡的奧德修斯之處。"],
["keto","刻托","Κητώ（Keto）","海怪之母",34.6,3.6,"蓬托斯與蓋亞之女，其名即「海獸（cetacean 一詞的字源）」。與福耳庫斯生下格賴埃、戈耳工、厄客德娜與看守金蘋果的巨龍拉冬，是眾多海陸怪物的母親。"],
["nereides_note","涅瑞伊得斯（五十海仙女）","Νηρηΐδες（Nereides）","涅柔斯與多里斯之女",28.3,4.8,"涅柔斯與多里斯所生的五十位海中仙女，乘海豚與海馬遨遊，護佑水手。忒提斯、安菲特里忒與加拉忒亞皆在其列。衣索比亞王后卡西俄佩亞誇口自己比涅瑞伊得斯更美，激怒她們請波塞冬降下海怪，遂有安德洛墨達被縛於礁石、珀耳修斯前來相救之事。",true],
["iris","伊里斯","Ἶρις（Iris）","彩虹女神・神使",29.7,4.8,"陶瑪斯之女，以彩虹為橋往來天地海三界的神使，尤其是赫拉的傳令。諸神立誓時，由她取來冥河斯提克斯的水置於金壺。與赫耳墨斯不同，她多服務於神界內部的傳訊。"],
["harpyiai_note","哈耳庇厄（鷹身女妖）","Ἅρπυιαι（Harpyiai）","陶瑪斯之女",31.1,4.8,"人面鳥身的掠奪精靈，其名意為「攫取者」，行動快如疾風，所到之處留下惡臭。盲眼先知菲紐斯因洩漏神意受罰，每逢進食便被她們奪走或污穢食物；阿爾戈船經過時，北風之子卡拉伊斯與仄忒斯乘翼追逐，終將她們驅離。",true],
["graiai_note","格賴埃三姊妹","Γραῖαι（Graiai）","福耳庫斯與刻托之女",32.5,4.8,"生來即是白髮老嫗的三姊妹（得諾、恩虞俄、佩佛瑞多），三人共用一顆眼珠與一顆牙齒，輪流傳遞使用。珀耳修斯趁她們交遞眼珠的瞬間奪走，逼問出戈耳工的所在與獲取飛鞋、隱形盔的方法，事成後將眼珠拋入湖中。",true],
["gorgones_note","戈耳工姊妹","斯忒諾・歐律阿勒","福耳庫斯與刻托之女",33.9,4.8,"不死的兩位戈耳工姊妹：斯忒諾（強壯）與歐律阿勒（遠跳）。蛇髮、青銅之手、黃金雙翼與野豬般的獠牙，凡與其對視者立刻化為石頭。妹妹美杜莎被珀耳修斯斬首時，兩人的怒吼與追逐幾乎追上了他，全靠隱形盔才得脫身。",true],
["medusa","美杜莎","Μέδουσα（Medusa）","唯一會死的戈耳工",35.3,4.8,"戈耳工三姊妹中唯一具死性者，其名意為「守護者」。奧維德的傳承說她原是絕美的少女、以秀髮聞名，因在雅典娜神廟中遭波塞冬所辱，反被女神將秀髮變成毒蛇、目光化人為石。珀耳修斯以青銅盾的映影避開她的視線，趁其熟睡斬下首級；她的血自頸中噴出，飛馬珀伽索斯與持金劍的克律薩俄耳隨之躍出。首級即使離體仍有石化之力，珀耳修斯以之救出安德洛墨達、石化了阿特拉斯，最後獻予雅典娜嵌在神盾埃癸斯上。"],
["ladon","拉冬","Λάδων（Ladon）","看守金蘋果的百頭龍",36.7,4.8,"盤繞於赫斯佩里得斯樂園金蘋果樹上的巨龍，據說有一百顆頭、能說各種語言，永不闔眼。赫拉克勒斯的第十一項偉業即為取得金蘋果——一說他射殺了拉冬，一說他請阿特拉斯代取。赫拉將牠升上天際化為天龍座。"],
["skylla","斯庫拉","Σκύλλα（Skylla）","六頭十二足的海崖女妖",38.1,4.8,"原為美麗的海仙女，因海神格勞科斯愛慕她而向喀耳刻求助藥水，喀耳刻自己愛著格勞科斯，遂在她沐浴的水中下毒——她的下身變成六個長頸犬首與十二隻足（另一說是安菲特里忒出於妒意所為）。她盤踞窄海峽一側的礁洞，每有船隻經過便伸出六頭各叼走一人。奧德修斯明知如此仍選擇貼近她航行，以六名船員換取全船生還。"],
["pegasos","珀伽索斯","Πήγασος（Pegasos）","生有雙翼的天馬",33.9,6.0,"美杜莎被斬時自其頸血中躍出的飛馬。牠一蹄踏出赫利孔山的靈感之泉希波克瑞涅，繆斯常在泉邊聚會。柏勒洛豐得雅典娜所贈的金轡將牠馴服，騎乘牠斬殺了噴火的奇美拉；後來柏勒洛豐狂妄地想騎牠飛上奧林帕斯，宙斯遣一隻牛虻叮咬馬腹將他摔落。珀伽索斯獨自飛抵天界為宙斯馱運雷霆，終成飛馬座。"],
["chrysaor","克律薩俄耳","Χρυσάωρ（Chrysaor）","持金劍的巨人",35.3,6.0,"與珀伽索斯同時自美杜莎的頸血中誕生，出生即手持黃金之劍。他與大洋仙女卡利羅厄生下三頭三身的巨人革律翁。"],

/* ---- 堤豐與厄客德娜：怪物的譜系 ---- */
["typhon","堤豐","Τυφῶν（Typhon）","百首風暴巨神",35.3,7.2,"蓋亞因宙斯將巨人族打入深淵而震怒，與塔爾塔羅斯結合生下的最後也最可怕的孩子。他高及星辰，雙臂展開自東至西，肩上生出一百顆吐火的龍首，腰部以下是纏繞嘶鳴的巨蛇。他一出現，眾神驚逃至埃及化為各種動物躲藏。他曾割去宙斯手腳的筋腱藏於洞中，赫耳墨斯與潘偷回筋腱，宙斯才得以雷霆反擊，最終將他壓在埃特納火山之下——火山的噴發與地震即他的掙扎。颱風（typhoon）一詞或與其名有關。",false,"key"],
["echidna","厄客德娜","Ἔχιδνα（Echidna）","眾怪之母",36.7,7.2,"上半身是明眸美女、下半身為巨大花斑蛇的女妖，居於阿里瑪的岩窟中生食路人。福耳庫斯與刻托之女，與堤豐結合，生下希臘神話中幾乎所有的著名怪物，故稱「眾怪之母」。她永生不老，最後在睡夢中被百眼巨人阿爾戈斯所殺。",false,"key"],
["kerberos","刻耳柏洛斯","Κέρβερος（Kerberos）","冥界的三頭犬",33.9,8.4,"看守冥界之門的三頭巨犬，頸背生蛇、尾為毒蛇，只准進不准出。俄耳甫斯以琴聲催眠了牠，賽姬與埃涅阿斯以蜜餅安撫牠；赫拉克勒斯的第十二項也是最後一項偉業，便是不用武器徒手將牠制伏帶到人間，再送回冥府。牠口中滴落的唾沫據說長成了劇毒的烏頭草。"],
["hydra","勒耳那的許德拉","Ὕδρα（Hydra）","九頭蛇",35.3,8.4,"棲於勒耳那沼澤的多頭水蛇，斬去一頭便長出兩頭，中央的一顆頭且是不死的，連呼吸與血液都劇毒無比。赫拉克勒斯的第二項偉業：他由侄兒伊俄拉俄斯以火把灼燒斷頸使其無法再生，最後將不死之頭壓在巨石之下。他以牠的毒血浸箭，這些毒箭日後既成就了他的偉業，也間接害死了喀戎與他自己。赫拉遣來相助許德拉的巨蟹被踩死後升為巨蟹座。"],
["orthros","俄耳托洛斯","Ὄρθρος（Orthros）","雙頭猛犬",36.7,8.4,"刻耳柏洛斯的兄弟，雙頭猛犬，為三頭巨人革律翁看守紅色的牛群。赫拉克勒斯的第十項偉業中，牠與牧人歐律提翁一同被棍棒擊斃。一說牠與母親厄客德娜結合，生下斯芬克斯與涅墨亞獅。"],
["chimaira","奇美拉","Χίμαιρα（Chimaira）","獅首羊身蛇尾的吐火怪",38.1,8.4,"前為獅、中為山羊、尾為毒蛇，口中噴出無法撲滅的烈焰，肆虐呂基亞。柏勒洛豐奉命前來討伐，騎乘天馬珀伽索斯自高空攻擊，在長矛尖端裝上鉛塊送入牠口中——鉛被烈焰熔化流入喉間，牠遂窒息而死。「奇美拉」一詞後泛指一切拼合而成的幻想生物。"],
["geryon","革律翁","Γηρυών（Geryon）","三頭三身的巨人",39.5,8.4,"克律薩俄耳之子，居於世界最西方的紅色島嶼厄律提亞，擁有三個頭、三副身軀與一群紅牛，由雙頭犬俄耳托洛斯與牧人看守。赫拉克勒斯的第十項偉業即為奪取這群牛：他一路西行時因酷熱難耐而向太陽神射箭，赫利俄斯反讚其膽識，借給他渡海的金杯。他以一支九頭蛇毒箭穿透革律翁的三副身軀。"],
["sphinx","斯芬克斯","Σφίγξ（Sphinx）","出謎題的獅身女怪",35.3,9.6,"女子頭顱、獅身、鷹翼、蛇尾的怪物，受赫拉之遣盤踞底比斯城外的山崖，向過路者發問：「什麼東西早晨四足、中午兩足、傍晚三足？」答不出者立遭吞噬。伊底帕斯答出「人」，牠遂羞憤投崖而死，底比斯人擁他為王——而這恰恰把他推入了弒父娶母的神諭之中。"],
["nemean_lion","涅墨亞獅","Λέων Νεμέος（Nemean Lion）","刀槍不入的巨獅",36.7,9.6,"皮毛堅不可摧、爪利如刃的巨獅，肆虐涅墨亞谷地。赫拉克勒斯的第一項偉業：弓箭在其皮上彈開，木棒也只能將牠打暈，最後他徒手扼住牠的咽喉將其勒斃，再以獅自身的利爪剝下皮毛，從此披獅皮、戴獅首而行——那成為他最著名的形象。宙斯將牠升上天際化為獅子座。"],
["talos","塔羅斯","Τάλως（Talos）","守衛克里特的青銅巨人",31.2,8.4,"赫淮斯托斯（一說代達羅斯）所鑄的青銅自動人偶，受宙斯之託守衛克里特島。他每日繞島三周，向靠近的船隻投擲巨石，或將自身燒紅擁抱入侵者。他體內只有一條血管自頸貫至腳踝，由一枚青銅釘封住。阿爾戈船抵達時，美狄亞以咒術使他陷入恍惚，他擦傷了腳踝，神血（ichor）如熔鉛般流盡而崩塌——常被稱為神話中最早的機器人。"],

/* ---- 宙斯的凡間伴侶與第四代 ---- */
["anteros","安忒洛斯","Ἀντέρως（Anteros）","相愛與溫情之神",-7.8,8.4,"阿瑞斯與阿佛洛狄忒之子，厄洛斯的弟弟。其名意為「回應的愛」——他懲罰那些接受愛卻不予回報的人，也守護相互回應的深情。保薩尼亞斯《希臘志》記載，厄洛斯獨自成長時始終長不大，忒彌斯告知阿佛洛狄忒：愛必須得到回應才能茁壯；安忒洛斯誕生後，兄長果然日漸長成。雅典曾為他立祭壇，紀念一名少年因單戀被拒而墜崖的悲劇。小行星 1943 即以他命名。"],
["eros","厄洛斯","Ἔρως（Eros）","愛神",-6.4,8.4,"後世傳承中為阿瑞斯與阿佛洛狄忒之子，手持金箭與鉛箭：中金箭者陷入狂戀，中鉛箭者心生厭憎。阿波羅嘲笑他的弓小，他便以金箭射阿波羅、鉛箭射達佛涅，成就了月桂的悲劇。他自己也曾為母親所妒——奉命去害凡間美少女普緒克，卻誤傷自己而愛上她，兩人歷經考驗終得宙斯許可成婚，普緒克飲下神饌成為靈魂女神。羅馬名丘比特。"],
["deimos","得摩斯","Δεῖμος（Deimos）","恐懼之神",-5.0,8.4,"阿瑞斯與阿佛洛狄忒之子，戰場上臨陣的恐慌之化身，與兄弟福波斯一同為父親駕馭戰車。火星的兩顆衛星即以這對兄弟命名。"],
["phobos","福波斯","Φόβος（Phobos）","驚駭之神",-3.6,8.4,"得摩斯的兄弟，令軍陣潰散奔逃的驚駭之神。阿伽門農的盾牌與赫拉克勒斯的盾上皆刻有他的面容以震懾敵人；「恐懼症（phobia）」一詞即源自其名。"],
["alkmene","阿爾克墨涅","Ἀλκμήνη（Alkmene）","邁錫尼的王女",-6.4,12.0,"珀耳修斯的孫女，以美貌與貞潔著稱。她要求丈夫安菲特律翁為她的兄弟復仇後才圓房；宙斯趁其出征，化為安菲特律翁的模樣前來，並令那一夜長達三倍——赫拉克勒斯由此受孕。當夜稍晚真正的丈夫歸來，她遂懷了雙生子，一為神裔的赫拉克勒斯，一為凡人的伊菲克勒斯。"],
["danae","達那厄","Δανάη（Danae）","阿爾戈斯的王女",-0.6,8.4,"阿爾戈斯王阿克里西俄斯之女。神諭稱其子將殺死外祖父，父親遂將她囚於地下銅室。宙斯化作黃金雨自天窗流瀉而下與她結合，生下珀耳修斯。父親不敢直接殺害血親，把母子裝入木箱投海，箱漂至塞里福斯島獲救。多年後珀耳修斯在競技中擲鐵餅失手，恰好擊中觀眾席上的外祖父——神諭終究應驗。"],
["leda","勒達","Λήδα（Leda）","斯巴達王后",0.8,8.4,"埃托利亞王女，斯巴達王廷達瑞俄斯之妻。宙斯化為天鵝、佯裝被鷹追逐而投入她懷中與之結合；同夜她也與丈夫同寢。她產下兩枚卵，孵出海倫與波呂丟刻斯（宙斯之子，不死）以及卡斯托耳與克呂泰涅斯特拉（凡人之子）。「勒達與天鵝」是西方藝術史上反覆描繪的題材。"],
["europa","歐羅巴","Εὐρώπη（Europe）","腓尼基的王女",2.2,8.4,"腓尼基推羅王阿革諾耳之女。她與侍女在海邊採花時，宙斯化為一頭雪白溫馴的公牛臥於草地，她大膽騎上牛背，公牛立刻躍入海中載她渡往克里特島。她在那裡生下彌諾斯、拉達曼提斯與薩耳珀冬。歐洲大陸即以她的名字命名；她的兄弟卡德摩斯奉父命尋妹不獲，輾轉建立了底比斯。"],
["io","伊俄","Ἰώ（Io）","阿爾戈斯的祭司",3.6,8.4,"赫拉神廟的女祭司。宙斯為隱瞞私情將她變作白牛，赫拉識破後索為己有，遣百眼巨人阿爾戈斯看守。赫耳墨斯斬殺阿爾戈斯後，赫拉又降下牛虻不斷叮咬，驅使她發狂流浪橫越歐亞——愛奧尼亞海與博斯普魯斯（意為「牛之渡口」）皆因此得名。途中她曾遇見被縛於高加索山的普羅米修斯，得知自己終將在埃及恢復人形，其後裔中將有一人解放他。"],

/* ---- 卡德摩斯與底比斯王室 ---- */
["kadmos","卡德摩斯","Κάδμος（Kadmos）","底比斯的建立者",5.4,8.4,"腓尼基王子，奉父命尋找被擄的妹妹歐羅巴，遍尋不獲而求問德爾斐神諭，得到「隨一頭母牛而行，牛臥處建城」之語。他在該處欲取水獻祭，卻遇戰神阿瑞斯的聖泉之龍，屠龍後依雅典娜指示播下龍牙，地裡長出全副武裝的武士互相殘殺，殘存的五人成為底比斯貴族之祖。他為此役服侍阿瑞斯八年，其後迎娶阿瑞斯與阿佛洛狄忒之女哈耳摩尼亞——那是第一場眾神親臨的凡人婚禮。相傳他將腓尼基字母帶入希臘。"],
["harmonia","哈耳摩尼亞","Ἁρμονία（Harmonia）","和諧女神",6.8,8.4,"阿瑞斯與阿佛洛狄忒之女，戰爭與愛情所生的「和諧」。婚禮上受贈赫淮斯托斯所打造的項鍊——鍛造者因妻子的不忠而在其中織入詛咒，該項鍊使歷代持有者美貌不老，卻為底比斯王室帶來世代的血光。晚年她與卡德摩斯一同化為蛇，被送往至福樂土。"],
["semele","塞墨勒","Σεμέλη（Semele）","底比斯的王女",4.8,9.6,"卡德摩斯與哈耳摩尼亞之女。與宙斯相戀懷孕後，赫拉化為老乳母挑唆她，要她求情人以真身相見以證明神格。宙斯已指冥河立誓應允她任何請求，只得含淚顯現雷霆真容，她當場被神火焚毀。宙斯自灰燼中取出六個月的胎兒，縫入自己的大腿育至足月——狄俄倪索斯因此被稱為「二度出生者」。後來狄俄倪索斯下冥界將母親接出，升為神祇提俄涅。"],
["ino","伊諾","Ἰνώ（Ino）","後成為海之女神琉科忒亞",6.2,9.6,"卡德摩斯之女。她撫養外甥狄俄倪索斯而遭赫拉降下瘋狂，抱著幼子墨利刻耳忒斯投海；諸神憐憫，將她化為救助船難者的海之女神琉科忒亞（白色女神）。奧德修斯的木筏被波塞冬擊碎時，正是她浮出海面遞給他一條神奇的頭巾，使他得以泅至費埃克斯人的島岸。她也是使佛里克索斯與赫勒出逃的惡毒後母。"],
["agaue","阿高厄","Ἀγαυή（Agaue）","彭透斯之母",7.6,9.6,"卡德摩斯之女。她與姊妹否認狄俄倪索斯的神性、譏諷姊姊塞墨勒的遭遇，酒神遂令她們陷入狂亂奔入庫泰戎山中。其子、底比斯王彭透斯前往窺探酒神祭，被瘋狂中的她誤認為獅子，親手撕下他的頭顱高舉而歸——歐里庇得斯《酒神的女信徒》即以此為高潮。"],
["autonoe","奧托諾厄","Αὐτονόη（Autonoe）","阿克泰翁之母",9.0,9.6,"卡德摩斯之女。其子阿克泰翁是喀戎教出的名獵人，某日在山中無意撞見阿耳忒彌斯沐浴，女神震怒將他潑水變成一頭牡鹿，他自己的五十隻獵犬認不出主人，將他撕咬而死。"],
["polydoros","波呂多洛斯","Πολύδωρος（Polydoros）","底比斯之王",10.4,9.6,"卡德摩斯唯一的兒子，繼承底比斯王位。他是拉布達科斯、拉伊俄斯與伊底帕斯這條悲劇血脈的起點。"],

/* ---- 斯巴達・邁錫尼與特洛伊戰爭 ---- */
["tyndareos","廷達瑞俄斯","Τυνδάρεως（Tyndareos）","斯巴達之王",11.6,8.4,"勒達之夫。海倫的求婚者遍及全希臘，他不知如何取捨又恐得罪落選者，奧德修斯獻計：令所有求婚者事先立誓，無論誰獲選，眾人都將共同維護這樁婚姻。此誓日後正是希臘各邦不得不出兵特洛伊的根據——奧德修斯自己也因此被迫離家十年。"],
["atreus","阿特柔斯","Ἀτρεύς（Atreus）","邁錫尼之王",13.0,8.4,"珀羅普斯之子，邁錫尼王，其家族背負著坦塔羅斯以來的世代詛咒。他與兄弟堤厄斯忒斯爭奪王位，堤厄斯忒斯誘姦其妻，阿特柔斯遂佯裝和解設宴，席上端出的竟是堤厄斯忒斯自己孩子的肉。太陽為之倒行，詛咒由此延續到阿伽門農與俄瑞斯忒斯兩代。"],
["peleus","珀琉斯","Πηλεύς（Peleus）","密耳彌多涅斯之王",14.4,8.4,"埃吉那王之子，因誤殺兄弟而流亡，由喀戎收留。忒彌斯預言「忒提斯之子必勝過其父」，宙斯與波塞冬遂放棄追求，將她許配給凡人珀琉斯。他依喀戎之計，在她變為火、水、獅、蛇時死死抱住不放，終得娶她。婚宴上厄里斯投下金蘋果，特洛伊戰爭由此埋下種子。"],
["thetis","忒提斯","Θέτις（Thetis）","海之女神",15.8,8.4,"涅柔斯之女中最著名者，能變化萬形。她曾在赫拉將赫淮斯托斯拋下天界時收養他，也曾召來百臂巨人布里阿瑞俄斯解救被眾神綁縛的宙斯。為使兒子阿基里斯不死，她持其足踝將他浸入冥河斯提克斯——唯獨手指握住的足踝未沾水。她曾將他扮作女子藏於斯庫羅斯島以避戰，也曾請赫淮斯托斯為他重鑄神盾，並始終知道他一去便不會回來。"],
["helene","海倫","Ἑλένη（Helene）","世上最美的女子",11.8,9.6,"宙斯與勒達之女，斯巴達王墨涅拉俄斯之妻。少女時即曾被忒修斯擄走，由雙生兄長奪回。阿佛洛狄忒為兌現對帕里斯的許諾，使她隨這位特洛伊王子出奔，全希臘依舊誓出兵，遂有十年的特洛伊戰爭——「引發千艘戰船的臉孔」。城破後墨涅拉俄斯本欲殺她，見其容顏又擲下了劍。另有一系傳承說真正的海倫始終在埃及，特洛伊城中的只是一個幻影。"],
["polydeukes","波呂丟刻斯","Πολυδεύκης（Polydeukes）","不死的雙子",13.2,9.6,"宙斯與勒達之子，拳擊無敵。他與凡人兄弟卡斯托耳形影不離，同赴阿爾戈船遠征與卡呂冬野豬狩獵。卡斯托耳在一場搶奪牛群與新娘的爭鬥中被殺，他悲痛欲絕，向父親請求分享自己的不死之身；宙斯應允，兄弟自此輪流一日在冥界、一日在奧林帕斯，並被升為雙子座——水手在暴風中所見的聖艾爾摩之火即被視為他們的顯現。羅馬名波魯克斯。"],
["kastor","卡斯托耳","Κάστωρ（Kastor）","凡人的雙子・馴馬者",14.6,9.6,"廷達瑞俄斯之子，善馴馬與馬術。與孿生兄弟合稱狄俄斯庫洛伊（宙斯的少年），是水手、旅人與騎士的守護神。"],
["klytaimnestra","克呂泰涅斯特拉","Κλυταιμνήστρα（Klytaimnestra）","邁錫尼王后",16.0,9.6,"海倫的姊妹，阿伽門農之妻。希臘艦隊困於奧利斯無風可行，丈夫以「與阿基里斯成婚」為由騙來長女伊菲革涅亞獻祭求風——她從此懷恨十年。丈夫自特洛伊凱旋當日，她鋪開紫毯迎接，在浴室中以網罩住他，與情夫埃癸斯托斯一同將他斬殺，連同帶回的女俘卡珊德拉。八年後她自己也死在兒子俄瑞斯忒斯的復仇之劍下。"],
["agamemnon","阿伽門農","Ἀγαμέμνων（Agamemnon）","希臘聯軍統帥",17.4,9.6,"阿特柔斯之子，邁錫尼之王，希臘聯軍的最高統帥。《伊利亞特》開篇即因他強奪阿基里斯的戰利品布里塞伊斯而激怒對方拒戰，希臘軍幾乎覆滅。他為求順風而獻祭女兒伊菲革涅亞，種下自身死於妻子之手的因由。"],
["menelaos","墨涅拉俄斯","Μενέλαος（Menelaos）","斯巴達之王",18.8,9.6,"阿伽門農之弟，海倫之夫。妻子被帕里斯帶走後，他依當年的求婚者誓約召集全希臘出兵。他曾與帕里斯單挑幾乎取勝，卻被阿佛洛狄忒以雲霧救走對手。戰後他與海倫在海上漂流八年，途中制伏了海中老人普羅透斯才問出歸途，最終返回斯巴達，並在《奧德賽》中款待了前來尋父的忒勒馬科斯。"],
["achilleus","阿基里斯","Ἀχιλλεύς（Achilleus）","特洛伊戰爭最強的戰士",20.2,9.6,"珀琉斯與忒提斯之子，由喀戎撫養長大。母親曾將他浸入冥河使全身刀槍不入，唯有被握住的足踝是弱點。他明知出征必死仍選擇「短暫而不朽的榮名」。因阿伽門農奪走布里塞伊斯而憤然罷戰，眼看希臘軍節節敗退；摯友帕特羅克洛斯披他的鎧甲出戰身亡後，他重返戰場斬殺赫克托耳並拖屍繞城，直到老王普里阿摩斯夜訪帳中親吻他的手求子屍，他才落淚交還。最終為帕里斯之箭射中足踝而亡——「阿基里斯腱」由此得名。",false,"key"],
["iphigeneia","伊菲革涅亞","Ἰφιγένεια（Iphigeneia）","被獻祭的長女",13.2,10.8,"阿伽門農與克呂泰涅斯特拉的長女。希臘艦隊因阿耳忒彌斯震怒而困於奧利斯，父親以與阿基里斯成婚為名將她騙來獻祭。歐里庇得斯筆下她最終自願走上祭壇；就在刀落的瞬間，阿耳忒彌斯以一頭鹿相代，將她攝往陶里斯擔任自己的女祭司。多年後她在那裡與前來取神像的弟弟俄瑞斯忒斯重逢。"],
["orestes","俄瑞斯忒斯","Ὀρέστης（Orestes）","弒母的復仇者",14.6,10.8,"阿伽門農之子。父親被弒時他被姊姊厄勒克特拉送出宮外。成年後奉阿波羅神諭返回邁錫尼，與姊姊聯手殺死母親克呂泰涅斯特拉及其情夫。他因弒母而被復仇女神厄里倪厄斯追逐至發狂，逃往雅典受審——雅典娜設立戰神山法庭，投下決定性的一票宣判無罪，復仇女神轉化為「善意女神」。這是希臘由血族復仇走向城邦法治的神話宣言，構成埃斯庫羅斯《奧瑞斯提亞》三部曲。"],
["elektra_m","厄勒克特拉","Ἠλέκτρα（Elektra）","阿伽門農之女",16.0,10.8,"阿伽門農與克呂泰涅斯特拉之女。父親遇害後在宮中受盡屈辱，日夜守候弟弟歸來復仇，是索福克勒斯與歐里庇得斯同名悲劇的主角。佛洛伊德所稱的「厄勒克特拉情結」即取自她。"],
["hermione","赫耳彌俄涅","Ἑρμιόνη（Hermione）","斯巴達的公主",17.4,10.8,"墨涅拉俄斯與海倫的獨生女。母親出奔特洛伊時她年僅九歲。戰後她先被許配給阿基里斯之子涅俄普托勒摩斯，後嫁與表兄俄瑞斯忒斯，兩條血脈就此合流。"],

/* ---- 半神與英雄 ---- */
["herakles","赫拉克勒斯","Ἡρακλῆς（Herakles）","最偉大的英雄",-6.4,13.2,"宙斯與阿爾克墨涅之子，其名意為「赫拉的榮耀」——卻終生受赫拉迫害。襁褓中他徒手扼死赫拉遣來的雙蛇；成年後赫拉降下瘋狂使他親手殺死妻兒，為贖罪而受歐律斯透斯差遣完成十二項偉業。他還參與阿爾戈船遠征、解放普羅米修斯、在巨人之戰中助諸神取勝、與死神角力奪回阿爾刻提斯。最終因妻子得伊阿妮拉誤信半人馬涅索斯之言，送來浸過毒血的衣袍，劇痛難忍而自登火葬堆；凡人的部分焚盡，神性的部分升入奧林帕斯，與赫拉和解並娶青春女神赫柏。羅馬名海克力斯。",false,"key"],
["perseus","珀耳修斯","Περσεύς（Perseus）","斬殺美杜莎的英雄",-6.4,9.6,"宙斯與達那厄之子。塞里福斯王波呂得克忒斯覬覦其母，故意刁難他取來美杜莎的首級。雅典娜賜青銅盾、赫耳墨斯賜飛鞋與鐮刀、哈得斯賜隱形盔，他先制伏格賴埃三姊妹問出路徑，再以盾面映影避開石化的目光斬下蛇首。歸途中他在衣索比亞海岸救出被縛於礁石獻祭海怪的安德洛墨達並娶她為妻，又以首級石化了逼婚的波呂得克忒斯。他是邁錫尼王室與赫拉克勒斯的祖先，死後與妻子、岳母同被升為星座。"],
["rhadamanthys","拉達曼提斯","Ῥαδάμανθυς（Rhadamanthys）","冥界的判官",-3.6,9.6,"宙斯與歐羅巴之子，以公正嚴明著稱，為克里特制定了最早的法典，其法之嚴明使「拉達曼提斯的裁決」成為公道的代名詞。死後與彌諾斯、埃阿科斯同任冥界三判官，治理至福樂土。"],
["sarpedon","薩耳珀冬","Σαρπηδών（Sarpedon）","呂基亞之王",-2.2,9.6,"宙斯之子，呂基亞的統帥，率軍馳援特洛伊。《伊利亞特》中他率先攻破希臘軍的壁壘。當他注定要死於帕特羅克洛斯之手時，宙斯一度想出手相救，赫拉勸阻他不可破壞命運的定則——宙斯只得灑下血紅的雨為兒子哀悼，並命睡神與死神將遺體送回故鄉安葬。這是《伊利亞特》中最動人的一段：連眾神之王也無法免除喪子之痛。"],
["epaphos","厄帕福斯","Ἔπαφος（Epaphos）","埃及之王",-0.8,9.6,"宙斯與伊俄之子，於埃及尼羅河畔出生。其名意為「撫觸」——宙斯僅以手輕觸恢復人形的伊俄便使她受孕。他建立孟斐斯城，是達那俄斯與埃古普托斯的祖先，希臘人藉此將自身譜系與埃及相連。"],
["bellerophon","柏勒洛豐","Βελλεροφῶν（Bellerophon）","馴服天馬的英雄",0.6,9.6,"科林斯王子（一說波塞冬之子）。因誤殺人而流亡至提任斯，王后對他求愛不成反誣告他，國王不願親手殺客，遂遣他送一封「殺死持信者」的密信至呂基亞——這便是「柏勒洛豐的信」典故。呂基亞王命他去討伐奇美拉，他在雅典娜的指引下於泉邊以金轡馴服天馬珀伽索斯，自空中殺死怪物。功成名就後他狂妄地想騎天馬直上奧林帕斯，宙斯遣牛虻叮咬馬腹，他摔落人間，餘生瘸腿失明、孤獨徘徊於曠野。"],
["dionysos","狄俄倪索斯","Διόνυσος（Dionysos）","葡萄酒與狂歡之神",-6.4,10.8,"宙斯與塞墨勒之子。母親被雷火焚身後，他自宙斯的大腿中二度誕生，故稱「二度出生者」。幼時為避赫拉的追殺而被扮作女孩、輾轉託養，長成後遍遊小亞細亞與印度傳播葡萄種植，隨行的是狂女、薩堤爾與老酒師西勒諾斯。他嚴懲否認其神性者：使底比斯王彭透斯被親母撕裂、將綁架他的海盜變成海豚。他也曾下冥界迎回母親，並在納克索斯島娶被忒修斯遺棄的阿里阿德涅，將她的冠冕升為北冕座。他司掌葡萄酒、豐饒、面具與宗教性的狂喜，雅典的酒神祭正是希臘悲劇與喜劇的起源。羅馬名巴克科斯。",false,"key"],
["herakles_labors_note","十二偉業中所降伏的怪物","涅墨亞獅・許德拉・刻律涅牝鹿・厄律曼托斯野豬・斯廷法羅斯怪鳥・克里特公牛・狄俄墨得斯食人馬・革律翁・拉冬・刻耳柏洛斯","赫拉克勒斯的十二項偉業",-3.6,14.4,"歐律斯透斯所派的十二項任務：勒斃涅墨亞獅、燒斷許德拉的頭、活捉刻律涅的金角牝鹿、生擒厄律曼托斯野豬、一日清掃奧革阿斯的牛廄、驅散斯廷法羅斯的銅羽怪鳥、制伏克里特公牛、奪取狄俄墨得斯的食人馬、取來亞馬遜女王希波呂忒的腰帶、奪革律翁的紅牛、取赫斯佩里得斯的金蘋果、將刻耳柏洛斯帶出冥界。原為十項，因兩項被判定作弊（求助伊俄拉俄斯、收取報酬）而追加為十二。",true],

/* ---- 克里特王室與彌諾陶洛斯 ---- */
["kretan_bull","克里特公牛","Ταῦρος Κρής（Cretan Bull）","波塞冬所遣的白牛",-17.0,8.4,"波塞冬自海中送給彌諾斯的雪白公牛，本應獻祭回敬海神以證明其王權天授。彌諾斯貪其美而以他牛頂替，波塞冬震怒，令其妻帕西法厄瘋狂愛上這頭牛，彌諾陶洛斯由此而生。這頭牛後來在克里特島狂暴肆虐，成為赫拉克勒斯的第七項偉業；被帶至希臘後又流竄至馬拉松，最終為忒修斯所擒。"],
["pasiphae","帕西法厄","Πασιφάη（Pasiphae）","克里特王后・女巫",-15.6,8.4,"赫利俄斯之女，喀耳刻與埃厄忒斯的姊妹，同樣精通藥草。因波塞冬的詛咒而狂戀克里特公牛，請工匠代達羅斯造了一具中空的木製母牛供她藏身，遂生下牛首人身的彌諾陶洛斯。她也曾對不忠的丈夫彌諾斯下咒。"],
["minos","彌諾斯","Μίνως（Minos）","克里特之王・冥界判官",-16.3,9.6,"宙斯與歐羅巴之子，克里特的強大君主，建立克諾索斯宮並每九年上伊達山向父親宙斯領受法律。因失信於波塞冬而招致妻子產下怪物，遂命代達羅斯建造迷宮囚禁牠。其子安德洛革俄斯在雅典遇害後，他發兵逼雅典每九年進貢七對童男女餵養彌諾陶洛斯。他追捕逃亡的代達羅斯至西西里，被當地王女以滾水澆死。死後與兄弟同任冥界判官——但丁《神曲》中他仍以裁決者之姿出現。米諾斯文明因他而得名。"],
["ariadne","阿里阿德涅","Ἀριάδνη（Ariadne）","持線團的公主",-17.7,10.8,"彌諾斯與帕西法厄之女。她愛上前來獻祭的雅典王子忒修斯，向代達羅斯求得破解迷宮之法，交給他一團線與一把劍——「阿里阿德涅之線」自此成為解開難題的線索之喻。她隨他出奔，卻在納克索斯島被遺棄；狄俄倪索斯發現了睡在岸邊的她並娶為妻，將她的婚冠升上夜空成為北冕座。"],
["phaidra","菲德拉","Φαίδρα（Phaidra）","忒修斯的王后",-16.3,10.8,"阿里阿德涅的妹妹，後嫁與忒修斯。她愛上繼子希波呂托斯而不得，羞憤自縊，遺書卻誣告對方非禮。忒修斯憑信詛咒兒子，波塞冬遣海怪驚嚇馬匹，希波呂托斯墜車而死——歐里庇得斯《希波呂托斯》與拉辛《費德爾》皆演此劇。"],
["androgeos","安德洛革俄斯","Ἀνδρόγεως（Androgeos）","克里特王子",-14.9,10.8,"彌諾斯之子，在雅典的泛雅典娜競技會上連勝諸項，遭嫉妒者謀害（一說被派去獵殺馬拉松公牛而死）。彌諾斯為此揮軍圍攻雅典，逼其以童男女進貢——忒修斯的迷宮之行由此而來。"],
["minotauros","彌諾陶洛斯","Μινώταυρος（Minotauros）","牛首人身的怪物",-13.5,10.8,"帕西法厄與克里特公牛所生，牛首人身，本名阿斯忒里俄斯。彌諾斯命代達羅斯建造錯綜複雜的迷宮將牠囚於中央，每九年以雅典進貢的七對童男女餵養。忒修斯自願充作貢品進入迷宮，憑阿里阿德涅的線團找到牠並徒手（一說以劍）將其擊斃，再循線走出。牠既是懲罰的產物，也是慾望與獸性的象徵。"],

/* ---- 忒修斯・阿爾戈船・代達羅斯 ---- */
["aigeus","埃勾斯","Αἰγεύς（Aigeus）","雅典之王",21.4,8.4,"雅典國王，久無子嗣而求問神諭，得到一句他無法理解的隱語。歸途中特洛曾王依言灌醉他，使其與王女埃特拉同寢。他將寶劍與草鞋壓在巨石之下，囑咐若生男孩，待其力足移石便持信物來見。多年後兒子忒修斯出海赴克里特，約定生還則換掛白帆；忒修斯歸來時忘了更換黑帆，埃勾斯在岬角望見遂投海而死——愛琴海（Aegean）因此得名。"],
["aithra","埃特拉","Αἴθρα（Aithra）","特洛曾的王女",22.8,8.4,"特洛曾王庇透斯之女，忒修斯之母。傳說她在同一夜先後與埃勾斯及波塞冬結合，故忒修斯兼有凡王與海神兩位父親。她晚年曾被狄俄斯庫洛伊擄為海倫的侍女，隨海倫至特洛伊，城破後由孫輩救回。"],
["aison","埃宋","Αἴσων（Aison）","伊俄爾科斯的合法國王",24.2,8.4,"伊阿宋之父，王位被同母異父的兄弟珀利阿斯篡奪。為保幼子性命，他佯稱嬰兒夭折並暗中送往皮利翁山交由喀戎撫養。後世傳說美狄亞曾以巫術使他返老還童。"],
["medeia","美狄亞","Μήδεια（Medeia）","科爾喀斯的公主・女巫",25.6,8.4,"科爾喀斯王埃厄忒斯之女、喀耳刻的姪女，赫卡忒的女祭司。她為伊阿宋背叛父親：贈他防火藥膏、教他以石頭挑起龍牙武士的內鬥、以咒歌催眠不眠之龍取得金羊毛，逃亡時甚至肢解親弟拋灑海面以拖延追兵。抵達伊俄爾科斯後，她誘騙珀利阿斯的女兒們將父親剁碎入鍋「返老還童」。多年後伊阿宋為攀附科林斯王室而拋棄她，她送去浸毒的嫁衣燒死新娘與國王，再親手殺死自己與伊阿宋的兩個孩子，乘祖父赫利俄斯所賜的龍車揚長而去——歐里庇得斯《美狄亞》是希臘悲劇中最駭人也最深刻的一部。"],
["theseus","忒修斯","Θησεύς（Theseus）","雅典的建國英雄",21.6,9.6,"埃勾斯（或波塞冬）與埃特拉之子。少年時移開巨石取得父親留下的劍與鞋，執意走陸路赴雅典，沿途剷除了折人如松的辛尼斯、鐵床匪普洛克路斯忒斯、剝皮匪珀里斐忒斯等六大惡徒。抵雅典後又識破美狄亞的毒酒。他自願充作貢品前往克里特，憑阿里阿德涅的線團斬殺彌諾陶洛斯生還，卻因忘換白帆而害父投海。即位後他統一阿提卡各村為單一城邦，被雅典人尊為民主的先驅。晚年他與庇里托俄斯下冥界欲搶奪珀耳塞福涅，被囚於忘憂之椅，赫拉克勒斯途經才將他救出。",false,"key"],
["jason","伊阿宋","Ἰάσων（Jason）","阿爾戈船的船長",23.0,9.6,"埃宋之子，由喀戎撫養成人。他返回伊俄爾科斯索還王位時只穿一隻鞋（渡河時背老嫗——實為赫拉所化——而失一履），正應了篡位者珀利阿斯所懼的神諭。珀利阿斯遂命他取回科爾喀斯的金羊毛。他召集全希臘的英雄——赫拉克勒斯、俄耳甫斯、狄俄斯庫洛伊、阿塔蘭忒等——乘阿爾戈號啟航，穿越撞岩、擊退鷹身女妖，靠美狄亞相助奪得金羊毛。歸國後他背棄美狄亞另娶，落得家破人亡；晚年在腐朽的阿爾戈號殘骸下小憩，被墜落的船尾砸死。"],
["hippolytos","希波呂托斯","Ἱππόλυτος（Hippolytos）","獻身狩獵的王子",21.6,10.8,"忒修斯與亞馬遜女王希波呂忒之子。他只崇奉貞潔的阿耳忒彌斯而輕蔑阿佛洛狄忒，愛神遂使繼母菲德拉狂戀於他；他嚴詞拒絕，菲德拉自縊並留下誣告的遺書。忒修斯以波塞冬允諾的三個願望之一詛咒他，海中湧出巨牛驚了馬匹，他被拖曳致死。阿耳忒彌斯趕來揭露真相，一說醫神阿斯克勒庇俄斯後將他復活。"],
["theseus_deeds_note","忒修斯途中所除的惡徒","珀里斐忒斯・辛尼斯・克羅米翁母豬・斯喀戎・刻耳庫翁・普洛克路斯忒斯","前往雅典途中的六場戰鬥",23.0,10.8,"忒修斯效法赫拉克勒斯，捨安全海路而走盜匪橫行的陸路，以惡徒自身的手段回敬他們：以銅棒打死持棒的珀里斐忒斯、以松樹撕裂折人的辛尼斯、殺死克羅米翁的巨豬、將把旅人踢下懸崖餵龜的斯喀戎踢入海中、在摔角中制伏刻耳庫翁、把砍長補短的「鐵床匪」普洛克路斯忒斯放上他自己的床。",true],
["daidalos","代達羅斯","Δαίδαλος（Daidalos）","傳說中的第一位工匠",27.0,8.4,"雅典的天才工匠、建築師與發明家。因嫉妒外甥塔洛斯發明鋸子而將他推下衛城，遂流亡克里特。他為帕西法厄造木牛、為彌諾斯造迷宮、為阿里阿德涅獻上破解之法。事發後與兒子被囚於自己設計的迷宮，他以羽毛與蜂蠟造翼飛越大海逃脫。抵達西西里後，彌諾斯以「能穿線通過螺殼者重賞」為餌尋他——他果然解出（以蜜引螞蟻牽線），身分曝露，當地王女遂設計以滾水燙死了追來的彌諾斯。"],
["ikaros","伊卡洛斯","Ἴκαρος（Ikaros）","飛得太高的少年",31.2,9.6,"代達羅斯之子。父親以羽毛與蜂蠟為他造翼逃離克里特時再三叮嚀：勿飛太低以免海霧沾濕羽翼，勿飛太高以免烈日融去蜂蠟。少年為飛翔的喜悅所惑，愈飛愈高，蠟翼融化墜入大海——該片海域自此稱為伊卡洛斯海。這是西方文化中「僭越致禍」最著名的意象。"],
["asklepios","阿斯克勒庇俄斯","Ἀσκληπιός（Asklepios）","醫神",28.4,8.4,"阿波羅與凡人科洛尼斯之女所生。母親不忠被阿波羅射殺，火葬時阿波羅自其腹中取出嬰兒，交由喀戎教授醫術。他的醫術精進到能使死者復生（一說得雅典娜所賜的戈耳工之血），冥王哈得斯遂向宙斯抗議秩序遭破壞，宙斯以雷霆將他擊殺；阿波羅為此射殺了鑄雷的庫克洛普斯。他後被升為蛇夫座，其手杖上纏繞的蛇至今仍是醫學的標誌。"],
["orpheus","俄耳甫斯","Ὀρφεύς（Orpheus）","冥府也為之動容的樂師",29.8,8.4,"色雷斯王俄伊阿格洛斯與繆斯卡利俄佩之子，阿波羅贈他七弦琴。他的樂聲能使猛獸馴伏、樹木彎腰、頑石移步。妻子歐律狄刻被毒蛇咬死後，他抱琴下冥界，琴聲使刻耳柏洛斯入睡、坦塔羅斯忘渴、復仇女神落淚，冥王與冥后終於允他帶妻返回——條件是路上絕不可回頭。就在即將重見天日的最後一刻，他忍不住回望，妻子瞬間退回幽冥。此後他拒絕一切女子，最終被色雷斯的狂女撕裂，頭顱與琴漂流入海仍在歌唱，繆斯將他的琴升為天琴座。他也是阿爾戈船的成員，以歌聲壓過了塞壬。"],
["eurydike","歐律狄刻","Εὐρυδίκη（Eurydike）","俄耳甫斯之妻",33.0,7.2,"樹之寧芙，俄耳甫斯的新婚妻子。婚宴後她在草地逃避養蜂人阿里斯泰俄斯的追逐時踩到毒蛇而死。她是西方藝術中「回頭一望即永訣」意象的核心，蒙特威爾第與格魯克的歌劇皆以此為題。"],
["pan","潘","Πάν（Pan）","牧神",32.6,8.4,"赫耳墨斯之子，山羊角、羊腿、滿面鬍鬚的牧神，居於阿爾卡狄亞的山林，司掌牧群、荒野與生殖。他追求寧芙緒任克斯，她逃至河邊化為蘆葦，他便取蘆葦編成排簫（緒任克斯笛）長吹寄情。他在正午時分驚擾旅人，使人無端陷入莫名的恐懼——「panic（恐慌）」一詞即源於此。堤豐之戰中他吹出的怪聲嚇退敵人，並教宙斯尋回被割的筋腱。傳說他是唯一被明言死去的希臘神。"],

/* ---- 底比斯王家的悲劇 ---- */
["labdakos","拉布達科斯","Λάβδακος（Labdakos）","底比斯之王",10.4,10.8,"波呂多洛斯之子，底比斯王。他與雅典交戰，並如祖父卡德摩斯一般反對狄俄倪索斯的祭儀，據說也因此被狂女撕裂而死，留下年幼的拉伊俄斯。家族的詛咒自他起愈演愈烈，索福克勒斯的三部曲即以「拉布達科斯家族」為名。"],
["laios","拉伊俄斯","Λάϊος（Laios）","伊底帕斯之父",10.4,12.0,"底比斯王。流亡期間他誘拐了收留他的珀羅普斯之子克律西波斯，遭受詛咒：他的兒子將弒父娶母。神諭警告後他將初生的嬰兒刺穿腳踝棄於荒山，孩子卻被牧人所救。多年後他在三岔路口與一名年輕旅人爭道，被對方失手打死——那正是他的兒子。"],
["iokaste","伊俄卡斯忒","Ἰοκάστη（Iokaste）","底比斯王后",11.8,12.0,"拉伊俄斯之妻，伊底帕斯之母，後又成為他的妻子並生下四個孩子。當瘟疫迫使伊底帕斯追查前王死因、真相層層揭開時，她比他更早明白一切，苦苦勸他停止追問未果，回宮自縊。"],
["oidipous","伊底帕斯","Οἰδίπους（Oidipous）","解謎者與弒父娶母者",10.4,13.2,"其名意為「腫脹的腳」，源於嬰兒時被刺穿腳踝。他被科林斯王收養，成年後聽聞「將弒父娶母」的神諭，為保護養父母而出走——恰恰因此走向命運。他在三岔路口殺死親生父親，又答出斯芬克斯的謎題解救底比斯，被擁立為王並娶了王后，即他的生母。多年後瘟疫降臨，他以王者之責追查真相，最終在鐵證面前得知一切，以伊俄卡斯忒的胸針刺瞎雙眼自我放逐。索福克勒斯《伊底帕斯王》被亞里斯多德譽為悲劇的典範，其「愈是追求真相愈是走向毀滅」的結構影響西方文學至深。",false,"key"],
["oidipous_children_note","伊底帕斯的子女","安提戈涅・伊斯墨涅・厄忒俄克勒斯・波呂涅刻斯","詛咒的最後一代",10.4,14.4,"兩個兒子厄忒俄克勒斯與波呂涅刻斯約定輪流執政卻背信，引發「七雄攻底比斯」，兄弟最終同歸於盡。新王克瑞翁下令不得埋葬叛國的波呂涅刻斯，安提戈涅以「神法高於人法」為由親手覆土安葬兄長，被活埋於石室而自縊——索福克勒斯《安提戈涅》由此成為西方最早也最著名的「良心對抗國家」之作。伊斯墨涅則選擇了順從。",true],

/* ---- 伊薩卡王室與奧德賽 ---- */
["laertes","拉厄耳忒斯","Λαέρτης（Laertes）","伊薩卡的老王",17.0,12.0,"奧德修斯之父，年輕時曾是阿爾戈船的成員。兒子出征後他退居鄉間果園，衣衫襤褸、日日耕作以排遣悲傷，形容枯槁。《奧德賽》最後，奧德修斯以父親當年親手指給他的果樹數目相認，老人重振精神，由雅典娜賜予一時的神力，與兒孫三代並肩對抗求婚者的族人。"],
["antikleia","安提克勒亞","Ἀντίκλεια（Antikleia）","奧德修斯之母",18.4,12.0,"奧德修斯之母，狡黠的西緒福斯之外孫女（一說奧德修斯的機智即源於此）。她因思念遠征不歸的兒子而憂憤致死。奧德修斯下冥界問卜時見到她的幽魂，這才知道母親已逝；他三次伸手擁抱，三次穿過如影似夢的空虛——那是《奧德賽》中最令人心碎的一幕。"],
["odysseus","奧德修斯","Ὀδυσσεύς（Odysseus）","伊薩卡之王・智謀無雙",17.0,13.2,"荷馬《奧德賽》的主角，以機智、忍耐與辯才著稱，雅典娜最鍾愛的凡人。他曾裝瘋以逃避出征，被識破後反成為希臘軍的智囊：設計木馬攻陷特洛伊。返鄉之路卻因刺瞎波塞冬之子波呂斐摩斯而拖延十年——歷經食蓮者之地、風袋、萊斯特呂戈涅斯巨人、喀耳刻的豬圈、下冥界問卜、塞壬的歌聲、斯庫拉與卡律布狄斯的窄海峽、宰食太陽神聖牛而全船覆沒，最後獨自漂至卡呂普索的島上滯留七年。歸鄉後他扮作乞丐潛入自己的宮殿，唯有老狗阿耳戈斯認出他，隨即死去；他以無人能拉開的硬弓射穿十二把斧環，射殺了一百多名求婚者，並以只有夫妻二人知曉的婚床祕密向妻子相認。",false,"key"],
["penelope","潘妮洛普","Πηνελόπη（Penelope）","忠貞的王后",18.4,13.2,"伊卡里俄斯之女，奧德修斯之妻，忠貞的代名詞。丈夫離家二十年間，宮中聚集一百多名求婚者日夜宴飲、耗盡家財。她宣稱須先為老公公拉厄耳忒斯織完壽衣才能改嫁，遂白日織、夜裡拆，拖延了三年才被侍女出賣。最後她設下「能拉開奧德修斯硬弓並射穿十二斧環者為夫」的比試——那是唯有真正的丈夫才能通過的關卡。即使求婚者盡誅，她仍以婚床是否可移動來試探，確認無誤才相認。"],
["telemachos","忒勒馬科斯","Τηλέμαχος（Telemachos）","伊薩卡的王子",17.0,14.4,"奧德修斯與潘妮洛普之子，父親出征時他還在襁褓中。《奧德賽》前四卷專寫他在雅典娜（化為門托耳）的鼓勵下出海尋父，先後拜訪涅斯托耳與墨涅拉俄斯，從少年成長為足以擔當的男子——這段「忒勒馬科斯之旅」是西方文學最早的成長敘事。歸來後他與父親並肩射殺求婚者。「Mentor（良師）」一詞即出自那位指引他的門托耳。"],
["telegonos","忒勒戈諾斯","Τηλέγονος（Telegonos）","奧德修斯與喀耳刻之子",18.4,14.4,"奧德修斯與女巫喀耳刻之子，其名意為「生於遠方」。成年後他出海尋父，誤登伊薩卡並劫掠牛群，與前來抵禦的老人交戰，以魟魚骨製的矛將對方刺死——那正是他從未謀面的父親，應驗了忒瑞西阿斯「死亡將自海上到來」的預言。他後來迎娶了潘妮洛普，而忒勒馬科斯則娶了喀耳刻，兩家的血脈就此交錯。"],
["alkinoos","阿爾喀諾俄斯","Ἀλκίνοος（Alkinoos）","費埃克斯人之王",21.2,12.0,"斯克里亞島上費埃克斯人的國王，宮殿以青銅為牆、黃金為門，果園四季不凋。他熱情款待了漂流至此、衣不蔽體的奧德修斯，在宴席上聽他自述十年漂泊——《奧德賽》中段的所有冒險，都是奧德修斯在他的廳堂裡親口講述的故事。最後他以不需舵手的神奇快船送客返鄉，卻因此觸怒波塞冬，該船在歸途中被變成礁石。"],
["nausikaa","瑙西卡","Ναυσικάα（Nausikaa）","費埃克斯的公主",21.2,13.2,"阿爾喀諾俄斯之女。雅典娜託夢使她前往河口浣衣，她因此發現了赤身昏迷在灌木叢中的奧德修斯。婢女們驚逃四散，唯有她從容立定，給他衣物與食物，並教他如何進宮向母后求援。她的體貼、聰慧與那份不曾說出口的傾慕，使她成為荷馬筆下最動人的女性形象之一。"],

/* ---- 補完：潘朵拉與泰坦層的遺漏 ---- */
["pandora","潘朵拉","Πανδώρα（Pandora）","諸神所造的第一個女人",26.0,4.8,"人類盜得火種後，宙斯命赫淮斯托斯以泥土摻水造出第一個女人作為報復：雅典娜授以紡織與衣飾，阿佛洛狄忒賦予嫵媚，赫耳墨斯放進狡黠的心思與虛偽的言辭——其名意為「諸神所贈的一切」。她被送給厄庇墨透斯，隨身帶著一只封住的甕（後世誤傳為盒子）。她揭開甕蓋，疾病、勞苦、爭鬥與衰老一擁而出散入人間，她慌忙蓋回時只剩「希望」留在甕底。這一則究竟是說人類還保有希望，抑或連希望也被扣住而不得，兩千年來爭論不休。"],
["dione","狄俄涅","Διώνη（Dione）","宙斯的伴侶・阿佛洛狄忒之母",18.6,6.0,"其名即「宙斯」的陰性形。荷馬《伊利亞特》中，阿佛洛狄忒在戰場上被狄俄墨得斯刺傷手腕，哭著奔回奧林帕斯，正是狄俄涅為她拭去神血並溫言安慰——那一幕表明荷馬所知的傳承裡，阿佛洛狄忒是宙斯與狄俄涅之女，而非赫西俄德所說的自海泡誕生。她在多多納的橡樹神諭所與宙斯並受祭祀，是希臘最古老的女神之一。"],
["hesperides_note","赫斯佩里得斯","Ἑσπερίδες（Hesperides）","西方樂園的金蘋果三姊妹",27.0,6.0,"守護世界極西處金蘋果樹的黃昏仙女，與百頭龍拉冬同守。那株結金蘋果的樹是蓋亞在赫拉出嫁時所贈的賀禮。赫拉克勒斯的第十一項偉業即前來取果——一說他請扛天的阿特拉斯代摘，一說他射殺拉冬親自摘下。她們的樂園也是珀耳修斯取得飛鞋與隱形盔的地方。",true],
["charon","卡戎","Χάρων（Charon）","冥河的擺渡人",44.0,4.8,"厄瑞玻斯與倪克斯之子，形容枯槁、雙目如火的老船夫，撐篙載亡魂渡過阿刻戎河進入冥界。渡資為一枚俄玻羅斯銅幣，故希臘人下葬時會在死者口中放一枚錢幣；付不起的亡魂只能在岸邊徘徊一百年。他只載已受葬禮的死者，活人一律拒渡——赫拉克勒斯是硬闖的，俄耳甫斯以琴聲說動了他，而他曾因擅自載赫拉克勒斯過河被罰戴鐐一年。"],

/* ---- 阿特柔斯家族的詛咒 ---- */
["tantalos","坦塔羅斯","Τάνταλος（Tantalos）","受永恆飢渴之罰的罪人",17.2,6.0,"呂狄亞之王，宙斯之子，本受諸神眷顧、獲邀同席共食神饌。他卻盜取神饌分贈凡人，又為試探諸神的全知，將自己的兒子珀羅普斯殺死烹煮獻上——眾神一眼識破，只有失神哀女的得墨忒耳誤食了一塊肩肉。宙斯將他罰入塔爾塔羅斯：他站在水中，一低頭水便退去；頭頂垂著果實，一伸手枝枒便揚起；頭上還懸著一塊隨時會落下的巨石。英文 tantalize（可望不可即地折磨）即源於他的名字。這是阿特柔斯家族世代血腥的起點。"],
["pelops","珀羅普斯","Πέλοψ（Pelops）","伯羅奔尼撒的名祖",16.2,7.2,"坦塔羅斯之子。被父親烹煮獻神後由諸神復活，缺失的肩胛由赫淮斯托斯以象牙補上。他為求娶比薩王的女兒希波達彌亞，必須在戰車競速中勝過王——先前的十三名求婚者皆已被殺。他買通御者密耳提洛斯抽去王的車軸插銷，王翻車而死；事後他又將密耳提洛斯推入海中滅口，臨死的詛咒自此纏上他的子孫。伯羅奔尼撒半島（意為「珀羅普斯之島」）以他為名，奧林匹亞競技會相傳也是為紀念他而設。"],
["thyestes","堤厄斯忒斯","Θυέστης（Thyestes）","與兄長爭位的弟弟",17.2,8.4,"珀羅普斯之子，阿特柔斯的兄弟。他誘姦兄嫂並竊走象徵王權的金羊，兄弟為王位反覆傾軋。阿特柔斯佯裝和解設宴，席上端出的竟是堤厄斯忒斯自己三個孩子的肉；他吃完後兄長才把孩子的頭顱與手足端上——太陽為此倒行。他依神諭與自己的女兒生下埃癸斯托斯，作為復仇的工具。"],
["aigisthos","埃癸斯托斯","Αἴγισθος（Aigisthos）","篡奪邁錫尼的情夫",18.8,10.8,"堤厄斯忒斯與親生女兒所生，生來便是為了復仇。阿伽門農率軍遠征特洛伊的十年間，他誘惑了留守的王后克呂泰涅斯特拉，並在阿伽門農凱旋當日與她合謀將其弒殺，據位七年。最終死在俄瑞斯忒斯的復仇之劍下。《奧德賽》開篇宙斯便以他為例，說明凡人的災禍多半是自作自受。"],
["niobe","尼俄柏","Νιόβη（Niobe）","因誇耀子女而喪盡子女的母親",3.4,13.2,"坦塔羅斯之女，底比斯王安菲翁之妻，育有七子七女。她在祭典上譏諷勒托「只生了兩個孩子，我有十四個」，勒托的一雙兒女聞言，阿波羅以箭射殺她所有的兒子、阿耳忒彌斯射殺所有的女兒。她抱著最小的女兒哀求也無用。她哭泣不止，終於化為西皮洛斯山上的一塊石頭，泉水至今仍自石中流出——那是她永不乾涸的眼淚。"],

/* ---- 珀耳修斯家系（銜接赫拉克勒斯） ---- */
["akrisios","阿克里西俄斯","Ἀκρίσιος（Akrisios）","阿爾戈斯之王",-2.6,7.2,"達那厄之父。神諭告訴他將死於外孫之手，他遂將女兒囚於地下銅室，仍擋不住化為黃金雨的宙斯。母子被他裝箱投海後僥倖獲救。多年後他為避外孫而遠走拉里薩，卻恰好在當地觀看競技，珀耳修斯擲出的鐵餅失手飛入觀眾席擊中他的腳——神諭以誰也料不到的方式應驗。"],
["andromeda","安德洛墨達","Ἀνδρομέδα（Andromeda）","被獻祭給海怪的公主",-5.0,9.6,"衣索比亞王刻甫斯與王后卡西俄佩亞之女。母親誇口自己比涅瑞伊得斯更美，激怒海仙女，波塞冬遂降下洪水與海怪刻托斯；神諭稱唯有獻出公主方能平息，她因此被剝去衣裳鎖在海邊礁石上。珀耳修斯自空中飛過，一見傾心，向國王求得婚約後斬殺海怪。婚宴上前未婚夫菲紐斯率眾來搶，珀耳修斯舉起美杜莎的首級將他們全數石化。她死後與丈夫、父母同被升上夜空，成為仙女座。"],
["kepheus","刻甫斯","Κηφεύς（Kepheus）","衣索比亞之王",-11.2,8.4,"安德洛墨達之父，性格軟弱，在神諭與臣民壓力下同意獻出女兒。死後化為仙王座。"],
["kassiopeia","卡西俄佩亞","Κασσιόπεια（Kassiopeia）","誇口美貌的王后",-9.8,8.4,"安德洛墨達之母，因誇稱自己（一說是女兒）比五十位涅瑞伊得斯更美而招來災禍。她被升為仙后座，卻因傲慢受罰，須被綁在椅上繞北極星旋轉，每年有半年是頭下腳上的姿勢。"],
["elektryon","厄勒克特律翁","Ἠλεκτρύων（Elektryon）","邁錫尼之王",-5.0,10.8,"珀耳修斯與安德洛墨達之子，阿爾克墨涅之父。他在與塔福斯人爭奪牛群的紛爭中失去諸子，出征前將王國託付給女婿安菲特律翁；後者歸還牛群時擲出的木棒被牛角彈回，誤將他擊斃。正因這條血脈，赫拉克勒斯其實是珀耳修斯的曾外孫。"],

/* ---- 赫拉克勒斯的家族 ---- */
["amphitryon","安菲特律翁","Ἀμφιτρύων（Amphitryon）","阿爾克墨涅之夫",-5.0,12.0,"底比斯的將領，阿爾克墨涅的丈夫與表兄。他誤殺岳父後流亡底比斯，妻子要求他先為亡兄復仇才肯圓房。他出征期間，宙斯化為他的模樣前來並令那一夜長達三倍；他當夜稍晚才真正歸來，妻子遂於同一夜懷了兩個孩子——宙斯之子赫拉克勒斯與凡人之子伊菲克勒斯。他坦然撫養這名神裔繼子，是希臘神話中少見的寬厚形象，其名後成為喜劇《安菲特律翁》的經典題材。"],
["iphikles","伊菲克勒斯","Ἰφικλῆς（Iphikles）","赫拉克勒斯的凡人孿生弟弟",-5.0,13.2,"安菲特律翁與阿爾克墨涅之子，赫拉克勒斯同母異父的孿生弟弟。赫拉遣雙蛇入嬰兒房時，他嚇得放聲大哭，襁褓中的兄長卻已一手扼住一條——這一幕當場證明了誰是神的兒子。他後來隨兄長征戰，其子伊俄拉俄斯成為兄長最忠實的助手。"],
["megara","墨伽拉","Μεγάρα（Megara）","赫拉克勒斯的第一任妻子",-3.6,13.2,"底比斯王克瑞翁之女。赫拉克勒斯擊退敵軍後獲賜為妻，育有數子。赫拉降下瘋狂，他在錯亂中將自己的孩子（一說連同她）當作敵人射殺；清醒後悲慟欲絕，前往德爾斐求贖罪之法，得到的答覆便是去為歐律斯透斯完成十二項偉業。歐里庇得斯《瘋狂的赫拉克勒斯》即演此劇。"],
["deianeira","得伊阿妮拉","Δηϊάνειρα（Deianeira）","赫拉克勒斯的第二任妻子",-2.2,13.2,"卡呂冬王女，赫拉克勒斯為娶她而與河神阿刻羅俄斯角力折斷其角。渡河時半人馬涅索斯背她過河卻意圖非禮，被赫拉克勒斯以九頭蛇毒箭射殺；臨死的涅索斯騙她收下自己的血，說那是能挽回丈夫愛情的靈藥。多年後她聽聞丈夫愛上俘虜伊俄勒，遂將浸過那血的衣袍送去——毒血一遇體溫便灼骨蝕肉，赫拉克勒斯痛不欲生。她得知真相後自盡。索福克勒斯《特拉基斯少女》寫的正是這個因愛而誤殺的故事。"],
["nessos","涅索斯","Νέσσος（Nessos）","以死亡復仇的半人馬",-0.8,13.2,"渡口的半人馬船夫。他背得伊阿妮拉過河時起了歹意，被赫拉克勒斯自對岸一箭射穿。他早知箭上淬有九頭蛇之毒，臨死時將自己的血偽稱為愛情靈藥交給少婦——這一計竟在數十年後奪走了希臘最強英雄的性命。"],
["eurystheus","歐律斯透斯","Εὐρυσθεύς（Eurystheus）","下令十二偉業的邁錫尼王",0.6,13.2,"珀耳修斯的孫子。赫拉克勒斯將出生時，宙斯誇口「今日我血脈所出者必為王」，赫拉聽見便延緩阿爾克墨涅的產程、催生了早產的歐律斯透斯，王位遂落入他手。他懦弱膽小，每見赫拉克勒斯帶回怪物便躲進一只青銅甕中，只敢隔著甕口下令。赫拉克勒斯死後他仍窮追其子女，終被赫拉克勒斯後裔所殺。"],
["iolaos","伊俄拉俄斯","Ἰόλαος（Iolaos）","赫拉克勒斯的御者與戰友",0.6,14.4,"伊菲克勒斯之子，赫拉克勒斯的姪兒與終生同伴。討伐九頭蛇時，他以火把灼燒斷頸使頭顱無法再生，成就了第二項偉業——歐律斯透斯卻以「有人相助」為由判定不算，任務因此由十項增為十二項。他也駕車隨行狩獵與遠征，在赫拉克勒斯死後保護其遺孤對抗歐律斯透斯。"],
["hyllos","許羅斯","Ὕλλος（Hyllos）","赫拉克勒斯之子",-6.4,14.4,"赫拉克勒斯與得伊阿妮拉之子。父親臨終前命他登上俄塔山堆起柴堆並點火，又要他娶父親的最後一位愛人伊俄勒。他率領兄弟姊妹逃避歐律斯透斯的追殺，是「赫拉克勒斯後裔」返回伯羅奔尼撒的第一代。"],
["herakleidai_note","赫拉克勒斯後裔","Ἡρακλεῖδαι（Herakleidai）","多利安人南下的神話依據",-6.4,15.6,"赫拉克勒斯的子孫。他們被歐律斯透斯逐出希臘，歷經三代流亡後率多利安人重返伯羅奔尼撒，瓜分了阿爾戈斯、麥西尼亞與拉科尼亞。斯巴達的兩支王室——阿基亞德家與歐律蓬提德家——皆自稱是赫拉克勒斯的直系後裔，這則神話因此成為多利安人統治伯羅奔尼撒的正當性來源。",true],

/* ---- 特洛伊王室 ---- */
["dardanos","達耳達諾斯","Δάρδανος（Dardanos）","特洛伊人的始祖",44.0,7.2,"宙斯與普勒阿得斯之厄勒克特拉之子。大洪水後他自薩摩色雷斯漂流至小亞細亞海岸，受當地王特烏克洛斯接納並娶其女，在伊達山麓建立達耳達尼亞——特洛伊人因此自稱「達耳達諾斯之民」，達達尼爾海峽亦以他為名。"],
["assarakos","阿薩拉科斯","Ἀσσάρακος（Assarakos）","特洛伊的旁支之祖",44.0,9.6,"特洛斯之子，伊羅斯的兄弟。他不繼承特洛伊王位而開出旁支，經卡皮斯、安喀塞斯傳至埃涅阿斯——羅馬人所奉的祖先正是出自這一支。"],
["tros","特洛斯","Τρώς（Tros）","特洛伊的名祖",44.0,8.4,"達耳達諾斯之孫，特洛伊（Troia）與特洛阿德地區皆以他為名。宙斯擄走他的幼子伽倪墨得斯後，遣赫耳墨斯送來一對神馬與一株黃金葡萄藤作為補償，並告知其子已得永生——他這才止住悲傷。"],
["ganymedes","伽倪墨得斯","Γανυμήδης（Ganymedes）","眾神的斟酒童子",45.4,9.6,"特洛斯之子，荷馬稱他是「凡人中最俊美者」。宙斯化為巨鷹（一說遣鷹）將他自伊達山攫上奧林帕斯，賜他永生不老，取代赫柏為諸神斟倒神酒。赫拉為此耿耿於懷，成為她厭惡特洛伊的原因之一。他被升為寶瓶座，木星最大的衛星也以他為名。"],
["kapys","卡皮斯","Κάπυς（Kapys）","安喀塞斯之父",45.4,10.8,"阿薩拉科斯之子，埃涅阿斯的祖父。羅馬人將卡普阿城的建立歸於他，藉此把自己的城市與特洛伊血脈相連。"],
["ilos","伊羅斯","Ἶλος（Ilos）","伊利昂城的建立者",42.6,9.6,"特洛斯之子。他在角力競技中獲勝，得賜一頭花斑母牛並受神諭指示「牛臥之處築城」，遂建立伊利昂（Ilion）——《伊利亞特》之名即由此而來。築城時他祈求宙斯賜下憑據，天降雅典娜的木像帕拉狄翁；只要該像仍在城中，特洛伊便不會陷落，因此奧德修斯與狄俄墨得斯後來潛入城中將它盜走。"],
["laomedon","拉俄墨冬","Λαομέδων（Laomedon）","背信的特洛伊王",42.6,10.8,"普里阿摩斯之父。阿波羅與波塞冬受罰為凡人服役一年，為他築起特洛伊的巨石城牆，他卻拒付工資並威脅割去二神的耳朵；波塞冬遂降下海怪，他不得不將女兒赫西俄涅獻祭。赫拉克勒斯以「神馬為酬」的條件斬殺海怪救出公主，他又一次賴帳——赫拉克勒斯憤而率軍攻破特洛伊，殺盡其諸子，只留下最年幼的普里阿摩斯。特洛伊的覆滅，早在他這一代就已種下。"],
["hesione","赫西俄涅","Ἡσιόνη（Hesione）","被獻祭的特洛伊公主",42.6,12.0,"拉俄墨冬之女，因父親背信而被鎖在海邊獻給海怪，由赫拉克勒斯所救。事後赫拉克勒斯攻破特洛伊，將她賜予戰友忒拉蒙為妻，生下後來的特洛伊戰爭勇將大埃阿斯。她曾以自己的頭紗贖回弟弟——那位少年因此得名「普里阿摩斯（被贖回者）」。特洛伊人始終視她為被擄走的姊妹，一說帕里斯劫走海倫，正是為了報復此事。"],
["anchises","安喀塞斯","Ἀγχίσης（Anchises）","阿佛洛狄忒所愛的牧人",45.4,12.0,"特洛伊王族旁支，在伊達山牧牛時因俊美驚人而使阿佛洛狄忒動情。女神化為凡間少女與他共寢，事後才顯露真身，並嚴令他不得洩漏此事，否則宙斯必以雷霆相擊。他酒後仍誇口說出，遂被雷火掃中而跛足（一說失明）。特洛伊城破之夜，埃涅阿斯背著這位年邁的父親逃出火海——那是西方藝術反覆描繪的孝道圖像。"],
["priamos","普里阿摩斯","Πρίαμος（Priamos）","特洛伊的末代國王",41.2,12.0,"拉俄墨冬之子，赫拉克勒斯屠城時唯一倖存的王子，由姊姊赫西俄涅以頭紗贖回，故名「被贖回者」。他在位期間特洛伊極盛，據說有五十子五十女。十年圍城中他眼看兒子一個個戰死。《伊利亞特》的終章是全詩最動人的一幕：這位老王隻身穿越敵營，跪在殺子仇人阿基里斯膝前，親吻那雙「殺死我許多兒子的手」，只求領回赫克托耳的遺體——阿基里斯想起自己的父親，兩人相對痛哭。城破當夜，他在宙斯祭壇前被涅俄普托勒摩斯所殺。",false,"key"],
["hekabe","赫卡柏","Ἑκάβη（Hekabe）","特洛伊的王后",39.8,12.0,"普里阿摩斯之妻。懷帕里斯時夢見自己產下一支燃燒的火把燒毀全城，占卜者勸她棄嬰，她仍讓孩子活了下來。城破後她眼看丈夫被殺於祭壇、女兒波呂克塞娜被獻祭於阿基里斯墓前、外孫阿斯堤阿那克斯被自城牆拋下，最後淪為奧德修斯的女奴。歐里庇得斯《特洛伊婦女》與《赫卡柏》寫盡她的悲慟；傳說她最終在復仇中化為一頭嗥叫的母狗。"],
["hektor","赫克托耳","Ἕκτωρ（Hektor）","特洛伊第一勇士",39.8,13.2,"普里阿摩斯的長子，特洛伊軍的統帥，《伊利亞特》中最完整、最令人同情的形象——他不像阿基里斯那樣為榮名而戰，而是為了城邦、妻子與襁褓中的兒子。出戰前與安德洛瑪刻在城門道別、伸手抱兒子卻嚇哭孩子而摘下頭盔的一段，是全詩最溫柔的插曲。他殺死披著阿基里斯鎧甲的帕特羅克洛斯，因而招來對方的復仇；在城牆下他一度轉身逃跑，繞城三周後被雅典娜化作其弟的模樣誘住，終於回身赴死。阿基里斯拖著他的屍體繞城，直到老王親自來贖。全詩以他的葬禮作結。",false,"key"],
["paris","帕里斯","Πάρις（Paris）","引發特洛伊戰爭的王子",41.2,13.2,"普里阿摩斯之子，又名亞歷山德羅斯。因母親的火把之夢而被棄於伊達山，由牧人養大。赫拉、雅典娜與阿佛洛狄忒為金蘋果爭執時，宙斯命他裁決：赫拉許他王權、雅典娜許他戰功、阿佛洛狄忒許他世上最美的女子——他選了愛神，於是渡海前往斯巴達帶走了墨涅拉俄斯的妻子海倫，十年戰爭由此爆發。他擅射而怯於近戰，曾與墨涅拉俄斯單挑幾乎喪命，靠阿佛洛狄忒以雲霧救走。最終他射中阿基里斯的足踝殺死對方，自己也死於菲羅克忒忒斯的毒箭。",false,"key"],
["kassandra","卡珊德拉","Κασσάνδρα（Kassandra）","無人相信的預言者",42.6,13.2,"普里阿摩斯之女。阿波羅愛慕她，賜她預言之能；她卻反悔拒絕，神無法收回禮物，便朝她口中吐了一口氣——從此她的預言字字應驗，卻永遠無人相信。她預告帕里斯將毀滅特洛伊、警告木馬中藏有敵兵、預言阿伽門農與自己的死期，換來的只是被當成瘋女關押。城破時她抱著雅典娜神像求庇仍遭小埃阿斯拖出施暴，後成為阿伽門農的女俘，隨他返回邁錫尼，在明知結局的情況下走進宮門，與他一同死於克呂泰涅斯特拉之手。"],
["deiphobos","得伊福玻斯","Δηΐφοβος（Deiphobos）","帕里斯的兄弟",44.0,13.2,"普里阿摩斯之子，特洛伊軍中僅次於赫克托耳的勇將。帕里斯死後他娶了海倫。城破之夜，海倫藏起他的武器並引墨涅拉俄斯入房，他被殘酷肢解。維吉爾《埃涅阿斯紀》中，埃涅阿斯在冥界見到他傷痕累累的亡魂。雅典娜也曾化為他的模樣，誘使赫克托耳停下腳步面對阿基里斯。"],
["polyxene","波呂克塞娜","Πολυξένη（Polyxene）","被獻祭於墓前的公主",45.4,13.2,"普里阿摩斯與赫卡柏的幼女。相傳阿基里斯在阿波羅神廟見到她而傾心，前往議婚時被埋伏的帕里斯射中足踝。特洛伊城破後，阿基里斯的亡魂要求以她為祭品，涅俄普托勒摩斯遂在父親墓前將她殺死。歐里庇得斯筆下她從容赴死、只求死得有尊嚴，連希臘士兵也為之動容。"],
["helenos","赫勒諾斯","Ἕλενος（Helenos）","特洛伊的預言者",46.8,13.2,"卡珊德拉的孿生兄弟，同樣具預言之能，卻是被人相信的那一個。帕里斯死後他與得伊福玻斯爭奪海倫失敗，憤而出走，被奧德修斯擒獲，說出了特洛伊陷落的三項條件（取來菲羅克忒忒斯的弓、請來涅俄普托勒摩斯、盜走帕拉狄翁神像）。戰後他成為涅俄普托勒摩斯的謀士，並娶了安德洛瑪刻，在伊庇魯斯重建了一座小特洛伊——埃涅阿斯途中曾造訪此地。"],
["kreusa","克瑞烏薩","Κρέουσα（Kreousa）","埃涅阿斯之妻",48.2,13.2,"普里阿摩斯之女，埃涅阿斯的妻子，阿斯卡尼俄斯之母。特洛伊陷落之夜，一家人逃離火海時她在混亂中失散；埃涅阿斯冒死折返尋找，只見到她的幽魂。她告訴他不必為自己悲傷，命運要他航向西方的臺伯河畔另建新邦——那正是《埃涅阿斯紀》的起點。"],
["andromache","安德洛瑪刻","Ἀνδρομάχη（Andromache）","赫克托耳之妻",38.4,13.2,"底比城王女，赫克托耳之妻。阿基里斯攻破她的故城，殺其父與七位兄弟，她因此對丈夫說：「赫克托耳，你於我既是父親，也是母親與兄弟，更是我年輕的丈夫。」城門道別是《伊利亞特》最著名的場景。城破後她的幼子被自城牆拋下，她本人淪為涅俄普托勒摩斯的女奴，後改嫁赫勒諾斯。她是希臘悲劇中「戰爭中的女性」最恆久的象徵。"],
["astyanax","阿斯堤阿那克斯","Ἀστυάναξ（Astyanax）","赫克托耳之子",39.1,14.4,"赫克托耳與安德洛瑪刻的獨子，本名斯卡曼德里俄斯，特洛伊人因敬愛其父而喚他「城邦之王」。父親出戰前伸手抱他，孩子卻被頭盔上的馬鬃嚇哭——那是《伊利亞特》裡少有的家常時刻。城破後希臘人恐他日後復仇，將這名嬰兒自特洛伊城牆上拋下。"],
["aineias","埃涅阿斯","Αἰνείας（Aineias）","羅馬人的祖先",49.6,13.2,"安喀塞斯與阿佛洛狄忒之子，特洛伊軍中僅次於赫克托耳的將領。《伊利亞特》中他數度險死，都被神明救走——波塞冬親口說明原因：命運注定他必須活下來延續達耳達諾斯的血脈。城破之夜他背著父親、牽著幼子逃出，率殘部渡海西行，途經迦太基與狄多女王的愛情悲劇，最終在義大利拉丁姆立足。維吉爾的《埃涅阿斯紀》以他為主角，把羅馬的建國追溯至特洛伊；凱撒家族更自稱是其子阿斯卡尼俄斯（尤路斯）的後裔。",false,"key"],

/* ---- 希臘聯軍的將領 ---- */
["aiakos","埃阿科斯","Αἰακός（Aiakos）","埃吉那之王・冥界判官",17.6,7.2,"宙斯與河神之女埃吉那所生。他的島上人煙因瘟疫盡絕，他向父親祈求，宙斯將一群螞蟻化為人民——那便是「密耳彌多涅斯（螞蟻之民）」，日後阿基里斯所率的精銳。他以虔敬公正聞名，全希臘大旱時唯有他的祈禱得到回應。死後與彌諾斯、拉達曼提斯同任冥界三判官，並執掌冥府的鑰匙。他是珀琉斯與忒拉蒙之父，因此也是阿基里斯與大埃阿斯的祖父。"],
["telamon","忒拉蒙","Τελαμών（Telamon）","薩拉米斯之王",18.6,8.4,"埃阿科斯之子，珀琉斯之兄。兩人合謀殺害同父異母的弟弟後被逐出埃吉那。他隨赫拉克勒斯遠征特洛伊，第一個攻上拉俄墨冬的城牆，獲賜公主赫西俄涅為妻。他也參加了阿爾戈船遠征與卡呂冬野豬狩獵。兩個兒子——大埃阿斯與透克洛斯——皆在特洛伊戰爭中揚名。"],
["aias","大埃阿斯","Αἴας（Aias）","僅次於阿基里斯的勇士",20.2,10.8,"忒拉蒙之子，希臘軍中身材最魁梧、持七層牛皮巨盾的戰士，公認「除阿基里斯外最強者」。他從不藉助神助作戰，與赫克托耳單挑竟日不分勝負，兩人互贈禮物而別。他曾隻身守住希臘船隊不被焚毀，也在阿基里斯陣亡後背回其遺體。然而阿基里斯的鎧甲被判給了辯才無礙的奧德修斯，他自覺受辱，夜裡欲屠殺希臘諸將，被雅典娜降下瘋狂而錯殺羊群；清醒後羞憤難當，以赫克托耳所贈的劍自刎。索福克勒斯《埃阿斯》即演此劇——那是英雄倫理敗給城邦政治的悲歌。"],
["neoptolemos","涅俄普托勒摩斯","Νεοπτόλεμος（Neoptolemos）","阿基里斯之子",15.6,12.0,"阿基里斯與斯庫羅斯王女所生，又名皮洛斯。父親戰死後，神諭稱非他到場特洛伊不會陷落，奧德修斯遂前往迎他出征。他是木馬中的一員，城破之夜表現得極其殘暴：在宙斯祭壇前殺死老王普里阿摩斯、將赫克托耳的幼子自城牆拋下、在父親墓前獻祭波呂克塞娜。他分得安德洛瑪刻為妻，又娶赫耳彌俄涅，最終在德爾斐與俄瑞斯忒斯結怨而被殺。"],
["patroklos","帕特羅克洛斯","Πάτροκλος（Patroklos）","阿基里斯的摯友",25.4,12.0,"少年時誤殺同伴而流亡，被珀琉斯收留，與阿基里斯一同由喀戎教養，此後形影不離。阿基里斯拒戰期間，希臘軍瀕臨崩潰，他含淚請求穿上摯友的鎧甲出陣以振士氣。他一路擊退特洛伊軍直逼城下，卻被阿波羅自背後擊落頭盔，隨即為赫克托耳所殺。他的死是《伊利亞特》的樞紐——阿基里斯的悲慟與暴怒由此爆發，全詩從「阿基里斯的憤怒」轉為「阿基里斯的哀傷」。臨終前他預言了赫克托耳的死期，阿基里斯亦囑咐將兩人的骨灰合葬於同一只金甕。"],
["briseis","布里塞伊斯","Βρισηΐς（Briseis）","阿基里斯的女俘",26.8,12.0,"呂耳涅索斯的王后，城破時全家為阿基里斯所殺，自己成為他的戰利品。阿伽門農被迫歸還祭司之女後，強行奪走她以維持顏面——《伊利亞特》開篇的「阿基里斯的憤怒」正由此而起，希臘軍幾乎因此覆滅。她在詩中話語極少，卻在為帕特羅克洛斯的遺體慟哭時吐露心聲：是他曾安慰她，並允諾讓她成為阿基里斯的正妻。"],
["diomedes","狄俄墨得斯","Διομήδης（Diomedes）","阿爾戈斯之王",14.6,15.6,"「七雄攻底比斯」中提丟斯之子，希臘軍最年輕也最勇猛的統帥之一。《伊利亞特》第五卷全篇寫他的「狄俄墨得斯之勇」：雅典娜為他拭去眼上的迷霧使他能辨神明，他先刺傷阿佛洛狄忒的手腕，再以長矛捅穿戰神阿瑞斯的腹側，逼得戰神哀嚎著逃回奧林帕斯——他是唯一在戰場上刺傷兩位神祇的凡人。他與奧德修斯搭檔夜襲敵營、盜取帕拉狄翁神像，兩人也是木馬中的成員。"],
["nestor","涅斯托耳","Νέστωρ（Nestor）","皮洛斯的老王",29.6,12.0,"波塞冬之孫、涅琉斯之子，出征特洛伊時已歷三世人生，是希臘軍中最年長、最受敬重的長者。他不再親身衝鋒，卻以雄辯與經驗調停阿伽門農與阿基里斯的爭執，並在關鍵時刻建議帕特羅克洛斯代兄出陣——那個建議改變了整場戰爭。他是少數順利返鄉的統帥，《奧德賽》中忒勒馬科斯首先造訪的正是他。"],

/* ---- 阿爾戈船遠征的前傳 ---- */
["pelias","珀利阿斯","Πελίας（Pelias）","篡位的伊俄爾科斯王",20.0,8.4,"波塞冬與提洛之子，埃宋同母異父的兄弟。他篡奪伊俄爾科斯的王位，並得到「當心只穿一隻鞋的人」的神諭。伊阿宋渡河背老嫗而失一履，正是這副模樣出現在他面前；他不敢公然殺害姪兒，遂命其取回科爾喀斯的金羊毛，料定此行有去無回。伊阿宋歸來後，美狄亞誘騙他的女兒們相信「把父親剁碎入鍋便能返老還童」，他就這樣死在親生女兒手裡。"],
["athamas","阿塔瑪斯","Ἀθάμας（Athamas）","玻俄提亞之王",2.0,9.6,"娶雲之女神涅斐勒，生佛里克索斯與赫勒；再娶卡德摩斯之女伊諾，她圖謀除去前妻的孩子，遂焙壞種子造成饑荒，又買通使者謊報神諭要求獻祭王子。涅斐勒送來金毛公羊救走一雙兒女。他後來因撫養狄俄倪索斯而遭赫拉降下瘋狂，將自己的兒子當作雄鹿射殺，伊諾則抱著幼子投海化為海之女神。"],
["phrixos","佛里克索斯","Φρίξος（Phrixos）","乘金羊逃亡的王子",2.0,10.8,"阿塔瑪斯與涅斐勒之子。將被獻祭時，母親遣來一頭生有金毛、能飛行的公羊載他與妹妹赫勒逃走。他平安抵達黑海東岸的科爾喀斯，受埃厄忒斯王收留並娶其女，將金羊獻祭給宙斯，把金羊毛掛在阿瑞斯聖林的橡樹上由不眠之龍看守——那便是阿爾戈船遠征的目標。"],
["helle","赫勒","Ἕλλη（Helle）","墜海的公主",3.4,10.8,"佛里克索斯的妹妹。金羊飛越歐亞之間的海峽時，她一時暈眩鬆手墜入海中溺斃。那道海峽自此稱為「赫勒斯滂（赫勒之海）」，即今日的達達尼爾海峽。"],
["atalante","阿塔蘭忒","Ἀταλάντη（Atalante）","跑得最快的女獵人",6.2,10.8,"出生時因不是男孩而被父親棄於山中，由母熊哺育、獵人養大，長成獻身阿耳忒彌斯的女獵手。卡呂冬野豬狩獵中，她射出第一箭命中巨豬，墨勒阿革洛斯遂將豬皮判給她，引發族人爭執與一連串死亡。她宣稱只嫁給賽跑勝過她的人，敗者處死；希波墨涅斯求得阿佛洛狄忒的三顆金蘋果，途中逐一拋出誘她拾取而獲勝。婚後兩人因在神廟中失禮，雙雙被變成獅子。她也是阿爾戈船上唯一的女性。"],
["meleagros","墨勒阿革洛斯","Μελέαγρος（Meleagros）","卡呂冬野豬的獵手",7.6,10.8,"卡呂冬王之子。出生七日，命運三女神告訴其母阿爾泰亞：爐中那根柴薪燒盡之時，孩子便會死去——她立刻取出柴薪藏起。他長成後召集全希臘英雄圍獵阿耳忒彌斯降下的巨豬，卻因將豬皮讓給心儀的阿塔蘭忒而與舅父們爭執，怒而將他們殺死。母親悲憤之下把那根柴薪投入火中，他當場在遠處倒地而亡。"],
["argonautai_note","阿爾戈船的英雄們","Ἀργοναῦται（Argonautai）","五十位划槳的英雄",9.0,10.8,"由造船匠阿爾戈斯依雅典娜指示打造、船首鑲有能開口說話的多多納神橡的巨船。船上聚集了當世幾乎所有英雄：赫拉克勒斯、俄耳甫斯、卡斯托耳與波呂丟刻斯、忒拉蒙與珀琉斯、阿塔蘭忒、北風之子、預言者摩普索斯等。他們穿越會相互撞擊的symplegades撞岩（先放飛一隻鴿子試探）、為盲眼先知菲紐斯驅走鷹身女妖、在科爾喀斯奪得金羊毛，返航時繞行多瑙河與利比亞沙漠。這是希臘神話中最早的集體遠征，比特洛伊戰爭早一個世代。",true],

/* ---- 忒修斯與亞馬遜 ---- */
["hippolyte","希波呂忒","Ἱππολύτη（Hippolyte）","亞馬遜女王",24.4,9.6,"亞馬遜族的女王，佩有戰神阿瑞斯所賜的腰帶。赫拉克勒斯的第九項偉業即為取得該腰帶——她本已答應相贈，赫拉化為亞馬遜人散布「他要擄走女王」的謠言，衝突遂起，她死於混戰之中。另一系傳承中，她（或其妹安提俄珀）被忒修斯擄至雅典成為其妻，生下希波呂托斯；亞馬遜大軍為此攻入雅典，她在阻止雙方廝殺時中箭而死。"],
["peirithoos","庇里托俄斯","Πειρίθους（Peirithoos）","拉庇泰之王・忒修斯的摯友",25.8,10.8,"為試探忒修斯的名聲而偷他的牛群，兩人對峙時卻彼此傾倒，當場結為生死之交。他的婚宴上半人馬酒醉欲擄新娘，引發「拉庇泰與半人馬之戰」。兩人晚年立誓各娶一位宙斯之女：先擄走年幼的海倫給忒修斯，再一同下冥界為他搶奪珀耳塞福涅。哈得斯佯裝款待，請兩人入座——那是會使人忘卻一切、長在椅上的忘憂之椅。赫拉克勒斯下冥界時硬扯下忒修斯，卻拉不動他；他就此永遠留在了冥界。"],
["amazones_note","亞馬遜族","Ἀμαζόνες（Amazones）","女戰士的部族",25.8,9.6,"戰神阿瑞斯與寧芙哈耳摩尼亞的後裔，居於黑海沿岸的女戰士部族，善騎射，只在特定時節與鄰族生子並只留下女嬰。她們與希臘英雄三度交鋒：赫拉克勒斯奪腰帶、忒修斯引發的雅典之戰、以及女王彭忒西勒亞率軍馳援特洛伊——她被阿基里斯一矛刺死，而他在揭開頭盔的那一刻愛上了已死的她。帕德嫩神廟與許多神廟的浮雕都刻有「亞馬遜之戰」。",true],

/* ---- 變形與愛情傳說 ---- */
["psyche","普緒克","Ψυχή（Psyche）","靈魂女神",0.6,12.0,"凡間公主，美貌招來眾人朝拜，阿佛洛狄忒妒而命厄洛斯令她愛上最卑賤者；厄洛斯卻誤傷自己而愛上她。她被送入隱形宮殿，每夜與看不見面貌的丈夫相會。姊姊們挑唆她持燈窺看，一滴燈油驚醒了神，愛神離去。她苦尋不得，向阿佛洛狄忒求助，被派去分揀穀物、取金羊毛、汲冥河之水、向珀耳塞福涅討取美貌——最後一項她違禁開盒而陷入死眠，由厄洛斯喚醒。宙斯終於許婚，賜她神饌成為靈魂女神，兩人生下女兒「歡愉（Voluptas）」。其名 psyche 在希臘文中兼指「靈魂」與「蝴蝶」。"],
["adonis","阿多尼斯","Ἄδωνις（Adonis）","為愛神所愛的美少年",2.0,12.0,"由密耳拉化成的沒藥樹中誕生的絕世美少年。阿佛洛狄忒一見鍾情，將嬰兒藏入木箱託珀耳塞福涅保管，冥后開箱後也不肯歸還；宙斯裁定他一年三分之一歸冥后、三分之一歸愛神、三分之一自由支配。他不聽勸阻執意狩獵，被一頭野豬（一說是妒忌的阿瑞斯所化）撞死在阿佛洛狄忒懷中，她的淚與他的血落地生出銀蓮花。其死而復生的節律是東地中海植物神信仰的典型，希臘各地的「阿多尼亞」祭由婦女以屋頂速生速枯的盆栽紀念他。"],
["narkissos","那耳喀索斯","Νάρκισσος（Narkissos）","愛上自己倒影的少年",3.4,12.0,"河神刻菲索斯與水仙女之子。先知忒瑞西阿斯預言他「只要不認識自己就能長壽」。他容貌絕美卻冷酷拒絕所有愛慕者，被拒者向涅墨西斯祈求「願他也嘗到愛而不得的滋味」。他俯身飲泉，愛上水中的倒影，伸手則影散、靜候則影回，終日不食不寐，在泉邊憔悴而死，原地長出一株水仙。心理學的「自戀（narcissism）」即由此得名。"],
["echo","厄科","Ἠχώ（Echo）","只能重複他人話語的山林寧芙",4.8,12.0,"山林寧芙，善言辭。她曾以喋喋不休的閒談纏住赫拉，好讓宙斯與其他寧芙脫身；赫拉識破後奪去她主動說話的能力，此後她只能重複別人話語的末尾。她愛上那耳喀索斯卻無法表白，只能重述他的字句，遭其厭棄後躲入山谷日漸消瘦，最後只剩下聲音——那便是回聲。"],
["daphne","達佛涅","Δάφνη（Daphne）","化為月桂的寧芙",6.2,12.0,"河神珀紐斯之女，獻身阿耳忒彌斯的山林寧芙。阿波羅嘲笑厄洛斯的弓小，厄洛斯遂以金箭射阿波羅、鉛箭射達佛涅：一個狂戀，一個厭憎。阿波羅一路追逐，她在力竭之際向父親呼救，四肢瞬間生根結皮，化為月桂樹。阿波羅抱著樹幹立誓：既不能為妻，便永為我的聖樹——月桂冠自此成為詩人與勝利者的桂冠。"],
["hyakinthos","許阿鏗托斯","Ὑάκινθος（Hyakinthos）","阿波羅所愛的斯巴達少年",7.6,12.0,"斯巴達王子，阿波羅與西風之神仄費洛斯同時愛慕他，他選擇了阿波羅。兩人擲鐵餅為戲時，妒火中燒的西風吹偏了鐵餅，正中少年額頭。阿波羅遍試醫術也救不回，遂自其血中生出一朵花，花瓣上帶著哀嘆的紋路。斯巴達每年舉行為期三日的「許阿鏗提亞」祭，先哀悼、後歡慶，是該城最重要的節慶之一。"],
["arachne","阿剌克涅","Ἀράχνη（Arachne）","化為蜘蛛的織女",9.0,12.0,"呂底亞的染匠之女，紡織技藝驚人，卻誇口勝過雅典娜且不承認受神啟發。女神先化為老嫗勸她收斂，見她不從便顯出真身應戰。雅典娜織出諸神懲罰狂妄凡人的圖景，阿剌克涅則織出眾神誘拐凡間女子的醜聞——技藝挑不出瑕疵，題材卻大不敬。雅典娜撕毀她的織品並以梭擊其額；她羞憤自縊，女神以草汁灑之使她化為蜘蛛，永遠懸在絲上紡織。蛛形綱（Arachnida）即以她為名。"],
["kallisto","卡利斯托","Καλλιστώ（Kallisto）","化為大熊的隨侍",4.8,13.2,"阿耳忒彌斯的隨侍寧芙，發誓守貞。宙斯化為阿耳忒彌斯的模樣接近她，事後她懷孕的身體在沐浴時被眾人發現，遭女神逐出。赫拉將她變成一頭母熊，多年後她的兒子阿耳卡斯狩獵時幾乎射殺這頭認出自己的母熊；宙斯及時將母子一同升上天空，成為大熊座與小熊座。赫拉猶不甘心，請忒堤斯不許他們沉入海面洗浴——這正是北斗七星終年不落的緣由。"],
["arkas","阿耳卡斯","Ἀρκάς（Arkas）","阿卡狄亞人的祖先",6.2,13.2,"宙斯與卡利斯托之子，由邁亞撫養長大。他教會阿卡狄亞人耕種、烘焙與紡織，該地區以他為名。他險些射殺化為母熊的生母，被宙斯升為小熊座（一說牧夫座）。"],
["orion","俄里翁","Ὠρίων（Orion）","巨人獵手",7.6,13.2,"波塞冬之子，能在海面上行走的巨人獵手，容貌俊美而力大無窮。他被希俄斯王灌醉刺瞎雙眼，向東而行讓初升的陽光治癒了視力。他與阿耳忒彌斯一同狩獵並相知相惜，卻誇口要獵盡世上所有野獸；蓋亞遣一隻巨蠍將他螫死（一說阿波羅設計使姊姊誤射了他）。他被升為獵戶座，腰帶三星最為醒目；天蠍座升起時獵戶座便沉入地平線，兩者永不同時出現於夜空。"],
["endymion","恩底彌翁","Ἐνδυμίων（Endymion）","永眠的牧羊少年",9.0,13.2,"卡里亞的牧羊人（一說厄利斯王）。月之女神塞勒涅每夜駕車經過拉特摩斯山，見他睡在洞中而傾心。她向宙斯祈求使他永保青春——代價是永恆的沉睡。她此後夜夜降臨探望，據說為他生了五十個女兒，恰對應希臘曆兩屆奧林匹亞之間的五十個朔望月。濟慈的長詩《恩底彌翁》開篇即是「美的事物是永恆的喜悅」。"],
["zagreus","扎格柔斯","Ζαγρεύς（Zagreus）","俄耳甫斯教的初代狄俄倪索斯",3.4,14.4,"宙斯化為蛇與珀耳塞福涅所生，被立為繼承宇宙王權的孩子。赫拉唆使泰坦以玩具與鏡子引誘他，趁其顧盼鏡中倒影時將他撕裂煮食；雅典娜搶救出仍在跳動的心臟，宙斯以雷霆焚盡泰坦，並讓塞墨勒吞下那顆心，狄俄倪索斯因此二度誕生。人類即由泰坦的灰燼所造——故兼有泰坦的罪性與扎格柔斯的神性。這則神話是俄耳甫斯教靈魂論與淨化儀式的核心，也是希臘思想中「靈魂受困於肉體」觀念的源頭。"],
["satyroi_note","薩堤爾與西勒諾斯","Σάτυροι・Σειληνός","酒神的隨從",4.8,14.4,"馬耳馬尾（後世作羊腿羊角）的山林精靈，好酒、好舞、好色，隨狂女一同組成狄俄倪索斯的行列。年長的西勒諾斯是酒神的養父與老師，永遠醉醺醺地騎在驢背上，卻能在被捕時吐出深奧的智慧——彌達斯王曾款待他，因而獲賜「點物成金」的願望，險些餓死。以薩堤爾為歌隊的「薩堤爾劇」是雅典悲劇競賽中壓軸的滑稽短劇。",true],

/* ---- 冥界的受罰者 ---- */
["sisyphos","西緒福斯","Σίσυφος（Sisyphos）","推石上山的罪人",27.2,10.8,"科林斯的建城者，以狡黠聞名，一說是奧德修斯真正的父親。他向河神告發宙斯的私情以換取城中的泉水，宙斯遣死神塔納托斯來拿他，他反將死神鎖住——世間從此無人能死，直到阿瑞斯把死神放出。臨終前他囑咐妻子不要為他舉行葬禮，再向冥后抱怨自己未受安葬，請准三日返陽處理，一回人間便賴著不走。諸神最終判他在塔爾塔羅斯永遠將一塊巨石推上陡坡，每近山頂石便滾落，周而復始。卡繆《薛西弗斯的神話》以他為荒謬的象徵：「我們必須想像西緒福斯是幸福的。」"],
["danaides_note","達那伊得斯","Δαναΐδες（Danaides）","以破甕汲水的五十姊妹",4.8,10.8,"達那俄斯的五十個女兒。父親與兄弟埃古普托斯不和，被迫將女兒許配給對方的五十個兒子，遂密令她們於新婚之夜殺夫。四十九人照辦，只有許珀爾涅斯特拉因丈夫尊重她的意願而放他一命。她們在冥界受罰，須永遠以底部有孔的甕汲水注入無底的池，水漏盡了再從頭來過。這是希臘神話中最古老的「徒勞」意象，埃斯庫羅斯《乞援人》即以她們為歌隊。",true],

/* ---- 海之神族的補充 ---- */
["proteus","普羅透斯","Πρωτεύς（Proteus）","能變形的海中老人",31.6,6.0,"牧放海豹群的海中老人，通曉過去未來卻絕不肯輕易吐露，一旦被追問便化為獅、蛇、豹、野豬、流水與樹木掙脫。墨涅拉俄斯困於埃及無風可行，依其女兒之計披上海豹皮埋伏，死抱住他不放，終於問出回鄉之路與希臘諸將的下場。英文 protean（變化多端的）即源於其名。"],
["galateia","加拉忒亞","Γαλάτεια（Galateia）","乳白的海仙女",32.6,6.0,"涅柔斯與多里斯之女，其名意為「乳白」。獨眼巨人波呂斐摩斯瘋狂愛慕她，坐在海岬上以蘆笛吹奏笨拙的情歌；她卻愛著牧童阿喀斯。巨人撞見兩人幽會，怒擲巨石砸死阿喀斯，她將愛人的血化為西西里島的一條清泉。這則故事是田園詩傳統中最著名的題材之一。"],

/* ---- 雅典王系（忒修斯之父埃勾斯的祖先） ---- */
["kekrops","刻克洛普斯","Κέκροψ（Kekrops）","雅典的第一位國王",52.0,3.6,"自大地生出的雅典首王，上半身為人、下半身為蛇，象徵「土生土長」的雅典人。他教民眾書寫、埋葬死者與一夫一妻的婚制，並廢除活人獻祭。波塞冬與雅典娜爭奪城邦守護權時，正是由他裁定：海神以三叉戟擊出鹹泉，女神則種出橄欖樹，他判定橄欖樹更有益於人民——雅典因此得名。"],
["erichthonios","厄里克托尼俄斯","Ἐριχθόνιος（Erichthonios）","蛇足的雅典王",52.0,4.8,"赫淮斯托斯欲侵犯雅典娜，女神掙脫時他的精液落在她腿上，她以羊毛拭去拋於地面，大地遂孕育出這個蛇足的孩子——雅典人因此仍可自稱「大地所生」而不損女神的貞潔。雅典娜將嬰兒藏入一只箱中交給刻克洛普斯的三個女兒，嚴禁開啟；她們忍不住偷看，見到盤繞的蛇而發狂墜下衛城。他長成後成為雅典王，據說發明了四馬戰車，被升為御夫座。"],
["pandion","潘狄翁","Πανδίων（Pandion）","雅典之王・普洛克涅之父",52.0,6.0,"厄里克托尼俄斯之孫，雅典王。他將女兒普洛克涅嫁與色雷斯王忒柔斯以酬謝軍援，卻因此引來家族最慘烈的悲劇。他在得知兩個女兒的遭遇後悲慟而死。"],
["erechtheus_note","厄瑞克透斯以下的雅典諸王","Ἐρεχθεύς・Κέκροψ Β΄・Πανδίων Β΄","埃勾斯之前的三代",52.0,7.2,"厄瑞克透斯（雅典衛城厄瑞克透斯神廟的由來，為救城邦而獻祭親女，最後被波塞冬以三叉戟劈入地下）、刻克洛普斯二世與潘狄翁二世。潘狄翁二世流亡墨伽拉，其子埃勾斯後返回雅典奪回王位——忒修斯的血脈即由此接續而下。",true],
["prokne","普洛克涅","Πρόκνη（Prokne）","化為燕子的姊姊",53.4,7.2,"潘狄翁之女，嫁與色雷斯王忒柔斯。忒柔斯強暴了她的妹妹菲羅墨拉並割去妹妹的舌頭、將她囚禁，謊稱其已死。菲羅墨拉把真相織進一幅掛毯托人送出，姊妹重逢後合謀復仇：殺死普洛克涅的親生兒子伊提斯，烹煮後端給忒柔斯食用。忒柔斯提劍追殺時，諸神將三人變為鳥——普洛克涅化為燕子（一說夜鶯），永遠哀鳴。"],
["philomela","菲羅墨拉","Φιλομήλα（Philomela）","化為夜鶯的妹妹",54.8,7.2,"潘狄翁之女。被姊夫忒柔斯強暴並割舌後，她以織機把罪行織成圖樣傳出——「無法言說者仍能言說」，這一意象成為西方文學中受害者發聲的原型。復仇後她化為夜鶯（一說燕子），其歌聲自此被詩人視為悲傷之聲，艾略特《荒原》中亦援引此典。"],

/* ---- 希臘各族的始祖 ---- */
["hellen","赫楞","Ἕλλην（Hellen）","希臘人的始祖",31.0,12.0,"丟卡利翁與皮拉之子，大洪水後新人類的第一位王。希臘人自稱「赫楞人（Ἕλληνες, Hellenes）」即源於他——「希臘（Hellas）」一詞至今仍是希臘的正式國名。他的三個兒子分出希臘的主要族群，是古希臘人用以解釋自身方言與部族分野的譜系框架。",false,"key"],
["doros","多洛斯","Δῶρος（Doros）","多利安人之祖",31.0,13.2,"赫楞之子，多利安人（Dorians）的名祖。多利安人居於伯羅奔尼撒與克里特，斯巴達即其代表，建築上的多立克柱式亦由此得名。"],
["xouthos","克蘇托斯","Ξοῦθος（Xouthos）","伊翁與阿開俄斯之父",32.4,13.2,"赫楞之子，娶雅典王厄瑞克透斯之女克瑞烏薩。歐里庇得斯《伊翁》中，他求問德爾斐神諭得子，神卻讓他誤認阿波羅的私生子伊翁為己出——雅典人藉此把伊奧尼亞人的祖先歸給自己的血脈。"],
["aiolos_h","埃俄羅斯（赫楞之子）","Αἴολος（Aiolos）","伊奧利亞人之祖",33.8,13.2,"赫楞之子，伊奧利亞人（Aeolians）的名祖，居於忒薩利亞與小亞細亞西北。他與掌管風袋的埃俄羅斯、以及冥界的其他同名者常被混淆，實為三位不同人物。西緒福斯、阿塔瑪斯與薩耳珀冬皆出自其後。"],
["ion","伊翁","Ἴων（Ion）","伊奧尼亞人之祖",31.7,14.4,"阿波羅與雅典王女克瑞烏薩之子，被棄於德爾斐由女祭司養大，名義上則為克蘇托斯之子。伊奧尼亞人（Ionians）以他為祖，雅典及小亞細亞西岸諸城皆屬此支，愛奧尼亞海與愛奧尼柱式亦由此得名。他兼具雅典王室與赫楞的血脈，是希臘人把雅典置於族譜中心的關鍵一環。"],
["achaios","阿開俄斯","Ἀχαιός（Achaios）","阿開亞人之祖",33.1,14.4,"克蘇托斯之子，阿開亞人（Achaeans）的名祖。荷馬史詩中「阿開亞人」正是全體希臘聯軍的通稱，邁錫尼文明的統治階層亦屬此支。"],

/* ---- 底比斯的先知與七雄 ---- */
["teiresias","忒瑞西阿斯","Τειρεσίας（Teiresias）","盲眼的底比斯先知",10.4,15.6,"希臘神話中最負盛名的先知。他曾以杖擊打交媾的雙蛇而變成女人，七年後再擊一次才變回男子；因兼歷兩性，宙斯與赫拉爭論男女誰在情愛中歡愉更多時請他評斷，他答「女子」，赫拉惱羞而使他失明，宙斯無法收回懲罰，遂賜他預言之能與七倍的壽命。他貫穿整個底比斯傳說：告訴伊底帕斯「你正是你所追捕的兇手」、警告克瑞翁不可拒葬波呂涅刻斯、預言彭透斯的下場。死後在冥界仍保有神智，奧德修斯正是為求問他而下冥界。",false,"key"],
["kreon","克瑞翁","Κρέων（Kreon）","底比斯的攝政",13.2,12.0,"伊俄卡斯忒之兄。拉伊俄斯死後他攝政，以王位與王后為賞徵求能解斯芬克斯之謎者；伊底帕斯自我放逐後他再度掌權。《安提戈涅》中他下令不得埋葬叛國的波呂涅刻斯，安提戈涅違令安葬兄長，他將她活埋——先知忒瑞西阿斯警告他觸犯神法，他悔悟已遲，妻兒與安提戈涅皆已自盡。他是希臘悲劇中「國法與神法孰高」這一命題的化身。"],
["adrastos","阿德剌斯托斯","Ἄδραστος（Adrastos）","七雄的統帥",11.8,14.4,"阿爾戈斯之王。他依神諭將兩個女兒嫁與「一頭獅子與一頭野豬」——即披著獅皮的提丟斯與披著豬皮的波呂涅刻斯，並允諾助兩人奪回故國。他因此發動「七雄攻底比斯」，卻在先知安菲阿剌俄斯的反對下強行出兵。七位統帥中只有他一人生還，靠神馬阿里翁載他逃出。十年後他率陣亡者之子「埃庇戈諾伊」再攻底比斯，終於破城，卻在歸途中因喪子而悲慟至死。"],
["amphiaraos","安菲阿剌俄斯","Ἀμφιάραος（Amphiaraos）","預見自身死期的先知",13.2,14.4,"阿爾戈斯的先知兼戰士，曾參與阿爾戈船遠征與卡呂冬野豬狩獵。他預見七雄攻底比斯必敗、自己亦將喪命，遂藏匿不出；妻子厄里費勒受波呂涅刻斯以哈耳摩尼亞的詛咒項鍊賄賂，供出他的藏身處。出征前他囑咐兒子阿爾克邁翁必為他復仇。兵敗奔逃時，宙斯以雷霆劈開大地將他連人帶車吞入——他就此活著進入冥界，成為神諭之神，其神諭所香火綿延數百年。"],
["tydeus","提丟斯","Τυδεύς（Tydeus）","狄俄墨得斯之父",14.6,14.4,"卡呂冬王子，因誤殺親族流亡至阿爾戈斯，與同樣流亡的波呂涅刻斯爭執，被阿德剌斯托斯收為女婿。七雄之一，勇猛絕倫。雅典娜極為賞識他，帶著能使他不死的神藥趕來；他卻在重傷時劈開敵將墨拉尼波斯的頭顱吸食其腦，女神見狀厭惡地收回神藥，任其死去——他的殘暴斷送了自己的永生。其子狄俄墨得斯繼承了他的勇武，卻沒有他的獸性。"],

/* ---- 珀耳修斯與涅琉斯的中間世代 ---- */
["sthenelos","斯忒涅羅斯","Σθένελος（Sthenelos）","邁錫尼之王",-3.6,10.8,"珀耳修斯與安德洛墨達之子，厄勒克特律翁的兄弟。他放逐了誤殺岳父的安菲特律翁，奪取邁錫尼的王位，其子歐律斯透斯後來成為差遣赫拉克勒斯的君王。"],
["neleus","涅琉斯","Νηλεύς（Neleus）","皮洛斯之王",28.6,10.8,"波塞冬與提洛之女所生，珀利阿斯的孿生兄弟。兄弟倆爭奪伊俄爾科斯，他敗走並建立皮洛斯。他曾拒絕為赫拉克勒斯淨化殺人之罪，赫拉克勒斯遂攻破皮洛斯殺其諸子，只有在外的涅斯托耳倖免——那位日後在特洛伊城下最受敬重的老將。"],

/* ---- 厄俄斯的特洛伊愛人與其子 ---- */
["tithonos","提托諾斯","Τιθωνός（Tithonos）","永生卻不斷衰老的王子",44.0,12.0,"拉俄墨冬之子，普里阿摩斯的兄弟，俊美非凡。曙光女神厄俄斯將他擄往東方，並向宙斯求得他的永生——卻忘了同時求取永恆的青春。他日漸衰老、乾癟、萎縮，聲音變得細碎不絕，最終被關進一間內室，或說化為一隻不停鳴叫的蟬。「提托諾斯的悲劇」自此成為「求錯了願望」的經典寓言，丁尼生的同名詩篇廣為傳誦。"],
["memnon","門農","Μέμνων（Memnon）","衣索比亞的黑膚英雄",37.0,13.2,"厄俄斯與提托諾斯之子，衣索比亞之王。特洛伊末期他率大軍馳援，殺死涅斯托耳之子安提洛科斯，武力被認為足與阿基里斯匹敵；兩人決鬥時宙斯以天秤量兩人的命運，門農的一端下沉，遂死於阿基里斯之手。母親厄俄斯抱著他的遺體悲泣，宙斯感其哀慟而賜他不死；她的眼淚化為每日清晨的露水。埃及底比斯的巨大石像被希臘人誤認為他，「門農巨像」之名沿用至今。"],

/* ---- 赫拉克勒斯與底比斯的相關人物 ---- */
["iole","伊俄勒","Ἰόλη（Iole）","赫拉克勒斯最後的愛人",-7.8,13.2,"俄卡利亞王歐律托斯之女。赫拉克勒斯在射箭競技中勝出本應娶她，其父卻毀約；他多年後攻破該城將她擄回。得伊阿妮拉見丈夫帶回年輕的俘虜，心生惶恐，遂送上浸過涅索斯之血的衣袍——那件毒袍奪走了赫拉克勒斯的性命。他臨終前囑咐兒子許羅斯娶她，使她不致流落他人之手。"],
["myrrha","密耳拉","Μύρρα（Myrrha）","化為沒藥樹的公主",-0.8,10.8,"賽普勒斯王喀倪拉斯之女。因母親誇口女兒比阿佛洛狄忒更美，女神使她狂戀自己的父親；她在乳母協助下趁黑夜與父親同寢十二夜，事發後父親提劍追殺，她逃亡途中祈求諸神使她既不屬生者也不屬死者，遂化為一株沒藥樹。九個月後樹皮裂開，阿多尼斯自其中誕生；沒藥樹滲出的芳香樹脂，被視為她永不止息的眼淚。"],
["amphion","安菲翁","Ἀμφίων（Amphion）","以琴聲築城的底比斯王",2.0,13.2,"宙斯與安提俄珀之子，與孿生兄弟仄托斯一同被棄養。兄弟倆長成後為母報仇，處死了虐待她的狄耳刻，並著手為底比斯築起七門城牆——仄托斯以蠻力搬石，安菲翁則彈奏赫耳墨斯所贈的七弦琴，石塊竟自行隨樂聲滾動就位。他娶尼俄柏為妻，眼看七子七女被阿波羅與阿耳忒彌斯射殺殆盡，悲慟自盡（一說攻打阿波羅神廟而被射殺）。"],
["lykaon","呂卡翁","Λυκάων（Lykaon）","化為狼的暴虐之王",-2.2,10.8,"阿卡狄亞之王，卡利斯托之父。宙斯化為凡人前來試探人類是否真如傳聞般墮落，他起了殺心，並將一名人質（一說自己的兒子）殺害烹煮端上餐桌。宙斯震怒掀翻餐桌，以雷霆焚毀其宮殿，並將他變成一頭狼——他的嚎叫仍帶著人的餘音。這則故事是宙斯決意降下大洪水的直接原因，也是西方「狼人（lycanthropy）」一詞的字源。"],

/* ---- 神祇的其他子女與後世名篇 ---- */
["tyche","提喀","Τύχη（Tyche）","命運與機運女神",-2.6,6.0,"掌管城邦與個人際遇的女神，手持豐饒之角與船舵——一者象徵她所賜的富足，一者象徵她所左右的航向；有時蒙眼或立於滾動的球上，表示機運的盲目與不定。希臘化時代諸城多奉城邦提喀為守護神，頭戴城牆狀的冠冕。羅馬名福耳圖娜（Fortuna），中世紀「命運之輪」的意象即由她而來。"],
["hermaphroditos","赫爾瑪佛洛狄托斯","Ἑρμαφρόδιτος（Hermaphroditos）","兼具兩性的神",3.4,9.6,"赫耳墨斯與阿佛洛狄忒之子，其名即由雙親之名合成，俊美異常。水澤仙女薩爾瑪吉斯在卡里亞的泉中見到他而狂戀，趁他入水沐浴時纏抱不放，並祈求諸神「使我倆永不分離」——神明照字面應允，兩人的身體就此合而為一，成為兼具男女的存在。他祈求該泉此後也使入浴者失去陽剛，諸神亦允之。「hermaphrodite（雌雄同體）」一詞由此而來。"],
["triptolemos","特里普托勒摩斯","Τριπτόλεμος（Triptolemos）","傳授農耕的厄琉息斯王子",21.4,14.4,"厄琉息斯的王子。得墨忒耳尋女途中化為老嫗受其家款待，為報答而傳授他農耕之術，並賜他一輛由飛龍牽引的戰車，命他遍行大地教導人類播種與收穫。他也是厄琉息斯祕儀的創立者之一——那是古希臘世界最神聖、也最守口如瓶的宗教儀式，參與者相信自己死後將得到不同的待遇。"],
["midas","彌達斯","Μίδας（Midas）","點物成金的國王",6.2,14.4,"弗里吉亞之王。他款待了迷途的老酒師西勒諾斯，狄俄倪索斯遂許他一個願望，他求「凡我所觸皆化為黃金」。起初欣喜若狂，隨即發現食物與飲水一入口即成金屬，一說連愛女也被他碰成金像；他悔恨交加，酒神命他到帕克托洛斯河洗手，能力才轉移到河中——該河自此盛產砂金。他後來又在阿波羅與潘的音樂競賽中判潘獲勝，被阿波羅拉長雙耳變成驢耳；他以頭巾遮掩，唯有理髮師知情，那人憋不住便對地洞低語，洞旁長出的蘆葦隨風傳唱「彌達斯王有驢耳朵」。"],
["pygmalion","皮格馬利翁","Πυγμαλίων（Pygmalion）","愛上自己雕像的塞浦路斯王",7.6,14.4,"塞浦路斯的國王兼雕刻家，厭棄現實中的女子，遂以象牙雕出一尊完美的女性像，日日為她穿衣配飾、與她說話，終至無可自拔。阿佛洛狄忒祭典上他不敢直言，只求「願得一位像我的象牙少女那樣的妻子」；返家親吻雕像時，象牙竟在唇下轉暖變軟。女神使雕像化為真人，兩人成婚生女帕福斯。「皮格馬利翁效應」（期望造就現實）與蕭伯納的同名劇作、音樂劇《窈窕淑女》皆源於此。"],
["aristaios","阿里斯泰俄斯","Ἀρισταῖος（Aristaios）","養蜂與農牧之神",30.0,13.2,"阿波羅與寧芙庫瑞涅之子，由喀戎與時序女神撫養，將養蜂、製酪、橄欖榨油與牧羊之術傳給人類。他追逐新婚的歐律狄刻，使她奔逃時踩到毒蛇而死；山林寧芙為此降下瘟疫，殺死他所有的蜂群。他向母親求助，依海神普羅透斯的指點獻祭四公牛四母牛，九日後從腐屍中飛出成群的新蜂——維吉爾《農事詩》第四卷即以此收束，並在其中嵌入了俄耳甫斯與歐律狄刻的故事。"],

/* ---- 特洛伊戰爭的其餘人物 ---- */
["aias_lokris","小埃阿斯","Αἴας ὁ Λοκρός（Aias the Lesser）","洛克里斯的統帥",23.0,13.2,"俄琉斯之子，身材矮小卻是全軍跑得最快的人，善用長矛，性情粗暴傲慢。特洛伊城破之夜，他在雅典娜神廟中將抱著女神木像求庇的卡珊德拉拖出施暴——這樁褻瀆使雅典娜遷怒整支希臘艦隊。歸途中他的船被雷霆擊碎，他攀上礁石誇口「即使諸神不願，我也能生還」，波塞冬遂以三叉戟劈開岩石，讓他沉入海中。"],
["philoktetes","菲羅克忒忒斯","Φιλοκτήτης（Philoktetes）","持赫拉克勒斯之弓的射手",24.4,13.2,"赫拉克勒斯在俄塔山自焚時無人敢點火，唯有他（一說其父）依言舉火，因而獲贈那把淬有九頭蛇之毒的神弓。前往特洛伊途中他被毒蛇咬傷，傷口潰爛惡臭、慘叫不絕，希臘人遂將他遺棄在楞諾斯荒島上獨活十年。戰爭第十年神諭稱非有赫拉克勒斯之弓不能破城，奧德修斯只得回頭誆他前往；索福克勒斯《菲羅克忒忒斯》即寫這場關於欺瞞與良心的拉鋸。他最終痊癒並射殺了帕里斯。"],
["kalchas","卡爾卡斯","Κάλχας（Kalchas）","希臘軍的先知",25.8,13.2,"阿波羅所賜預言之能的鳥卜師，希臘聯軍最倚重的解卦者。是他指出艦隊困於奧利斯是因阿伽門農觸怒阿耳忒彌斯、必須獻祭伊菲革涅亞，也是他解出瘟疫源於阿伽門農扣留祭司之女——《伊利亞特》開篇的爭執由此而起。他曾預言戰爭將持續十年，並得知自己會在遇見更高明的先知時死去；戰後他在小亞細亞敗給了先知摩普索斯的無花果之問，當夜憂憤而終。"],
["palamedes","帕拉墨得斯","Παλαμήδης（Palamedes）","被構陷的智者",27.2,13.2,"歐波亞王子，傳說中字母、數字、度量衡、骰子與棋類的發明者。奧德修斯為逃避出征而佯裝發瘋，以驢牛同軛耕田並播撒鹽粒；帕拉墨得斯將其襁褓中的兒子忒勒馬科斯放在犁前，奧德修斯立刻收犁——謊言當場拆穿。奧德修斯懷恨在心，日後偽造一封特洛伊來信並在其帳中埋藏黃金，誣告他通敵，希臘人遂以亂石將他砸死。荷馬對此事隻字未提，後世詩人卻反覆重述，用以質疑奧德修斯的「智謀」。"],
["telephos","忒勒福斯","Τήλεφος（Telephos）","被阿基里斯所傷又所治的王",22.8,14.4,"赫拉克勒斯之子，密西亞之王。希臘艦隊初次出航誤入密西亞登陸，他率軍抵抗，被阿基里斯的長矛刺傷大腿；傷口久久不癒，神諭稱「傷你者方能癒你」。他扮成乞丐潛入希臘軍營，依奧德修斯之計挾持嬰兒俄瑞斯忒斯要脅，終使阿基里斯刮下矛上的銅鏽敷傷而痊癒，並以指出前往特洛伊的航路作為回報。「以傷者之矛療傷」的意象在中世紀傳說與現代精神分析中反覆出現。"],
["penthesileia","彭忒西勒亞","Πενθεσίλεια（Penthesileia）","亞馬遜女王",28.6,13.2,"阿瑞斯之女，亞馬遜女王。她因狩獵時誤殺姊妹希波呂忒而深陷罪咎，遂率十二名女戰士馳援特洛伊，希望戰死以求解脫。她在戰場上所向披靡，直到與阿基里斯正面相遇；阿基里斯一矛將她連人帶馬刺穿，摘下她的頭盔時卻在那張垂死的臉上看見驚人的美，當場為自己所做的事悲慟不已。士兵忒耳西忒斯譏笑他，被他一拳打死。"],
["aiolos_wind","埃俄羅斯（風之管理者）","Αἴολος（Aiolos）","風的看守者",35.2,13.2,"居於漂浮的埃俄利亞島，受宙斯託付看管眾風。他熱情款待奧德修斯一行整整一個月，臨別贈以一只牛皮袋，裡面封著所有不利的風，只留西風送船返鄉。伊薩卡的海岸已然在望，奧德修斯卻在此時沉沉睡去，船員疑心袋中藏著金銀而私自解開——狂風盡出，船隊被吹回原處。埃俄羅斯認定他是遭神明厭棄之人，斷然拒絕再次相助。"],
["eurykleia","歐律克勒亞","Εὐρύκλεια（Eurykleia）","認出奧德修斯的老乳母",19.8,14.4,"拉厄耳忒斯買來的女奴，忠心耿耿，是奧德修斯與忒勒馬科斯兩代人的乳母。奧德修斯扮成乞丐返家時，她奉命為這位「客人」洗腳，指尖觸到他少年時被野豬獠牙劃下的疤痕，登時認出主人——手一鬆，銅盆傾覆。她欲驚呼，被他一把扼住喉嚨命其噤聲。這是西方文學史上最早、也最常被引用的「認出」場景，奧爾巴赫《模仿論》開篇即以此段分析荷馬的敘事方式。"],

/* ---- 名物與聖地 ---- */
["golden_apple","不和的金蘋果","Μῆλον τῆς Ἔριδος","引發特洛伊戰爭的一顆果實",2.0,16.8,"紛爭女神厄里斯因未受邀於珀琉斯與忒提斯的婚宴，將一顆刻著「獻給最美者（καλλίστῃ）」的金蘋果擲入席間。赫拉、雅典娜與阿佛洛狄忒各執己見，宙斯不願得罪任何一方，命特洛伊王子帕里斯裁決。三位女神分別以王權、戰功與「世上最美的女子」相許，帕里斯選了最後一項——十年戰爭、一座城的覆滅與無數英雄的死，都由這一顆蘋果而起。「不和的蘋果」至今仍是紛爭源頭的代名詞。",true],
["trojan_horse","特洛伊木馬","Δούρειος Ἵππος","以計取城的巨馬",4.0,16.8,"十年強攻不下後，奧德修斯獻上此計：造一匹中空的巨大木馬，內藏精銳，佯裝獻給雅典娜作為贖罪之禮，全軍則假意撤退至鄰島。特洛伊人不顧祭司拉奧孔「我畏懼希臘人，即使他們帶著禮物」的警告與卡珊德拉的預言，拆開城牆將木馬拖入城中歡慶。夜半伏兵自馬腹縋下開啟城門，特洛伊在一夜之間陷落。「木馬」自此成為由內部瓦解的隱喻，電腦病毒亦沿用其名。",true],
["golden_fleece","金羊毛","Χρυσόμαλλον δέρας","阿爾戈船遠征的目標",6.0,16.8,"救走佛里克索斯與赫勒的那頭金毛飛羊，抵達科爾喀斯後被獻祭給宙斯，毛皮則釘在阿瑞斯聖林的一株橡樹上，由一條永不闔眼的巨龍看守。它象徵王權的正當性，珀利阿斯正是以「取回金羊毛」為由支開伊阿宋。伊阿宋靠美狄亞的巫術催眠巨龍才得手，卻也自此背上一段將他徹底毀掉的姻緣。",true],
["labyrinth","克諾索斯迷宮","Λαβύρινθος（Labyrinthos）","囚禁彌諾陶洛斯的建築",8.0,16.8,"彌諾斯命代達羅斯建造的巨大迷宮，通道盤曲，連設計者本人一旦入內也幾乎走不出來，牛首人身的彌諾陶洛斯即被囚於最深處。雅典每九年須進貢七對童男女餵養牠，直到忒修斯憑阿里阿德涅的線團進去又走出來。其名或源自克里特的雙刃斧「拉布里斯」，克諾索斯宮殿本身的繁複格局可能就是傳說的原型。",true],
["aegis","埃癸斯神盾","Αἰγίς（Aigis）","宙斯與雅典娜的護具",10.0,16.8,"以山羊皮（一說即哺育宙斯的山羊阿瑪爾忒亞之皮）製成的護胸與盾，赫淮斯托斯所鑄，邊緣垂著金穗與蛇形飾。宙斯揮動它便掀起風暴與恐慌；雅典娜借用時在正面嵌上美杜莎的首級，凡與之對視者化為石頭。英文 aegis（庇護、主導）即由此而來。",true],
["delphi_note","德爾斐神諭所","Δελφοί（Delphoi）","世界的肚臍",12.0,16.8,"帕耳那索斯山麓的阿波羅聖域，希臘世界最權威的神諭所。此地原屬蓋亞，經忒彌斯、福柏，最後才傳給阿波羅——他射殺守護聖地的巨蟒皮同而奪得。女祭司皮提亞坐在三腳鼎上，吸入地隙升起的氣息後以模糊語句傳達神意，再由祭司解為詩體。神殿入口刻著「認識你自己」與「凡事勿過度」。伊底帕斯、克洛伊索斯與無數城邦的命運，都繫於這裡的一句話。殿中的翁法洛斯聖石被視為世界的中心。",true],
["olympos","奧林帕斯山","Ὄλυμπος（Olympos）","諸神的居所",14.0,16.8,"希臘最高峰，泰坦之戰後成為宙斯一族的居所——「奧林帕斯神族」之名由此而來。荷馬說山頂終年無風無雨無雪，諸神在此宴飲神饌與神酒，赫柏與伽倪墨得斯斟酒，繆斯歌唱。宮殿由庫克洛普斯所築、赫淮斯托斯所飾，雲門由時序女神荷賴看守。宙斯在此召開神會，也在此俯瞰人間的戰場。",true],
["underworld_note","冥界與五河","Ἅιδου・Στύξ・Λήθη・Ἀχέρων","亡魂的歸處",16.0,16.8,"哈得斯統治的地下國度，由五條河劃界：憎恨之河斯提克斯（諸神立誓的憑據）、悲嘆之河阿刻戎（卡戎在此擺渡）、哀泣之河科庫托斯、火焰之河佛勒革同、遺忘之河勒忒（飲之則盡忘前世）。入口由三頭犬刻耳柏洛斯看守，彌諾斯、拉達曼提斯與埃阿科斯三判官裁決亡魂的去向：德行者往至福樂土（厄呂西翁），褻瀆神明者墜入塔爾塔羅斯受永罰，其餘則在無光的阿斯佛德爾草原上飄蕩。",true],
];

/* ============ 版面轉換（多神話體系共用同一套繪製引擎） ============ */
const COLW=185, ROWH=145, NODE_W=150, NODE_H=60;
// @@EDITS_START
const USER_EDITS = {};
const GREEK_USER_EDITS = {};
// @@EDITS_END

const PANTHEONS = {
  japan: {
    title:'⛩️ 日本神話系譜', defs:JP_NODE_DEFS, groups:JP_GROUPS, unions:JP_UNIONS, names:JP_NODE_NAMES,
    seed:USER_EDITS, storage:'jmyth_edits', yokai:true, placeholder:'搜尋神名或讀音…', editBtn:'✏️ 編輯此神明',
    labels:{kana:'假名讀音', kojiki:'古事記', nihonshoki:'日本書紀', reading:'読み', aliases:'別稱'},
  },
  greek: {
    title:'🏛️ 希臘神話系譜', defs:GR_NODE_DEFS, groups:GR_GROUPS, unions:GR_UNIONS, names:GR_NODE_NAMES,
    seed:GREEK_USER_EDITS, storage:'greek_edits', yokai:false, placeholder:'搜尋神名或希臘原文…', editBtn:'✏️ 編輯此神祇',
    labels:{kana:'卡片副標（原文／轉寫）', kojiki:'希臘原文', nihonshoki:'羅馬神名', reading:'拉丁轉寫', aliases:'別稱'},
  },
};
// 各體系的使用者修改各自獨立保存，匯出時一併寫回
const LIVE_EDITS = {};
Object.entries(PANTHEONS).forEach(([k,p])=>{
  let saved = {};
  try{ saved = JSON.parse(localStorage.getItem(p.storage)||'{}'); }catch{}
  LIVE_EDITS[k] = Object.assign({}, p.seed, saved);
});

let currentPantheon = 'japan';
let P = PANTHEONS.japan;
let NODE_DEFS = P.defs, GROUPS = P.groups, UNIONS = P.unions, NODE_NAMES = P.names;
let NODE_NAMES_ORIG = P.names;
let USER_EDITS_LIVE = LIVE_EDITS.japan;
let EDITS_KEY = P.storage;

const stage = document.getElementById('stage');
const svg = document.getElementById('edges');
const nodes = {};
const PAD = 60;
let totalW = 0, totalH = 0;

function centerX(n){ return n.px + NODE_W/2; }
function centerY(n){ return n.py + NODE_H/2; }

function layoutNodes(){
  Object.keys(nodes).forEach(k=>delete nodes[k]);
  NODE_DEFS.forEach(d=>{
    const [id,name,kana,role,col,row,desc,isNote,tag] = d;
    const ov = USER_EDITS_LIVE[id]||{};
    nodes[id] = {id, name:ov.name??name, kana:ov.kana??kana, role:ov.role??role, desc:ov.desc??desc, isNote:!!isNote, tag, px:col*COLW, py:row*ROWH};
  });
  let minPx=Infinity,minPy=Infinity,maxPx=-Infinity,maxPy=-Infinity;
  Object.values(nodes).forEach(n=>{
    minPx=Math.min(minPx,n.px); minPy=Math.min(minPy,n.py);
    maxPx=Math.max(maxPx,n.px+NODE_W); maxPy=Math.max(maxPy,n.py+NODE_H);
  });
  Object.values(nodes).forEach(n=>{ n.px += PAD-minPx; n.py += PAD-minPy; });
  totalW = maxPx-minPx+PAD*2; totalH = maxPy-minPy+PAD*2;
  stage.style.width = totalW+'px';
  stage.style.height = totalH+'px';
  svg.setAttribute('width', totalW);
  svg.setAttribute('height', totalH);
}

// 切換神話體系：換掉資料來源後整張圖重繪
function loadPantheon(key){
  const p = PANTHEONS[key];
  if(!p) return;
  currentPantheon = key; P = p;
  NODE_DEFS=p.defs; GROUPS=p.groups; UNIONS=p.unions; NODE_NAMES=p.names;
  p.namesOrig = p.namesOrig || JSON.parse(JSON.stringify(p.names));
  NODE_NAMES_ORIG = p.namesOrig;
  USER_EDITS_LIVE = LIVE_EDITS[key];
  EDITS_KEY = p.storage;
  document.getElementById('mythTitle').textContent = p.title;
  document.getElementById('toYokaiBtn').style.display = p.yokai ? '' : 'none';
  const si = document.getElementById('searchInput');
  si.placeholder = p.placeholder; si.value = '';
  document.getElementById('searchClear').style.display = 'none';
  document.getElementById('searchResults').style.display = 'none';
  document.getElementById('p-edit-btn').textContent = p.editBtn;
  Object.entries(p.labels).forEach(([k,text])=>{
    const el = document.getElementById('pel-'+k); if(el) el.textContent = text;
  });
  closePanel();
  layoutNodes();
  renderGraph();
}

function hexToRgba(hex, a){
  const v = hex.replace('#','');
  const r = parseInt(v.substring(0,2),16), g = parseInt(v.substring(2,4),16), b = parseInt(v.substring(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

// 節點（先建立，量到真實高度後才佈線）
// #japan 初始為 display:none，offsetHeight 會量到 0，因此建構期間先暫時顯示
const japanEl = document.getElementById('japan');
function renderGraph(){
const wasOpen = japanEl.style.display === 'block';
japanEl.style.display = 'block';
// 重畫前先清乾淨（字型載入完成後會再跑一次，屆時方塊高度才是最終值）
stage.querySelectorAll('.node,.groupbox,.edge-label').forEach(e=>e.remove());
while(svg.firstChild) svg.removeChild(svg.firstChild);
Object.values(nodes).forEach(n=>{
  const div = document.createElement('div');
  div.className='node'+(n.tag==='key'?' key':'')+(n.isNote?' note':'');
  div.style.left=n.px+'px';
  div.style.top=n.py+'px';

  div.innerHTML=`<div class="name">${n.name}</div>${n.kana?('<div class="kana">'+n.kana+'</div>'):''}${n.role?('<div class="role">'+n.role+'</div>'):''}`;
  div.addEventListener('click', (ev)=>{ ev.stopPropagation(); focusNode(n.id); });
  stage.appendChild(div);
