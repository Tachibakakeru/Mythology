<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>世界神話系譜計畫</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0f1220; --bg2:#171b2e; --card:#1e2340; --accent:#e0b060;
    --text:#f0e8d8; --dim:#9098b8; --line:#5a5f88;
  }
  :root[data-theme="light"]{
    --bg:#f6f1e4; --bg2:#ece3cd; --card:#ffffff; --accent:#a8710f;
    --text:#2c2416; --dim:#7a7160; --line:#cdbf9e;
  }
  *{box-sizing:border-box;}
  #themeBtn{background:none;border:1px solid var(--line);color:var(--text);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:1.05em;flex:none;}
  #themeBtn:hover{border-color:var(--accent);}
  #homeThemeBtn{position:absolute;top:20px;right:20px;}
  body{margin:0;font-family:"Noto Sans TC","Segoe UI",sans-serif;background:var(--bg);color:var(--text);}

  /* ---------- HOME ---------- */
  #home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:40px;}
  #home h1{font-size:2.2em;letter-spacing:.15em;margin:0;color:var(--accent);text-shadow:0 0 20px rgba(224,176,96,.4);}
  #home p{color:var(--dim);margin:0;}
  .icon-grid{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;}
  .myth-icon{
    width:160px;height:190px;border-radius:16px;background:var(--card);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    cursor:pointer;border:2px solid transparent;transition:.25s;position:relative;overflow:hidden;
  }
  .myth-icon:hover:not(.disabled){transform:translateY(-6px);border-color:var(--accent);box-shadow:0 10px 30px rgba(224,176,96,.25);}
  .myth-icon .glyph{font-size:3em;}
  .myth-icon .label{font-size:1.05em;font-weight:600;}
  .myth-icon .sub{font-size:.75em;color:var(--dim);}
  .myth-icon.disabled{opacity:.35;cursor:not-allowed;}
  .myth-icon.disabled .sub{font-style:italic;}

  /* ---------- JAPAN VIEW ---------- */
  #japan{display:none;position:fixed;inset:0;background:var(--bg);}
  #topbar{
    position:absolute;top:0;left:0;right:0;height:64px;z-index:10;
    display:flex;align-items:center;gap:16px;padding:0 20px;
    background:linear-gradient(var(--bg2),rgba(23,27,46,.85));border-bottom:1px solid #2c3155;
  }
  #backBtn,#yBackBtn{background:none;border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;flex:none;display:inline-flex;align-items:center;font-family:inherit;font-size:1em;}
  #backBtn:hover,#yBackBtn:hover{border-color:var(--accent);color:var(--accent);}
  #toYokaiBtn,#toMythBtn{background:none;border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;flex:none;display:inline-flex;align-items:center;}
  #toYokaiBtn:hover,#toMythBtn:hover{border-color:var(--accent);color:var(--accent);}
  #topbar h2{margin:0;font-size:1.05em;color:var(--accent);letter-spacing:.08em;white-space:nowrap;flex:none;}
  #searchBox{position:relative;flex:1;max-width:340px;}
  #searchInput{
    width:100%;padding:9px 36px 9px 34px;border-radius:20px;border:1px solid var(--line);
    background:#11142280;color:var(--text);font-size:.95em;outline:none;box-sizing:border-box;
  }
  #searchClear{display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--dim);cursor:pointer;font-size:.9em;padding:2px 5px;line-height:1;opacity:.65;z-index:21;}
  #searchClear:hover{opacity:1;color:var(--accent);}
  #searchInput:focus{border-color:var(--accent);}
  #searchBox::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:.85em;opacity:.6;}
  #searchResults{
    position:absolute;top:110%;left:0;right:0;background:var(--card);border-radius:10px;
    border:1px solid var(--line);max-height:280px;overflow:auto;display:none;z-index:20;
  }
  #searchResults div{padding:8px 14px;cursor:pointer;font-size:.9em;border-bottom:1px solid #2c3155;}
  #searchResults div:hover,#searchResults div.focused{background:#2a3060;}
  #searchResults .r-kana{color:var(--dim);font-size:.8em;margin-left:6px;}
  #resetBtn{background:none;border:1px solid var(--line);color:var(--dim);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:.85em;flex:none;}
  #resetBtn:hover{color:var(--accent);border-color:var(--accent);}
  #legend{margin-left:auto;display:flex;gap:13px;align-items:center;font-size:.7em;color:var(--dim);flex:1 1 auto;
    justify-content:flex-end;flex-wrap:wrap;max-height:56px;overflow:hidden;}
  #legend span{display:flex;align-items:center;gap:5px;white-space:nowrap;line-height:1.6;}
  #legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--line);flex:none;}
  #legend i.dbl{height:5px;border-top:2px solid #d18a9c;border-bottom:2px solid #d18a9c;}
  #legend i.wed{border-top:2px solid #d18a9c;}
  #legend i.dash{border-top:2px dashed #6fc2b4;}
  #legend b.box{display:inline-block;width:14px;height:10px;border:1px dashed var(--accent);border-radius:2px;flex:none;}

  #canvasWrap{position:absolute;inset:0;top:64px;overflow:hidden;cursor:grab;touch-action:none;}
  #canvasWrap.grabbing{cursor:grabbing;}
  #stage{position:absolute;left:0;top:0;transform-origin:0 0;}
  #stage.smooth{transition:transform .5s cubic-bezier(.22,.9,.32,1);}

  .groupbox{position:absolute;border-radius:14px;pointer-events:none;z-index:0;}
  .groupbox .glabel{position:absolute;top:-13px;left:10px;padding:2px 9px;border-radius:8px;font-size:.75em;font-weight:700;white-space:nowrap;}

  .node{position:absolute;width:150px;min-height:60px;border-radius:9px;background:var(--card);
    border:1.5px solid var(--line);padding:6px 9px;display:flex;flex-direction:column;justify-content:center;
    transition:border-color .2s, box-shadow .2s, background .2s, opacity .3s; user-select:none;cursor:pointer;z-index:3;}
  .node:hover{border-color:var(--accent);}
  .node .name{font-size:.85em;font-weight:700;line-height:1.2;}
  .node .kana{font-size:.63em;color:var(--dim);}
  .node .role{font-size:.6em;color:#e0b06099;margin-top:2px;line-height:1.25;}
  .node.key{border-color:var(--accent);border-width:2px;box-shadow:0 0 14px rgba(224,176,96,.25);}
  .node.note{background:transparent;border-style:dashed;opacity:.75;}
  .node.note .name{font-size:.78em;font-style:italic;}
  .node.highlight{border-color:#ff5f5f !important;box-shadow:0 0 20px rgba(255,95,95,.65);background:#2a1c1c;z-index:6;}
  .node.dim{opacity:.15;}

  svg#edges{position:absolute;left:0;top:0;overflow:visible;z-index:1;}
  .edge{stroke:var(--line);stroke-width:1.6;fill:none;opacity:.6;}
  .edge.marriage{stroke:#d18a9c;opacity:.85;}
  .edge.partner-line{stroke:#6fc2b4;opacity:.85;}
  .edge.dim{opacity:.06;}
  .edge.hl{stroke:#ff9f3f !important;opacity:1 !important;stroke-width:2.8;}
  .edge.dim-edge{opacity:.05 !important;}
  .edge-label{position:absolute;font-size:.62em;padding:1px 6px;border-radius:6px;white-space:nowrap;z-index:2;pointer-events:none;}
  .p-namerow{font-size:.82em;color:var(--text);margin-bottom:5px;line-height:1.6;}
  .p-namelabel{display:inline-block;font-size:.72em;color:var(--dim);border:1px solid var(--line);padding:1px 6px;border-radius:6px;margin-right:6px;white-space:nowrap;}
  .groupbox.hl{outline:2px solid rgba(255,159,63,.8);outline-offset:2px;box-shadow:0 0 22px rgba(255,159,63,.45);}
  #searchResults .r-group{color:var(--accent);font-weight:600;}
  .edge-label.marriage{color:#e08a8a;background:#2a1c1c;}
  .edge-label.ritual{color:#b39ddb;background:#221c33;}
  .edge-label.blood{color:#e08a8a;background:#2a1c1c;}
  .edge-label.partner{color:#7fd0c4;background:#173330;}

  #panel,#ypanel{position:absolute;top:64px;right:0;bottom:0;width:340px;max-width:82vw;background:var(--card);
    border-left:1px solid var(--line);transform:translateX(100%);transition:transform .35s ease;z-index:15;
    padding:22px 22px;overflow-y:auto;box-shadow:-10px 0 30px rgba(0,0,0,.3);}
  #panel.open,#ypanel.open{transform:translateX(0);}
  #panel .p-name,#ypanel .p-name{font-size:1.3em;font-weight:700;color:var(--accent);margin-bottom:2px;}
  #panel .p-kana,#ypanel .p-kana{color:var(--dim);font-size:.9em;margin-bottom:10px;}
  #panel .p-role,#ypanel .p-role{display:inline-block;font-size:.78em;color:#e0b060;background:#e0b06022;padding:3px 10px;border-radius:12px;margin-bottom:14px;}
  #panel .p-desc,#ypanel .p-desc{font-size:.92em;line-height:1.75;color:var(--text);opacity:.9;}
  #panel .p-groups,#ypanel .p-groups{margin-top:16px;display:flex;gap:6px;flex-wrap:wrap;}
  #panel .p-groups span,#ypanel .p-groups span{font-size:.7em;color:var(--dim);border:1px solid var(--line);padding:3px 9px;border-radius:10px;}
  #panel .p-close,#ypanel .p-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--dim);font-size:1.3em;cursor:pointer;}
  #panel .p-close:hover,#ypanel .p-close:hover{color:var(--accent);}
  .pe-sep{margin:16px 0;border:none;border-top:1px solid var(--line);}
  .pe-label{font-size:.72em;color:var(--dim);margin:9px 0 3px;}
  .pe-inp{width:100%;background:#11142280;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:6px 8px;font-size:.88em;box-sizing:border-box;font-family:inherit;}
  .pe-inp:focus{border-color:var(--accent);outline:none;}
  textarea.pe-inp{resize:vertical;min-height:72px;}
  .pe-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .pe-btns button{background:none;border:1px solid var(--line);color:var(--dim);padding:6px 11px;border-radius:6px;cursor:pointer;font-size:.8em;}
  .pe-btns .pe-save{color:#ff9f3f;border-color:#ff9f3f;}
  .pe-btns .pe-del{color:#e05050;border-color:#e05050;}
  #p-edit-btn,#yp-edit-btn{margin-top:18px;background:none;border:1px solid var(--line);color:var(--dim);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:.78em;width:100%;}
  #p-edit-btn:hover,#p-edit-btn.open,#yp-edit-btn:hover,#yp-edit-btn.open{color:var(--accent);border-color:var(--accent);}
  /* 附圖 / 自訂欄位編輯器 */
  .pe-img{display:flex;gap:7px;align-items:flex-start;margin-top:7px;}
  .pe-img img{width:56px;height:56px;object-fit:cover;border-radius:5px;border:1px solid var(--line);flex:none;}
  .pe-row{display:flex;gap:6px;align-items:center;margin-top:7px;}
  .pe-row .pe-fl{flex:0 0 33%;}
  .pe-x{background:none;border:1px solid var(--line);color:#e05050;border-radius:5px;cursor:pointer;font-size:.78em;padding:4px 7px;flex:none;align-self:center;}
  .pe-x:hover{border-color:#e05050;}
  .pe-add{margin-top:8px;background:none;border:1px dashed var(--line);color:var(--dim);border-radius:6px;cursor:pointer;font-size:.76em;padding:5px 10px;width:100%;}
  .pe-add:hover{color:var(--accent);border-color:var(--accent);}
  .pe-file{display:none;}
  /* 面板內的附圖呈現 */
  .p-figs{margin-top:14px;display:flex;flex-direction:column;gap:12px;}
  .p-figs figure{margin:0;}
  .p-figs img{width:100%;border-radius:8px;border:1px solid var(--line);display:block;cursor:zoom-in;}
  .p-figs figcaption{font-size:.74em;color:var(--dim);margin-top:5px;line-height:1.6;}
  #imgLightbox{position:fixed;inset:0;background:#000000d0;z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;box-sizing:border-box;cursor:zoom-out;}
  #imgLightbox.open{display:flex;}
  #imgLightbox img{max-width:96%;max-height:84%;object-fit:contain;border-radius:8px;}
  #imgLightbox div{color:#e8e8e8;font-size:.85em;text-align:center;max-width:70ch;line-height:1.7;}
  #exportBtn{background:none;border:1px solid var(--line);color:var(--dim);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.82em;flex:none;}
  #exportBtn:hover{color:var(--accent);border-color:var(--accent);}

  #zoomCtrl{position:absolute;bottom:16px;right:16px;display:flex;flex-direction:column;gap:6px;z-index:10;}
  #zoomCtrl button{width:36px;height:36px;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:1.1em;cursor:pointer;}
  #zoomCtrl button:hover{border-color:var(--accent);color:var(--accent);}

  /* ---------- YOKAI VIEW ---------- */
  #yokai{display:none;position:fixed;inset:0;background:var(--bg);}
  #ytopbar{
    position:absolute;top:0;left:0;right:0;height:64px;z-index:10;
    display:flex;align-items:center;gap:16px;padding:0 20px;
    background:linear-gradient(var(--bg2),rgba(23,27,46,.85));border-bottom:1px solid #2c3155;
  }
  #ytopbar h2{margin:0;font-size:1.05em;color:var(--accent);letter-spacing:.08em;white-space:nowrap;flex:none;}
  #ytopbar > button{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;cursor:pointer;padding:8px 12px;flex:none;font-family:inherit;}
  #ytopbar > button:hover{border-color:var(--accent);color:var(--accent);}
  #ysearchBox{position:relative;flex:1;max-width:340px;}
  #ysearchInput{
    width:100%;padding:9px 36px 9px 34px;border-radius:20px;border:1px solid var(--line);
    background:#11142280;color:var(--text);font-size:.95em;outline:none;box-sizing:border-box;
  }
  #ysearchClear{display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--dim);cursor:pointer;font-size:.9em;padding:2px 5px;line-height:1;opacity:.65;z-index:21;}
  #ysearchClear:hover{opacity:1;color:var(--accent);}
  #ysearchInput:focus{border-color:var(--accent);}
  #ysearchBox::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:.85em;opacity:.6;}
  #yresults{
    position:absolute;top:110%;left:0;right:0;background:var(--card);border-radius:10px;
    border:1px solid var(--line);max-height:280px;overflow:auto;display:none;z-index:20;
  }
  #yresults div{padding:8px 14px;cursor:pointer;font-size:.9em;border-bottom:1px solid #2c3155;}
  #yresults div:hover,#yresults div.focused{background:#2a3060;}
  #yresults .r-kana{color:var(--dim);font-size:.8em;margin-left:6px;}

  #ycanvasWrap{position:absolute;inset:0;top:64px;overflow:hidden;touch-action:none;}
  #ystage{position:absolute;left:0;top:0;transform-origin:0 0;}
  #ystage.smooth{transition:transform .6s cubic-bezier(.22,.9,.32,1);}
  #ycontent{width:1200px;box-sizing:border-box;padding:26px 30px 90px;}
  #yResetBtn{background:none;border:1px solid var(--line);color:var(--dim);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:.85em;flex:none;}
  #yResetBtn:hover{color:var(--accent);border-color:var(--accent);}
  #yzoomCtrl{position:absolute;bottom:16px;right:16px;display:flex;flex-direction:column;gap:6px;z-index:10;}
  #yzoomCtrl button{width:36px;height:36px;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:1.1em;cursor:pointer;}
  #yzoomCtrl button:hover{border-color:var(--accent);color:var(--accent);}
  .ygroup{margin-bottom:34px;}
  .ygroup h3{color:var(--accent);font-size:1.02em;margin:0 0 14px;padding-bottom:6px;border-bottom:1px dashed var(--line);}
  .ygroup.special h3{color:#ff9f3f;}
  .ygrid{display:flex;flex-wrap:wrap;gap:14px;}
  .ycard{width:148px;min-height:78px;border-radius:9px;background:var(--card);
    border:1.5px solid var(--line);padding:8px 10px;cursor:pointer;transition:.2s;position:relative;}
  .ycard:hover{border-color:var(--accent);transform:translateY(-3px);}
  .ycard .yname{font-size:.86em;font-weight:700;line-height:1.25;}
  .ycard .ykana{font-size:.6em;color:var(--dim);margin-top:3px;}
  .ycard .ycat{font-size:.58em;color:#e0b06099;margin-top:5px;}
  .ycard .ystar{position:absolute;top:6px;right:8px;font-size:.7em;}
  .ycard.dim{opacity:.15;}
  .ycard.highlight{border-color:#ff5f5f !important;box-shadow:0 0 16px rgba(255,95,95,.55);}
  .ycard.note{background:transparent;border-style:dashed;opacity:.8;}
  .ycard.note .yname{font-style:italic;}
  .ycard .yfav{position:absolute;top:5px;right:7px;font-size:1em;line-height:1;cursor:pointer;color:var(--dim);z-index:2;}
  .ycard .yfav:hover{color:#ffd54f;}
  .ycard .yfav.active{color:#ffd54f;text-shadow:0 0 6px rgba(255,213,79,.75);}
  .ycard.favorited{border-color:#ffd54f;box-shadow:0 0 12px rgba(255,213,79,.3);}
  #favFilterBtn{background:none;border:1px solid var(--line);color:var(--dim);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:.85em;flex:none;}
  #favFilterBtn:hover{border-color:#ffd54f;color:#ffd54f;}
  #favFilterBtn.active{color:#ffd54f;border-color:#ffd54f;background:#ffd54f1a;}
  .yp-fav-btn{margin-top:18px;background:none;border:1px solid var(--line);color:var(--dim);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.82em;width:100%;}
  .yp-fav-btn:hover{border-color:#ffd54f;color:#ffd54f;}
  .yp-fav-btn.active{color:#ffd54f;border-color:#ffd54f;background:#ffd54f1a;}
  #yfav-empty{color:var(--dim);padding:60px 20px;text-align:center;font-size:.95em;}

  /* ---------- 響應式：手機／平板 ---------- */
  @media (max-width: 700px){
    #home{gap:26px;padding:24px;}
    #home h1{font-size:1.5em;letter-spacing:.08em;}
    .icon-grid{gap:16px;}
    .myth-icon{width:130px;height:158px;}
    .myth-icon .glyph{font-size:2.3em;}
    #homeThemeBtn{top:14px;right:14px;}
    #topbar,#ytopbar{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding:0 12px;gap:10px;}
    #topbar h2,#ytopbar h2{font-size:.92em;}
    #searchBox,#ysearchBox{max-width:170px;min-width:130px;flex:none;}
    #legend{display:none;}
    #ycontent{width:100%;padding:18px 14px 90px;}
    .ycard{width:132px;}
    #zoomCtrl,#yzoomCtrl{bottom:12px;right:12px;}

    /* 捲動軸一律隱藏（外觀用，捲動功能仍保留） */
    #topbar,#ytopbar,#ycanvasWrap,.ygrid,#panel,#ypanel{scrollbar-width:none;-ms-overflow-style:none;}
    #topbar::-webkit-scrollbar,#ytopbar::-webkit-scrollbar,#ycanvasWrap::-webkit-scrollbar,
    .ygrid::-webkit-scrollbar,#panel::-webkit-scrollbar,#ypanel::-webkit-scrollbar{display:none;height:0;width:0;}

    /* 詳情面板改為由下往上彈出的抽屜，避免遮住整個系譜／圖鑑 */
    #panel,#ypanel{
      top:auto;bottom:0;left:0;right:0;width:100%;max-width:100%;
      height:72vh;max-height:80vh;
      border-left:none;border-top:1px solid var(--line);
      border-radius:18px 18px 0 0;
      transform:translateY(100%);
    }
    #panel.open,#ypanel.open{transform:translateY(0);}

    /* 妖怪圖鑑：整頁改為原生上下捲動，各分類改為左右滑動一列 */
    #ycanvasWrap{overflow-y:auto;overflow-x:hidden;touch-action:pan-y;}
    #ystage{position:static;transform:none !important;}
    .ygrid{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x;scroll-snap-type:x proximity;padding-bottom:6px;}
    .ycard{flex:none;scroll-snap-align:start;}
    #yzoomCtrl button:not(#yTopBtn){display:none;}
  }
</style>
</head>
<body>

<div id="home">
  <h1>世界神話系譜計畫</h1>
  <p>點選一個神話體系，探索諸神的血脈與傳說</p>
  <button id="homeThemeBtn" onclick="toggleTheme()" title="切換明暗模式">🌓</button>
  <div class="icon-grid">
    <div class="myth-icon" onclick="openJapan()">
      <div class="glyph">⛩️</div>
      <div class="label">日本神話・妖怪</div>
      <div class="sub">古事記・日本書紀・妖怪伝承</div>
    </div>
    <div class="myth-icon disabled">
      <div class="glyph">🏛️</div>
      <div class="label">希臘神話</div>
      <div class="sub">敬請期待</div>
    </div>
    <div class="myth-icon disabled">
      <div class="glyph">⚡</div>
      <div class="label">北歐神話</div>
      <div class="sub">敬請期待</div>
    </div>

const COLW=185, ROWH=145, NODE_W=150, NODE_H=60;
// @@EDITS_START
const USER_EDITS = {};
// @@EDITS_END
const USER_EDITS_LIVE = Object.assign({}, USER_EDITS, JSON.parse(localStorage.getItem('jmyth_edits')||'{}'));
const nodes = {};
NODE_DEFS.forEach(d=>{
  const [id,name,kana,role,col,row,desc,isNote,tag] = d;
  const ov = USER_EDITS_LIVE[id]||{};
  nodes[id] = {id, name:ov.name??name, kana:ov.kana??kana, role:ov.role??role, desc:ov.desc??desc, isNote:!!isNote, tag, px:col*COLW, py:row*ROWH};
});

function centerX(n){ return n.px + NODE_W/2; }
function centerY(n){ return n.py + NODE_H/2; }

/* ============ 渲染：節點 / 分類框 / 連線 ============ */
const stage = document.getElementById('stage');
const svg = document.getElementById('edges');

let minPx=0,minPy=0,maxPx=0,maxPy=0;
Object.values(nodes).forEach(n=>{
  minPx=Math.min(minPx,n.px); minPy=Math.min(minPy,n.py);
  maxPx=Math.max(maxPx,n.px+NODE_W); maxPy=Math.max(maxPy,n.py+NODE_H);
});
const PAD=60;
const shiftX = PAD-minPx, shiftY = PAD-minPy;
Object.values(nodes).forEach(n=>{ n.px+=shiftX; n.py+=shiftY; });
const totalW = maxPx-minPx+PAD*2, totalH = maxPy-minPy+PAD*2;
stage.style.width = totalW+'px';
stage.style.height = totalH+'px';
svg.setAttribute('width', totalW);
svg.setAttribute('height', totalH);

function hexToRgba(hex, a){
  const v = hex.replace('#','');
  const r = parseInt(v.substring(0,2),16), g = parseInt(v.substring(2,4),16), b = parseInt(v.substring(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

// 節點（先建立，量到真實高度後才佈線）
// #japan 初始為 display:none，offsetHeight 會量到 0，因此建構期間先暫時顯示
const japanEl = document.getElementById('japan');
function renderGraph(){
const wasOpen = japanEl.style.display === 'block';
japanEl.style.display = 'block';
// 重畫前先清乾淨（字型載入完成後會再跑一次，屆時方塊高度才是最終值）
stage.querySelectorAll('.node,.groupbox,.edge-label').forEach(e=>e.remove());
while(svg.firstChild) svg.removeChild(svg.firstChild);
Object.values(nodes).forEach(n=>{
  const div = document.createElement('div');
  div.className='node'+(n.tag==='key'?' key':'')+(n.isNote?' note':'');
  div.style.left=n.px+'px';
  div.style.top=n.py+'px';
  div.dataset.id=n.id;
  div.innerHTML=`<div class="name">${n.name}</div>${n.kana?('<div class="kana">'+n.kana+'</div>'):''}${n.role?('<div class="role">'+n.role+'</div>'):''}`;
  div.addEventListener('click', (ev)=>{ ev.stopPropagation(); focusNode(n.id); });
  stage.appendChild(div);
  n.h = div.offsetHeight || NODE_H;
});
function botY(n){ return n.py + n.h; }
function midY(n){ return n.py + n.h/2; }

// 分類框（量到真實節點高度後才畫，並保留標籤自己的空間）
const placedLabels = []; // 已放置的標籤 bbox，用來避免標籤互相重疊
GROUPS.forEach(([label, ids, color, drawBox=true], gi)=>{
  const members = ids.map(id=>nodes[id]).filter(Boolean);
  if(!members.length) return;
  if(!drawBox) return;
  const x0 = Math.min(...members.map(n=>n.px))-16;
  const y0 = Math.min(...members.map(n=>n.py))-34;
  const x1 = Math.max(...members.map(n=>n.px+NODE_W))+16;
  const y1 = Math.max(...members.map(n=>botY(n)))+12;
  const box = document.createElement('div');
  box.className='groupbox';
  box.dataset.gi = gi;
  box.style.left=x0+'px'; box.style.top=y0+'px';
  box.style.width=(x1-x0)+'px'; box.style.height=(y1-y0)+'px';
  box.style.border = `1.5px dashed ${hexToRgba(color,.55)}`;
  box.style.background = hexToRgba(color,.07);
  const lab = document.createElement('div');
  lab.className='glabel';
  lab.style.background = color;
  lab.style.color = '#1a1a1a';
  lab.textContent = label;
  box.appendChild(lab);
  stage.appendChild(box);
  // 標籤擺在不會壓到任何神明方塊或其他群組標籤的位置
  const bw = x1-x0, bh = y1-y0, lw = lab.offsetWidth, lh = lab.offsetHeight;
  const hit = (lx,ly)=>{
    const ax=x0+lx, ay=y0+ly, ax2=ax+lw, ay2=ay+lh;
    if(Object.values(nodes).some(n=>ax<n.px+NODE_W-2&&ax2>n.px+2&&ay<n.py+n.h-2&&ay2>n.py+2)) return true;
    if(placedLabels.some(r=>ax<r.x2-2&&ax2>r.x1+2&&ay<r.y2-2&&ay2>r.y1+2)) return true;
    return false;
  };
  const cands = [[10,-13],[bw-lw-10,-13],[(bw-lw)/2,-13],
                 [bw+8,-13],[-lw-8,-13],            // 貼在框外的左右側
                 [bw+8,6],[-lw-8,6],
                 [bw+8,bh-lh-6],[-lw-8,bh-lh-6]];
  for(let k=1;k<=14;k++) cands.push([10,-13-k*(lh+5)], [bw-lw-10,-13-k*(lh+5)]);  // 逐階往上找空位
  const ok = cands.find(([lx,ly])=>!hit(lx,ly)) || cands[0];
  lab.style.left = ok[0]+'px';
  lab.style.top  = ok[1]+'px';
  placedLabels.push({x1:x0+ok[0], y1:y0+ok[1], x2:x0+ok[0]+lw, y2:y0+ok[1]+lh});
});

/* ---- 連線佈線：先避開節點方塊，再於交叉處「跳線」 ---- */
const boxes = Object.values(nodes).map(n=>({id:n.id, x1:n.px, y1:n.py, x2:n.px+NODE_W, y2:n.py+n.h}));
const PAD_H = 6;   // 線與方塊的最小淨距

function hBlocked(y, xa, xb, skip){
  const lo=Math.min(xa,xb), hi=Math.max(xa,xb);
  return boxes.some(b=> !skip.includes(b.id) &&
    b.x1 < hi-1 && b.x2 > lo+1 && y > b.y1-PAD_H && y < b.y2+PAD_H);
}
function vBlocked(x, ya, yb, skip){
  const lo=Math.min(ya,yb), hi=Math.max(ya,yb);
  return boxes.some(b=> !skip.includes(b.id) &&
    b.y1 < hi-1 && b.y2 > lo+1 && x > b.x1-PAD_H && x < b.x2+PAD_H);
}
function clearY(y0, xa, xb, skip){
  for(let i=0;i<40;i++){ const y=y0+i*8; if(!hBlocked(y,xa,xb,skip)) return y; }
  return y0;
}
// 往指定方向找一條淨空的水平帶，找不到回傳 null
function clearBand(y0, xa, xb, skip, dir){
  for(let i=0;i<70;i++){ const y=y0+dir*i*8; if(!hBlocked(y,xa,xb,skip)) return y; }
  return null;
}
function clearX(x0, ya, yb, skip, dir){
  for(let i=0;i<40;i++){ const x=x0+dir*i*7; if(!vBlocked(x,ya,yb,skip)) return x; }
  return x0;
}
// 由 x0 向兩側交錯搜尋一條完全淨空的垂直走廊，找不到回傳 null
function findChannel(x0, ya, yb, skip){
  if(!vBlocked(x0, ya, yb, skip)) return x0;
  for(let i=1;i<=130;i++){
    for(const dir of [-1,1]){
      const x = x0 + dir*i*6;
      if(!vBlocked(x, ya, yb, skip)) return x;
    }
  }
  return null;
}

// 把折線轉成平行位移的折線（用於雙線婚姻）
function offsetPoly(pts, d){
  return pts.map((p,i)=>{
    const prev=pts[i-1], next=pts[i+1];
    let dx=0, dy=0;
    const mark=(a,b)=>{ if(!a||!b) return; if(Math.abs(a[1]-b[1])<0.5) dy=d; else dx=d; };
    mark(prev,p); mark(p,next);
    return [p[0]+dx, p[1]+dy];
  });
}

const vSegs=[], hSegs=[];            // 供跳線計算
const spouseDraws=[], childDraws=[], labelDraws=[];

function registerPoly(pts, uid){
  for(let i=0;i+1<pts.length;i++){
    const [x1,y1]=pts[i], [x2,y2]=pts[i+1];
    if(Math.abs(y1-y2)<0.5) hSegs.push({y:y1, x1:Math.min(x1,x2), x2:Math.max(x1,x2), uid});
    else vSegs.push({x:x1, y1:Math.min(y1,y2), y2:Math.max(y1,y2), uid});
  }
}

UNIONS.forEach((u,uid)=>{
  let anchor;
  if(u.spouses){
    const a = nodes[u.spouses[0]], b = nodes[u.spouses[1]];
    if(!a||!b) return;
    const skip=[a.id,b.id];
    const sameRow = Math.abs(midY(a)-midY(b)) < 24;
    let pts;
    if(sameRow){
      const L = a.px<b.px?a:b, R = a.px<b.px?b:a;
      const y = (midY(a)+midY(b))/2;
      const x1 = L.px+NODE_W, x2 = R.px;
      if(!hBlocked(y, x1, x2, skip)){
        pts = [[x1,y],[x2,y]];                       // 直線
        anchor = {x:(x1+x2)/2, y};
      } else {                                        // 有神明擋路 → 從下方繞道
        const s1 = x1+14, s2 = x2-14;
        const dy = clearY(Math.max(botY(L), botY(R))+22, s1, s2, skip);
        pts = [[x1,y],[s1,y],[s1,dy],[s2,dy],[s2,y],[x2,y]];
        anchor = {x:(s1+s2)/2, y:dy};                 // 子嗣從繞道段往下拉，才不會穿過中間的神明
      }
    } else {                                          // 不同列 → 走欄／列之間的空隙
      const hi = a.py<b.py?a:b, lo = a.py<b.py?b:a;
      const exitX = clearX(centerX(hi)+22, botY(hi), botY(hi)+30, skip, 1);
      const gy = clearY(botY(hi)+20, exitX, centerX(lo), skip);
      const fromLeft = centerX(hi) < centerX(lo);
      const chX = clearX(fromLeft ? lo.px-18 : lo.px+NODE_W+18, gy, midY(lo), skip, fromLeft?-1:1);
      const endX = fromLeft ? lo.px : lo.px+NODE_W;
      pts = [[exitX,botY(hi)],[exitX,gy],[chX,gy],[chX,midY(lo)],[endX,midY(lo)]];
      anchor = {x:chX, y:gy};
    }
    const style = u.marriage==='primary' ? 'primary' : (u.marriage||'secondary');
    const polys = style==='primary' ? [offsetPoly(pts,-3), offsetPoly(pts,3)] : [pts];
    polys.forEach(p=>{ registerPoly(p, uid); spouseDraws.push({uid, pts:p, style}); });
    if(u.label) labelDraws.push({x:anchor.x-30, y:anchor.y-9, text:u.label, cls:u.labelClass});
  } else if(u.parent){
    const p = nodes[u.parent];
    if(!p) return;
    anchor = {x:centerX(p), y:botY(p)};
    if(u.label) labelDraws.push({x:anchor.x-30, y:anchor.y+6, text:u.label, cls:u.labelClass});
  }
  if(!anchor || !u.children) return;

  const kids = u.children.map(id=>nodes[id]).filter(Boolean);
  // 讓開的位置必須先低於父母那一列，否則橫向讓開時會切過父母的方塊
  const parents = (u.spouses||[u.parent]).map(id=>nodes[id]).filter(Boolean);
  const parentFloor = Math.max(...parents.map(botY)) + 12;
  // 主幹若會穿過別的神明方塊，先橫向讓開再沿淨空走廊往下
  function trunkTo(busY, skip){
    if(!vBlocked(anchor.x, anchor.y, busY, skip)) return [[anchor.x,anchor.y],[anchor.x,busY]];
    const stubY = clearBand(Math.max(anchor.y+14, parentFloor), anchor.x-280, anchor.x+280, skip, 1);
    if(stubY===null || stubY>=busY || vBlocked(anchor.x, anchor.y, stubY, skip))
      return [[anchor.x,anchor.y],[anchor.x,busY]];
    const x = findChannel(anchor.x, stubY, busY, skip);
    if(x===null || hBlocked(stubY, anchor.x, x, skip)) return [[anchor.x,anchor.y],[anchor.x,busY]];
    return [[anchor.x,anchor.y],[anchor.x,stubY],[x,stubY],[x,busY]];
  }
  // 橫幹盡量貼近孩子，長距離垂直才不會穿過中間的神明
  function routeTo(tx, ty, skip, c){
    if(Math.abs(anchor.x-tx) < 2 && anchor.y < ty-2 && !vBlocked(tx, anchor.y, ty, skip))
      return [[tx,anchor.y],[tx,ty]];
    for(let i=0;i<20;i++){
      const busY = Math.max(anchor.y+10, ty-18-i*9);
      const trunk = trunkTo(busY, skip);
      const lastX = trunk[trunk.length-1][0];
      if(!hBlocked(busY,lastX,tx,skip) && !vBlocked(tx,busY,ty,skip) && !vBlocked(lastX,anchor.y,busY,skip))
        return [...trunk, [tx,busY], [tx,ty]];
      if(busY <= anchor.y+10) break;
    }
    // 從上方進不來 → 改走走廊、從孩子的側邊接入
    if(c){
      const my = midY(c);
      for(const side of [-1,1]){
        const ex = side<0 ? c.px : c.px+NODE_W;
        const chX = findChannel(ex+side*20, Math.min(anchor.y,my), Math.max(anchor.y,my), skip);
        if(chX===null) continue;
        const stubY = clearBand(Math.max(anchor.y+14, parentFloor), Math.min(anchor.x,chX)-10, Math.max(anchor.x,chX)+10, skip, 1);
        if(stubY===null || stubY>=my) continue;
        if(vBlocked(anchor.x,anchor.y,stubY,skip) || hBlocked(stubY,anchor.x,chX,skip)) continue;
        if(vBlocked(chX,stubY,my,skip) || hBlocked(my,chX,ex,skip)) continue;
        return [[anchor.x,anchor.y],[anchor.x,stubY],[chX,stubY],[chX,my],[ex,my]];
      }
    }
    const busY = Math.max(anchor.y+10, ty-18);
    return [...trunkTo(busY, skip), [tx,busY], [tx,ty]];
  }
  // 同一欄堆疊的兄弟姊妹 → 用「梳狀」主幹＋側邊短枝，避免橫線切過兄姊的方塊
  const byCol = new Map();
  kids.forEach(c=>{ const k=Math.round(c.px); if(!byCol.has(k)) byCol.set(k,[]); byCol.get(k).push(c); });
  byCol.forEach((list, colPx)=>{
    const ids = list.map(c=>c.id);
    const skip = ids;   // 只讓線穿過「自己要連到的孩子」，父母與旁人一律避開
    if(list.length===1){
      const c = list[0];
      const pts = routeTo(centerX(c), c.py, skip, c);
      registerPoly(pts, uid); childDraws.push({uid, pts});
      return;
    }
    // 同一欄堆疊的兄弟姊妹 → 左側主幹＋側邊短枝
    list.sort((p,q)=>p.py-q.py);
    const first = list[0], last = list[list.length-1];
    // 主幹要「繞著」兄弟姊妹走，所以這裡不能略過他們的方塊
    const spineX = findChannel(colPx-20, Math.min(anchor.y, midY(first)), midY(last), [])
                ?? clearX(colPx-20, anchor.y, midY(last), [], -1);
    const trunk = routeTo(spineX, midY(first), []).slice(0,-1).concat([[spineX,midY(last)]]);
    registerPoly(trunk, uid); childDraws.push({uid, pts:trunk});
    list.forEach(c=>{
      const ex = spineX < c.px ? c.px : c.px+NODE_W;   // 接到靠近主幹的那一邊，才不會橫穿孩子自己
      const stub = [[spineX,midY(c)],[ex,midY(c)]];
      registerPoly(stub, uid); childDraws.push({uid, pts:stub});
    });
  });
});

/* 跳線：水平線遇到別人的垂直線時，畫半圓弧跨過 */
const EPS=2, R=7, MIN_RUN=34, EDGE_GAP=15;
function bumpsFor(y, xa, xb, uid){
  const lo=Math.min(xa,xb), hi=Math.max(xa,xb);
  if(hi-lo < MIN_RUN) return [];
  const xs=[];
  vSegs.forEach(v=>{
    if(v.uid===uid) return;
    if(v.x > lo+EDGE_GAP && v.x < hi-EDGE_GAP && y > v.y1+EPS && y < v.y2-EPS) xs.push(v.x);
  });
  xs.sort((p,q)=>p-q);
  const merged=[];
  xs.forEach(x=>{ if(!merged.length || x-merged[merged.length-1] > 2*R+4) merged.push(x); });
  return merged;
}
function polyPath(pts, uid){
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i+1<pts.length;i++){
    const [x1,y1]=pts[i], [x2,y2]=pts[i+1];
    if(Math.abs(y1-y2)>=0.5){ d += ` L${x2},${y2}`; continue; }
    const dir = x2>=x1 ? 1 : -1;
    bumpsFor(y1,x1,x2,uid).sort((p,q)=> dir>0?p-q:q-p).forEach(bx=>{
      d += ` L${bx-dir*R},${y1} A${R},${R} 0 0 1 ${bx+dir*R},${y1}`;
    });
    d += ` L${x2},${y2}`;
  }
  return d;
}
function drawPoly(pts, uid, cls, dash){
  const d = polyPath(pts, uid);
  // visible path
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d', d);
  path.setAttribute('class', cls);
  path.dataset.uid = uid;
  if(dash) path.setAttribute('stroke-dasharray', dash);
  svg.appendChild(path);
  // invisible wide hit-area path for easier clicking
  const hit = document.createElementNS('http://www.w3.org/2000/svg','path');
  hit.setAttribute('d', d);
  hit.setAttribute('stroke', 'transparent');
  hit.setAttribute('stroke-width', '14');
  hit.setAttribute('fill', 'none');
  hit.style.cursor = 'pointer';
  hit.dataset.uid = uid;
  svg.appendChild(hit);
}
childDraws.forEach(cd=> drawPoly(cd.pts, cd.uid, 'edge'));
spouseDraws.forEach(s=> drawPoly(s.pts, s.uid,

/* ============ 平移縮放（拖曳/滾輪為即時，按鈕/搜尋為平滑過渡） ============ */
const wrap = document.getElementById('canvasWrap');
let scale=1, tx=40, ty=40;
let dragging=false, lastX, lastY, moved=false;

function setSmooth(on){ stage.classList.toggle('smooth', on); }
function applyTransform(){ stage.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }

function fitInitial(smooth){
  const r = wrap.getBoundingClientRect();
  scale = Math.min(1, (r.width-80)/totalW, (r.height-80)/totalH);
  scale = Math.max(scale, 0.14);
  const scaledW = totalW*scale, scaledH = totalH*scale;
  tx = scaledW < r.width  ? (r.width  - scaledW) / 2 : 40;
  ty = scaledH < r.height ? (r.height - scaledH) / 2 : 40;
  setSmooth(!!smooth);
  applyTransform();
}

wrap.addEventListener('mousedown', e=>{
  dragging=true; moved=false; lastX=e.clientX; lastY=e.clientY; wrap.classList.add('grabbing');
  setSmooth(false);
});
window.addEventListener('mouseup', ()=>{ dragging=false; wrap.classList.remove('grabbing'); });
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  moved=true;
  tx += (e.clientX-lastX); ty += (e.clientY-lastY);
  lastX=e.clientX; lastY=e.clientY;
  applyTransform();
});
wrap.addEventListener('wheel', e=>{
  e.preventDefault();
  setSmooth(false);
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  const factor = e.deltaY<0 ? 1.1 : 0.9;
  zoomAt(mx,my,factor);
}, {passive:false});

function zoomAt(mx,my,factor){
  const newScale = Math.min(3, Math.max(0.1, scale*factor));
  const ratio = newScale/scale;
  tx = mx - (mx-tx)*ratio;
  ty = my - (my-ty)*ratio;
  scale = newScale;
  applyTransform();
}

/* ---- 觸控（手機／平板）：單指拖曳平移、雙指縮放 ---- */
let touchMode = null; // 'pan' | 'pinch'
let pinchStartDist = 0, pinchStartScale = 1, pinchCx = 0, pinchCy = 0;
function touchDist(a,b){ return Math.hypot(b.clientX-a.clientX, b.clientY-a.clientY); }
wrap.addEventListener('touchstart', e=>{
  setSmooth(false);
  if(e.touches.length===1){
    touchMode='pan'; dragging=true; moved=false;
    lastX=e.touches[0].clientX; lastY=e.touches[0].clientY;
  } else if(e.touches.length===2){
    touchMode='pinch'; dragging=false;
    const rect = wrap.getBoundingClientRect();
    pinchStartDist = touchDist(e.touches[0], e.touches[1]);
    pinchStartScale = scale;
    pinchCx = (e.touches[0].clientX+e.touches[1].clientX)/2 - rect.left;
    pinchCy = (e.touches[0].clientY+e.touches[1].clientY)/2 - rect.top;
  }
}, {passive:true});
wrap.addEventListener('touchmove', e=>{
  if(touchMode==='pan' && e.touches.length===1){
    e.preventDefault();
    moved=true;
    const t=e.touches[0];
    tx += (t.clientX-lastX); ty += (t.clientY-lastY);
    lastX=t.clientX; lastY=t.clientY;
    applyTransform();
  } else if(touchMode==='pinch' && e.touches.length===2){
    e.preventDefault();
    const dist = touchDist(e.touches[0], e.touches[1]);
    const newScale = Math.min(3, Math.max(0.1, pinchStartScale*(dist/pinchStartDist)));
    const ratio = newScale/scale;
    tx = pinchCx - (pinchCx-tx)*ratio;
    ty = pinchCy - (pinchCy-ty)*ratio;
    scale = newScale;
    applyTransform();
  }
}, {passive:false});
wrap.addEventListener('touchend', e=>{
  if(e.touches.length===0){ touchMode=null; dragging=false; }
  else if(e.touches.length===1){ touchMode='pan'; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; }
});
function zoomBy(factor){
  setSmooth(true);
  const rect = wrap.getBoundingClientRect();
  zoomAt(rect.width/2, rect.height/2, factor);
}

/* ============ 共用：附圖 + 自訂欄位（神明／妖怪兩邊共用） ============ */
const EDIT_SCRATCH = {};   // 編輯中的暫存陣列，key 為容器 id
function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// localStorage 只有數 MB，原圖直接存會超出配額導致所有編輯一起遺失，故先縮圖
const MAX_IMG_W = 1000;
function readImageScaled(file){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const sc = Math.min(1, MAX_IMG_W/img.width);
        const c = document.createElement('canvas');
        c.width  = Math.max(1, Math.round(img.width *sc));
        c.height = Math.max(1, Math.round(img.height*sc));
        const ctx = c.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); // ponytail: 轉 JPEG 前補白底，否則透明 PNG 會變黑
        ctx.drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',0.82));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function renderEditRows(boxId){
  const box = document.getElementById(boxId);
  const arr = EDIT_SCRATCH[boxId] || [];
  const isImg = boxId.endsWith('-imgs');
  box.innerHTML = arr.map((it,i)=> isImg
    ? `<div class="pe-img" data-i="${i}"><img src="${it.src}"><input class="pe-inp pe-cap" placeholder="圖片註釋" value="${esc(it.caption||'')}"><button class="pe-x" title="刪除此圖">✕</button></div>`
    : `<div class="pe-row" data-i="${i}"><input class="pe-inp pe-fl" placeholder="欄位名稱" value="${esc(it.label||'')}"><input class="pe-inp pe-fv" placeholder="內容" value="${esc(it.value||'')}"><button class="pe-x" title="刪除此欄">✕</button></div>`
  ).join('');
  const idxOf = el => +el.closest('[data-i]').dataset.i;
  box.querySelectorAll('.pe-x' ).forEach(b  => b.onclick   = ()=>{ arr.splice(idxOf(b),1); renderEditRows(boxId); });
  box.querySelectorAll('.pe-cap').forEach(inp=> inp.oninput = ()=>{ arr[idxOf(inp)].caption = inp.value; });
  box.querySelectorAll('.pe-fl' ).forEach(inp=> inp.oninput = ()=>{ arr[idxOf(inp)].label   = inp.value; });
  box.querySelectorAll('.pe-fv' ).forEach(inp=> inp.oninput = ()=>{ arr[idxOf(inp)].value   = inp.value; });
}

async function addImages(input, boxId){

  const ov = {

    kana:         document.getElementById('pe-kana').value.trim()||undefined,
    role:         document.getElementById('pe-role').value.trim()||undefined,
    kojiki:       document.getElementById('pe-kojiki').value.trim()||undefined,
    nihonshoki:   document.getElementById('pe-nihonshoki').value.trim()||undefined,
    reading:      document.getElementById('pe-reading').value.trim()||undefined,
    aliases:      aliasRaw.trim() ? aliasRaw.split(/[，,、]+/).map(s=>s.trim()).filter(Boolean) : undefined,
    desc:         document.getElementById('pe-desc').value.trim()||undefined,
  };
  Object.keys(ov).forEach(k=>{ if(ov[k]===undefined) delete ov[k]; });
  const rec = USER_EDITS_LIVE[id] = Object.assign(USER_EDITS_LIVE[id]||{}, ov);
  // 自訂欄位／附圖：全部刪光時要真的清掉，故明確指派
  const custom = cleanRows('pe-fields'), images = cleanRows('pe-imgs');
  if(custom.length) rec.custom = custom; else delete rec.custom;
  if(images.length) rec.images = images; else delete rec.images;
  if(!saveLS('jmyth_edits', USER_EDITS_LIVE)) return;
  // Patch in-memory node
  const n = nodes[id];
  if(ov.name) n.name=ov.name;
  if(ov.kana) n.kana=ov.kana;
  if(ov.role) n.role=ov.role;
  if(ov.desc) n.desc=ov.desc;
  // Patch live NODE_NAMES
  if(!NODE_NAMES[id]) NODE_NAMES[id]={};
  ['kojiki','nihonshoki','reading','aliases'].forEach(k=>{ if(ov[k]!==undefined) NODE_NAMES[id][k]=ov[k]; });
  // Patch visible node card
  const div = document.querySelector(`.node[data-id="${id}"]`);
  if(div){
    const ne = div.querySelector('.name'); if(ne) ne.textContent = n.name;
    const ke = div.querySelector('.kana'); if(ke) ke.textContent = n.kana||'';
    const re = div.querySelector('.role'); if(re) re.textContent = n.role||'';
  }
  cancelNodeEdit();
  openPanel(n);
}
function resetNodeEdit(){
  if(!editingNodeId) return;
  const id = editingNodeId;
  delete USER_EDITS_LIVE[id];
  saveLS('jmyth_edits', USER_EDITS_LIVE);
  const orig = NODE_DEFS.find(d=>d[0]===id);
  if(orig){
    const n = nodes[id];
    n.name=orig[1]; n.kana=orig[2]; n.role=orig[3]; n.desc=orig[6];
    NODE_NAMES[id] = JSON.parse(JSON.stringify(NODE_NAMES_ORIG[id]||{}));
    const div = document.querySelector(`.node[data-id="${id}"]`);
    if(div){
      const ne=div.querySelector('.name'); if(ne) ne.textContent=n.name;
      const ke=div.querySelector('.kana'); if(ke) ke.textContent=n.kana||'';
      const re=div.querySelector('.role'); if(re) re.textContent=n.role||'';
    }
  }
  cancelNodeEdit();
  openPanel(nodes[id]);
}
async function exportHTML(){
  const editsJSON  = JSON.stringify(USER_EDITS_LIVE);
  const yeditsJSON = JSON.stringify(YOKAI_EDITS_LIVE);
  try{
    const src = await fetch(location.href).then(r=>r.text());
    // 用 replacer 函式，避免註釋文字內的 $& 之類被當成取代樣式
    const updated = src
      .replace(/\/\/ @@EDITS_START[\s\S]*?\/\/ @@EDITS_END/,
        ()=>`// @@EDITS_START\nconst USER_EDITS = ${editsJSON};\n// @@EDITS_END`)
      .replace(/\/\/ @@YEDITS_START[\s\S]*?\/\/ @@YEDITS_END/,
        ()=>`// @@YEDITS_START\nconst YOKAI_USER_EDITS = ${yeditsJSON};\n// @@YEDITS_END`);
    const a = Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([updated],{type:'text/html'})),download:'index.html'});
    a.click();
  }catch{
    prompt('複製以下JSON並貼入USER_EDITS={}的大括號內：', editsJSON);
  }
}

/* ============ 搜尋 + 定位縮放（平滑過渡＋高亮） ============ */
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

let selectedUnionId = null;
function clearHighlight(){
  document.querySelectorAll('.node').forEach(d=>d.classList.remove('highlight','dim'));
  document.querySelectorAll('.edge').forEach(p=>p.classList.remove('hl','dim-edge'));
  document.querySelectorAll('.groupbox').forEach(b=>b.classList.remove('hl'));
  selectedUnionId = null;
}
function highlightUnion(uid){
  selectedUnionId = uid;
  const u = UNIONS[uid];
  if(!u) return;
  const relIds = new Set([...(u.spouses||[]), u.parent, ...(u.children||[])].filter(Boolean));
  document.querySelectorAll('.node').forEach(d=>{
    d.classList.toggle('dim', !relIds.has(d.dataset.id));
    d.classList.toggle('highlight', relIds.has(d.dataset.id));
  });
  document.querySelectorAll('.edge').forEach(p=>{
    const puid = parseInt(p.dataset.uid);
    p.classList.toggle('hl', puid===uid);
    p.classList.toggle('dim-edge', puid!==uid);
  });
}
function fitGroup(memberNodes){
  if(!memberNodes.length) return;
  const rect = wrap.getBoundingClientRect();
  const pad = 80;
  const x0 = Math.min(...memberNodes.map(n=>n.px));
  const y0 = Math.min(...memberNodes.map(n=>n.py));
  const x1 = Math.max(...memberNodes.map(n=>n.px+NODE_W));
  const y1 = Math.max(...memberNodes.map(n=>n.py+(n.h||NODE_H)));
  const cw = x1-x0, ch = y1-y0;
  scale = Math.min(1.5, (rect.width-pad*2)/cw, (rect.height-pad*2)/ch);
  scale = Math.max(scale, 0.14);
  tx = rect.width/2  - (x0+cw/2)*scale;
  ty = rect.height/2 - (y0+ch/2)*scale;
  setSmooth(true);
  applyTransform();
}
function highlightGroup(idx){
  clearHighlight();
  const g = GROUPS[idx];
  if(!g) return;
  const gIds = new Set(g[1]);
  document.querySelectorAll('.node').forEach(d=>d.classList.toggle('dim',!gIds.has(d.dataset.id)));
  document.querySelectorAll(`.groupbox[data-gi="${idx}"]`).forEach(b=>b.classList.add('hl'));
  fitGroup(g[1].map(id=>nodes[id]).filter(Boolean));
}
svg.addEventListener('click', e=>{
  e.stopPropagation();
  if(moved) return; // pan gesture — don't clear selection
  const path = e.target.closest('path[data-uid]');
  if(!path){ clearHighlight(); return; }
  const uid = parseInt(path.dataset.uid);
  if(selectedUnionId===uid){ clearHighlight(); return; }
  highlightUnion(uid);
});

function focusNode(id){
  const n = nodes[id];
  if(!n) return;
  clearHighlight();
  const div = document.querySelector(`.node[data-id="${id}"]`);
  if(div) div.classList.add('highlight');
  const rect = wrap.getBoundingClientRect();
  setSmooth(true);
  scale = Math.min(1.6, Math.max(scale, 1.3));
  tx = rect.width/2 - centerX(n)*scale;
  ty = rect.height/2 - centerY(n)*scale;
  applyTransform();
  openPanel(n);
}

function matchGroups(q){
  return GROUPS.map((g,i)=>({idx:i,label:g[0]})).filter(g=>g.label.includes(q));
}
// 日文舊字體／繁體中文常見異體字，搜尋時視為相同（例：彦／彥）
const KANJI_VARIANTS = {'彦':'彥','応':'應','顕':'顯','継':'繼'};
function normKanji(s){
  return s.replace(/[彦応顕継]/g, ch => KANJI_VARIANTS[ch] || ch);
}
function matchNodes(q){
  q = normKanji(q.toLowerCase().replace(/ /g,''));
  return Object.values(nodes).filter(n =>{
    const nn = NODE_NAMES[n.id]||{};
    const reading = normKanji((nn.reading||'').replace(/ の /g,'の').replace(/ /g,''));
    return normKanji(n.name.toLowerCase()).includes(q) ||
      (n.kana||'').toLowerCase().replace(/ /g,'').includes(q) ||
      normKanji((n.role||'').toLowerCase()).includes(q) ||
      normKanji((nn.nihonshoki||'').toLowerCase()).includes(q) ||
      normKanji((nn.kojiki||'').toLowerCase()).includes(q) ||
      reading.includes(q) ||
      (nn.aliases||[]).some(a=>normKanji(a.toLowerCase().replace(/ /g,'')).includes(q));
  });
}
const searchClear = document.getElementById('searchClear');
let searchFocusIdx = -1;

function showSearchResults(){
  const q = searchInput.value.trim();
  searchClear.style.display = searchInput.value ? 'block' : 'none';
  searchFocusIdx = -1;
  if(!q){ searchResults.style.display='none'; clearHighlight(); return; }
  const gm = matchGroups(q);
  const nm = matchNodes(q);
  let html = gm.map(g=>`<div data-gi="${g.idx}" class="r-group">▸ ${g.label}</div>`).join('');
  html += nm.map(n=>`<div data-id="${n.id}">${n.name}<span class="r-kana">${n.kana||''}</span></div>`).join('');
  searchResults.innerHTML = html || `<div style="color:var(--dim);cursor:default;">找不到符合的神明或群組</div>`;
  searchResults.style.display='block';
}
searchInput.addEventListener('input', showSearchResults);
searchInput.addEventListener('focus', ()=>{ if(searchInput.value.trim()) showSearchResults(); });

searchResults.addEventListener('click', e=>{
  const row = e.target.closest('div[data-id],div[data-gi]');
  if(!row) return;
  if(row.dataset.gi !== undefined) highlightGroup(parseInt(row.dataset.gi));
  else focusNode(row.dataset.id);
  searchResults.style.display='none';
  searchFocusIdx = -1;
  // text stays in input intentionally
});

searchInput.addEventListener('keydown', e=>{
  const rows = [...searchResults.querySelectorAll('div[data-id],div[data-gi]')];
  if(e.key==='ArrowDown'){
    e.preventDefault();
    searchFocusIdx = Math.min(searchFocusIdx+1, rows.length-1);
    rows.forEach((r,i)=>r.classList.toggle('focused', i===searchFocusIdx));
    rows[searchFocusIdx]?.scrollIntoView({block:'nearest'});
    return;
  }
  if(e.key==='ArrowUp'){
    e.preventDefault();
    searchFocusIdx = Math.max(searchFocusIdx-1, 0);
    rows.forEach((r,i)=>r.classList.toggle('focused', i===searchFocusIdx));
    rows[searchFocusIdx]?.scrollIntoView({block:'nearest'});
    return;
  }
  if(e.key==='Escape'){ searchResults.style.display='none'; searchFocusIdx=-1; return; }
  if(e.key==='Enter'){
    if(searchFocusIdx>=0 && rows[searchFocusIdx]){ rows[searchFocusIdx].click(); return; }
    const q = searchInput.value.trim();
    const gm = matchGroups(q)[0];
    if(gm){ highlightGroup(gm.idx); searchResults.style.display='none'; return; }
    const m = matchNodes(q)[0];
    if(m){ focusNode(m.id); searchResults.style.display='none'; }
  }
});

searchClear.addEventListener('click', ()=>{
  searchInput.value='';
  searchClear.style.display='none';
  searchResults.style.display='none';
  searchFocusIdx=-1;
  clearHighlight();
  searchInput.focus();
});

document.addEventListener('click', e=>{
  if(!e.target.closest('#searchBox')) searchResults.style.display='none';
  if(!e.target.closest('.node') && !e.target.closest('#panel') && !e.target.closest('#imgLightbox')) closePanel();
});

/* ============ 妖怪頁：收藏（使用者自訂星星） ============ */
let YOKAI_FAVORITES = {};
try{ YOKAI_FAVORITES = JSON.parse(localStorage.getItem('yokai_favorites')||'{}'); }catch{ YOKAI_FAVORITES = {}; }
let SHOW_FAV_ONLY = false;
let currentYokaiId = null;
function saveFavorites(){ localStorage.setItem('yokai_favorites', JSON.stringify(YOKAI_FAVORITES)); }
function toggleFavorite(id){
  if(!id) return;
  if(YOKAI_FAVORITES[id]) delete YOKAI_FAVORITES[id]; else YOKAI_FAVORITES[id] = true;
  saveFavorites();
  if(SHOW_FAV_ONLY){ renderYokai(); }
  else {
    document.querySelectorAll(`.ycard[data-id="${id}"]`).forEach(c=>{
      c.classList.toggle('favorited', !!YOKAI_FAVORITES[id]);
      const s = c.querySelector('.yfav');
      if(s){ s.textContent = YOKAI_FAVORITES[id]?'★':'☆'; s.classList.toggle('active', !!YOKAI_FAVORITES[id]); }
    });
  }
  if(currentYokaiId===id) updatePanelFavBtn(id);
}
function toggleFavFilter(){
  SHOW_FAV_ONLY = !SHOW_FAV_ONLY;
  document.getElementById('favFilterBtn').classList.toggle('active', SHOW_FAV_ONLY);
  renderYokai();
}
function updatePanelFavBtn(id){
  const btn = document.getElementById('yp-fav-btn');
  const active = !!YOKAI_FAVORITES[id];
  btn.textContent = active ? '★ 已加入收藏' : '☆ 加入收藏';
  btn.classList.toggle('active', active);
}

/* ============ 妖怪頁：平移縮放（滾輪／單指拖曳＝上下捲動，按鈕/點選/雙指＝縮放） ============ */
const ycanvasWrap = document.getElementById('ycanvasWrap');
const ystage = document.getElementById('ystage');
let yscale=1, ytx=0, yty=0;
let ydragging=false, ylastX, ylastY;

function ySetSmooth(on){ ystage.classList.toggle('smooth', on); }
// 邊界限制：內容永遠至少填滿可視範圍的一邊，避免拖曳/滾動出現無邊際的空白區域
function yClamp(){
  const rect = ycanvasWrap.getBoundingClientRect();
  const scaledW = ystage.offsetWidth * yscale, scaledH = ystage.offsetHeight * yscale;
  const minTx = Math.min(0, rect.width - scaledW), maxTx = Math.max(0, rect.width - scaledW);
  const minTy = Math.min(0, rect.height - scaledH), maxTy = Math.max(0, rect.height - scaledH);
  ytx = Math.min(maxTx, Math.max(minTx, ytx));
  yty = Math.min(maxTy, Math.max(minTy, yty));
}
function yApplyTransform(){ yClamp(); ystage.style.transform = `translate(${ytx}px,${yty}px) scale(${yscale})`; }

ycanvasWrap.addEventListener('mousedown', e=>{
  ydragging=true; ylastX=e.clientX; ylastY=e.clientY;
  ySetSmooth(false);
});
window.addEventListener('mouseup', ()=>{ ydragging=false; });
window.addEventListener('mousemove', e=>{
  if(!ydragging) return;
  ytx += (e.clientX-ylastX); yty += (e.clientY-ylastY);
  ylastX=e.clientX; ylastY=e.clientY;
  yApplyTransform();
});
// 滾輪＝上下（含左右）平移，如同一般網頁捲動，而非縮放
ycanvasWrap.addEventListener('wheel', e=>{
  e.preventDefault();
  ySetSmooth(false);
  yty -= e.deltaY;
  ytx -= e.deltaX;
  yApplyTransform();
}, {passive:false});

function yZoomAt(mx,my,factor){
  const newScale = Math.min(2.2, Math.max(0.5, yscale*factor));
  const ratio = newScale/yscale;
  ytx = mx - (mx-ytx)*ratio;
  yty = my - (my-yty)*ratio;
  yscale = newScale;
  yApplyTransform();
}
function yZoomBy(factor){
  ySetSmooth(true);
  const rect = ycanvasWrap.getBoundingClientRect();
  yZoomAt(rect.width/2, rect.height/2, factor);
}
// 行動裝置改用原生上下捲動＋各分類橫向滑動，不套用桌機的平移縮放畫布
function yIsMobile(){ return window.matchMedia('(max-width:700px)').matches; }
function yResetView(){
  if(yIsMobile()){
    ycanvasWrap.scrollTo({top:0, behavior:'smooth'});
    closeYPanel();
    yClearSearch();
    return;
  }
  ySetSmooth(true);
  yscale=1; ytx=0; yty=0;
  yApplyTransform();
  closeYPanel();
  yClearSearch();
}
// 返回頂端＝同時重置縮放與位置（等同「重置檢視」，另外提供圖示按鈕方便隨手點擊）
function yScrollTop(){ yResetView(); }
function yFocusEl(el){
  if(!el) return;
  if(yIsMobile()){ el.scrollIntoView({behavior:'smooth', block:'center', inline:'center'}); return; }
  const rect = ycanvasWrap.getBoundingClientRect();
  ySetSmooth(true);
  yscale = Math.min(1.7, Math.max(yscale, 1.4));
  ytx = rect.width/2 - (el.offsetLeft+el.offsetWidth/2)*yscale;
  yty = rect.height/2 - (el.offsetTop+el.offsetHeight/2)*yscale;
  yApplyTransform();
}

/* ---- 觸控（手機／平板）：單指拖曳平移、雙指縮放（僅桌機寬度以外的觸控裝置停用，改走原生捲動） ---- */
let yTouchMode = null;
let yPinchStartDist = 0, yPinchStartScale = 1, yPinchCx = 0, yPinchCy = 0;
function yTouchDist(a,b){ return Math.hypot(b.clientX-a.clientX, b.clientY-a.clientY); }
ycanvasWrap.addEventListener('touchstart', e=>{
  if(yIsMobile()) return; // 讓瀏覽器原生上下捲動接手，不攔截手勢
  ySetSmooth(false);
  if(e.touches.length===1){
    yTouchMode='pan'; ylastX=e.touches[0].clientX; ylastY=e.touches[0].clientY;
  } else if(e.touches.length===2){
    yTouchMode='pinch';
    const rect = ycanvasWrap.getBoundingClientRect();
    yPinchStartDist = yTouchDist(e.touches[0], e.touches[1]);
    yPinchStartScale = yscale;
    yPinchCx = (e.touches[0].clientX+e.touches[1].clientX)/2 - rect.left;
    yPinchCy = (e.touches[0].clientY+e.touches[1].clientY)/2 - rect.top;
  }
}, {passive:true});
ycanvasWrap.addEventListener('touchmove', e=>{
  if(yTouchMode==='pan' && e.touches.length===1){
    e.preventDefault();
    const t=e.touches[0];
    ytx += (t.clientX-ylastX); yty += (t.clientY-ylastY);
    ylastX=t.clientX; ylastY=t.clientY;
    yApplyTransform();
  } else if(yTouchMode==='pinch' && e.touches.length===2){
    e.preventDefault();
    const dist = yTouchDist(e.touches[0], e.touches[1]);
    const newScale = Math.min(2.2, Math.max(0.5, yPinchStartScale*(dist/yPinchStartDist)));
    const ratio = newScale/yscale;
    ytx = yPinchCx - (yPinchCx-ytx)*ratio;
    yty = yPinchCy - (yPinchCy-yty)*ratio;
    yscale = newScale;
    yApplyTransform();
  }
}, {passive:false});
ycanvasWrap.addEventListener('touchend', e=>{
  if(yIsMobile()) return;
  if(e.touches.length===0){ yTouchMode=null; }
  else if(e.touches.length===1){ yTouchMode='pan'; ylastX=e.touches[0].clientX; ylastY=e.touches[0].clientY; }
});

/* ============ 妖怪頁：渲染 / 面板 / 搜尋 ============ */
const ycontent = document.getElementById('ycontent');
function renderYokai(){
  let html = '';
  YOKAI_GROUPS.forEach(([label, ids, color, special])=>{
    let members = ids.map(id=>yokais[id]).filter(Boolean);
    if(SHOW_FAV_ONLY) members = members.filter(y=>YOKAI_FAVORITES[y.id]);
    if(!members.length) return;
    html += `<div class="ygroup${special?' special':''}"><h3 style="color:${special?color:''}">${special?'🌟 ':''}${label}</h3><div class="ygrid">`;
    members.forEach(y=>{
      const fav = !!YOKAI_FAVORITES[y.id];
      html += `<div class="ycard${y.notable?' notable':''}${y.isNote?' note':''}${fav?' favorited':''}" data-id="${y.id}">
        <span class="yfav${fav?' active':''}" data-id="${y.id}">${fav?'★':'☆'}</span>
        <div class="yname">${y.name}</div>
        ${y.kana?`<div class="ykana">${y.kana}</div>`:''}
        <div class="ycat">${y.category}</div>
      </div>`;
    });
    html += `</div></div>`;
  });
  if(!html) html = `<div id="yfav-empty">尚未收藏任何妖怪，點擊卡片右上角的☆即可加入收藏。</div>`;
  ycontent.innerHTML = html;
  ycontent.querySelectorAll('.yfav').forEach(el=>{
    el.addEventListener('click', ev=>{ ev.stopPropagation(); toggleFavorite(el.dataset.id); });
  });
  ycontent.querySelectorAll('.ycard').forEach(el=>{
    el.addEventListener('click', ()=>{ openYPanel(el.dataset.id); yFocusEl(el); });
  });
}
renderYokai();

const ypanel = document.getElementById('ypanel');
function openYPanel(id){
  const y = yokais[id];
  if(!y) return;
  currentYokaiId = id;
  document.getElementById('yp-name').textContent = y.name;
  document.getElementById('yp-kana').textContent = y.kana||'';
  const yn = YOKAI_NAMES[id]||{};
  const pnames = document.getElementById('yp-names');
  let nhtml = '';
  const row = (label,val)=>`<div class="p-namerow"><span class="p-namelabel">${label}</span>${val}</div>`;
  if(yn.original && yn.original!==y.name) nhtml += row('日文原名',yn.original);
  if(yn.aliases && yn.aliases.length) nhtml += row('別稱',yn.aliases.join('　'));
  const rec = YOKAI_EDITS_LIVE[id];
  nhtml += customRowsHTML(rec);
  pnames.innerHTML = nhtml;
  pnames.style.display = nhtml ? 'block' : 'none';
  const roleEl = document.getElementById('yp-role');
  roleEl.style.display='inline-block'; roleEl.textContent = y.category;
  document.getElementById('yp-desc').textContent = y.desc||'（尚無詳細記載）';
  const figs = document.getElementById('yp-figs');
  figs.innerHTML = figsHTML(rec);
  figs.style.display = figs.innerHTML ? 'flex' : 'none';
  const groupsOf = YOKAI_GROUPS.filter(g=>g[1].includes(id)).map(g=>g[0]);
  document.getElementById('yp-groups').innerHTML = groupsOf.map(g=>`<span>${g}</span>`).join('');
  updatePanelFavBtn(id);
  ypanel.classList.add('open');
  document.querySelectorAll('.ycard').forEach(c=>c.classList.toggle('highlight', c.dataset.id===id));
}
function closeYPanel(){
  ypanel.classList.remove('open');
  cancelYokaiEdit();
  document.querySelectorAll('.ycard').forEach(c=>c.classList.remove('highlight'));
}
function closeYPanelAndReset(){ closeYPanel(); yResetView(); }
document.addEventListener('click', e=>{
  if(!e.target.closest('#ysearchBox')) { const r=document.getElementById('yresults'); if(r) r.style.display='none'; }
  if(!e.target.closest('.ycard') && !e.target.closest('#ypanel') && !e.target.closest('#imgLightbox')) closeYPanel();
});

/* ============ 妖怪編輯 ============ */
function toggleYokaiEdit(){
  const form = document.getElementById('yp-edit-form');
  const sep  = document.getElementById('yp-edit-sep');
  const btn  = document.getElementById('yp-edit-btn');
  if(form.style.display !== 'none'){ cancelYokaiEdit(); return; }
  if(!currentYokaiId) return;
  const y  = yokais[currentYokaiId];
  const yn = Object.assign({}, YOKAI_NAMES_ORIG[currentYokaiId]||{}, YOKAI_EDITS_LIVE[currentYokaiId]||{});
  document.getElementById('ye-name').value     = y.name;
  document.getElementById('ye-kana').value     = y.kana||'';
  document.getElementById('ye-category').value = y.category||'';
  document.getElementById('ye-original').value = yn.original||'';
  document.getElementById('ye-aliases').value  = (yn.aliases||[]).join('，');
  document.getElementById('ye-desc').value     = y.desc||'';
  const rec = YOKAI_EDITS_LIVE[currentYokaiId] || {};
  loadEditRows('ye-fields', rec.custom);
  loadEditRows('ye-imgs',   rec.images);
  form.style.display='block'; sep.style.display='block'; btn.classList.add('open');
  document.getElementById('ye-name').focus();
}
function cancelYokaiEdit(){
  document.getElementById('yp-edit-form').style.display='none';
  document.getElementById('yp-edit-sep').style.display='none';
  document.getElementById('yp-edit-btn').classList.remove('open');
}
function patchYokaiCard(id){
  const y = yokais[id];
  const card = document.querySelector(`.ycard[data-id="${id}"]`);
  if(!card) return;
  const ne=card.querySelector('.yname');  if(ne) ne.textContent=y.name;
  const ke=card.querySelector('.ykana');  if(ke) ke.textContent=y.kana||'';
  const ce=card.querySelector('.ycat');   if(ce) ce.textContent=y.category||'';
}
function saveYokaiEdit(){
  if(!currentYokaiId) return;
  const id = currentYokaiId;
  const aliasRaw = document.getElementById('ye-aliases').value;
  const ov = {
    name:     document.getElementById('ye-name').value.trim()||undefined,
    kana:     document.getElementById('ye-kana').value.trim()||undefined,
    category: document.getElementById('ye-category').value.trim()||undefined,
    original: document.getElementById('ye-original').value.trim()||undefined,
    aliases:  aliasRaw.trim() ? aliasRaw.split(/[，,、]+/).map(s=>s.trim()).filter(Boolean) : undefined,
    desc:     document.getElementById('ye-desc').value.trim()||undefined,
  };
  Object.keys(ov).forEach(k=>{ if(ov[k]===undefined) delete ov[k]; });
  const rec = YOKAI_EDITS_LIVE[id] = Object.assign(YOKAI_EDITS_LIVE[id]||{}, ov);
  const custom = cleanRows('ye-fields'), images = cleanRows('ye-imgs');
  if(custom.length) rec.custom = custom; else delete rec.custom;
  if(images.length) rec.images = images; else delete rec.images;
  if(!saveLS('yokai_edits', YOKAI_EDITS_LIVE)) return;
  const y = yokais[id];
  if(ov.name) y.name=ov.name;
  if(ov.kana) y.kana=ov.kana;
  if(ov.category) y.category=ov.category;
  if(ov.desc) y.desc=ov.desc;
  if(!YOKAI_NAMES[id]) YOKAI_NAMES[id]={};
  ['original','aliases'].forEach(k=>{ if(ov[k]!==undefined) YOKAI_NAMES[id][k]=ov[k]; });
  patchYokaiCard(id);
  cancelYokaiEdit();
  openYPanel(id);
}
function resetYokaiEdit(){
  if(!currentYokaiId) return;
  const id = currentYokaiId;
  delete YOKAI_EDITS_LIVE[id];
  saveLS('yokai_edits', YOKAI_EDITS_LIVE);
  const orig = YOKAI_DEFS.find(d=>d[0]===id);
  if(orig){
    const y = yokais[id];
    y.name=orig[1]; y.kana=orig[2]; y.category=orig[4]; y.desc=orig[5];
    YOKAI_NAMES[id] = JSON.parse(JSON.stringify(YOKAI_NAMES_ORIG[id]||{}));
    patchYokaiCard(id);
  }
  cancelYokaiEdit();
  openYPanel(id);
}

function matchYokai(q){
  q = normKanji(q.toLowerCase().replace(/ /g,''));
  return Object.values(yokais).filter(y=>{
    const yn = YOKAI_NAMES[y.id]||{};
    return normKanji(y.name.toLowerCase()).includes(q) ||
      (y.kana||'').toLowerCase().replace(/ /g,'').includes(q) ||
      normKanji((y.category||'').toLowerCase()).includes(q) ||
      normKanji((yn.original||'').toLowerCase()).includes(q) ||
      (yn.aliases||[]).some(a=>normKanji(a.toLowerCase().replace(/ /g,'')).includes(q));
  });
}
const ysearchInput = document.getElementById('ysearchInput');
const yresults = document.getElementById('yresults');
const ysearchClear = document.getElementById('ysearchClear');
let ysearchFocusIdx = -1;
function showYResults(){
  const q = ysearchInput.value.trim();
  ysearchClear.style.display = ysearchInput.value ? 'block' : 'none';
  ysearchFocusIdx = -1;
  if(!q){ yresults.style.display='none'; document.querySelectorAll('.ycard').forEach(c=>c.classList.remove('dim')); return; }
  const nm = matchYokai(q);
  const matchIds = new Set(nm.map(y=>y.id));
  document.querySelectorAll('.ycard').forEach(c=>c.classList.toggle('dim', !matchIds.has(c.dataset.id)));
  yresults.innerHTML = nm.length ? nm.map(y=>`<div data-id="${y.id}">${y.name}<span class="r-kana">${y.kana||''}</span></div>`).join('')
    : `<div style="color:var(--dim);cursor:default;">找不到符合的妖怪</div>`;
  yresults.style.display='block';
}
function ySelectResultRow(row){
  const el = document.querySelector(`.ycard[data-id="${row.dataset.id}"]`);
  openYPanel(row.dataset.id);
  yFocusEl(el);
  yresults.style.display='none';
  ysearchFocusIdx = -1;
}
ysearchInput.addEventListener('input', showYResults);
ysearchInput.addEventListener('focus', ()=>{ if(ysearchInput.value.trim()) showYResults(); });
yresults.addEventListener('click', e=>{
  const row = e.target.closest('div[data-id]');
  if(!row) return;
  ySelectResultRow(row);
});
ysearchInput.addEventListener('keydown', e=>{
  const rows = [...yresults.querySelectorAll('div[data-id]')];
  if(e.key==='ArrowDown'){
    e.preventDefault();
    ysearchFocusIdx = Math.min(ysearchFocusIdx+1, rows.length-1);
    rows.forEach((r,i)=>r.classList.toggle('focused', i===ysearchFocusIdx));
    rows[ysearchFocusIdx]?.scrollIntoView({block:'nearest'});
    return;
  }
  if(e.key==='ArrowUp'){
    e.preventDefault();
    ysearchFocusIdx = Math.max(ysearchFocusIdx-1, 0);
    rows.forEach((r,i)=>r.classList.toggle('focused', i===ysearchFocusIdx));
    rows[ysearchFocusIdx]?.scrollIntoView({block:'nearest'});
    return;
  }
  if(e.key==='Escape'){ yresults.style.display='none'; ysearchFocusIdx=-1; return; }
  if(e.key==='Enter'){
    if(ysearchFocusIdx>=0 && rows[ysearchFocusIdx]){ ySelectResultRow(rows[ysearchFocusIdx]); return; }
    if(rows[0]) ySelectResultRow(rows[0]);
  }
});
ysearchClear.addEventListener('click', ()=>{
  ysearchInput.value='';
  ysearchClear.style.display='none';
  yresults.style.display='none';
  ysearchFocusIdx=-1;
  document.querySelectorAll('.ycard').forEach(c=>c.classList.remove('dim'));
  ysearchInput.focus();
});
function yClearSearch(){
  ysearchInput.value='';
  ysearchClear.style.display='none';
  yresults.style.display='none';
  ysearchFocusIdx=-1;
  document.querySelectorAll('.ycard').forEach(c=>c.classList.remove('dim'));
}

/* ============ 妖怪頁：頁面切換 ============ */
function openYokai(){
  document.getElementById('japan').style.display='none';
  document.getElementById('home').style.display='none';
  document.getElementById('yokai').style.display='block';
  ySetSmooth(false);
  yscale=1; ytx=0; yty=0;
  yApplyTransform();
  localStorage.setItem('mythCurrentPage','yokai');
}
function closeYokai(){
  document.getElementById('yokai').style.display='none';
  document.getElementById('home').style.display='flex';
  localStorage.setItem('mythCurrentPage','home');
}
function backToMyth(){
  document.getElementById('yokai').style.display='none';
  openJapan();
}

/* ============ 明暗模式 ============ */
function toggleTheme(){
  const cur = document.documentElement.dataset.theme==='light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = cur;
  localStorage.setItem('mythTheme', cur);
}
(function initTheme(){
  const saved = localStorage.getItem('mythTheme');
  if(saved) document.documentElement.dataset.theme = saved;
})();

/* ============ 重整頁面後停留在原本的頁面 ============ */
(function restorePage(){
  const page = localStorage.getItem('mythCurrentPage');
  if(page==='japan') openJapan();
  else if(page==='yokai') openYokai();
})();
