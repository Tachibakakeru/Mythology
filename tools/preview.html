<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神話圖譜・本地即時預覽</title>
<style>
html,body{margin:0;height:100%;background:#080e1b;color:#8bc7ef;font:14px system-ui}body{display:flex;flex-direction:column}header{padding:8px 12px}iframe{flex:1;width:100%;border:0;min-height:0}span{margin-left:12px;color:#a9b9ce}
</style>
<header>神話與傳說・本地即時預覽<span id="status">讀取中…</span></header>
<iframe id="preview" title="神話圖譜"></iframe>
<script>
const frame=document.getElementById('preview'),status=document.getElementById('status');
let page=new URLSearchParams(location.search).get('page')||'aztec',revision='',checking=false;
frame.addEventListener('load',()=>{
  if(typeof frame.contentWindow.openPantheon!=='function')return;
  // 同時保留既有體系與新增傳說；存檔重載時不把日本等舊頁誤換回預設。
  const existing=['japan','greek','norse','egypt','mesopotamia','persia','celtic','arthurian','india','cthulhu','angels','demons','buddhism','china','maya','aztec'];
  if(page==='home'){
    frame.contentWindow.document.getElementById('home').style.display='flex';
    for(const id of ['japan','yokai'])frame.contentWindow.document.getElementById(id).style.display='none';
  }else if(page==='yokai'){
    frame.contentWindow.openYokai();
  }else{
    if(!existing.includes(page)&&![...frame.contentWindow.document.querySelectorAll('[data-legend]')].some(c=>c.dataset.legend===page))page='aztec';
    frame.contentWindow.openPantheon(page);
  }
  status.textContent='已更新 '+new Date().toLocaleTimeString('zh-TW')+'（存檔後自動更新）';
});
// 首次進入也使用新版本URL，避免已快取index卻把當前HEAD當成初始基準。
frame.src='../index.html?preview='+Date.now();
async function check(){
  if(checking)return;
  checking=true;
  try{
    const response=await fetch('../index.html',{method:'HEAD',cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const next=response.headers.get('last-modified')+'|'+response.headers.get('content-length');
    if(revision&&next!==revision){
      const view=frame.contentWindow.document.getElementById('japan');
      const yokaiView=frame.contentWindow.document.getElementById('yokai');
      page=yokaiView.style.display==='block'&&yokaiView.style.opacity!=='0'?'yokai':view.style.display==='block'&&view.style.opacity!=='0'?view.dataset.pantheon||page:'home';
      frame.src='../index.html?preview='+Date.now();
    }
    revision=next;
  }catch{status.textContent='預覽伺服器暫時無法連線，稍後重試';}
  finally{checking=false;}
}
// 僅此開發入口輪詢；正式 index 不載入它，也不寫入使用者的編輯或偏好。
if(['127.0.0.1','localhost'].includes(location.hostname)){check();setInterval(check,5000);}
</script>
</html>
